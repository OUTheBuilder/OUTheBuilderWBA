                                <span>
                                  {
                                    request.status
                                  }
                                </span>

                              </div>

                            )
                          )

                        )}

                      </div>

                    )}

                  </div>

                </div>

              );

            }


            // =====================================================
            // RENDER SCREEN
            // =====================================================

            function renderScreen() {

              switch (
                screen
              ) {

                case "projects":
                  return <Projects />;

                case "files":
                  return <Files />;

                case "build":
                  return <Build />;

                case "chat":
                  return <Chat />;

                case "flow":
                  return <Flow />;

                case "drive":
                  return <Drive />;

                case "settings":
                  return <Settings />;

                default:
                  return <Home />;

              }

            }


            // =====================================================
            // ACCESS CHECK
            // =====================================================

            if (
              !authenticated
            ) {

              return (
                <AccessScreen />
              );

            }


            // =====================================================
            // MAIN APPLICATION
            // =====================================================

            return (

              <div
                className="app-shell"
              >

                <header
                  className="mobile-header"
                >

                  <button
                    className="brand-button"
                    onClick={() =>
                      setScreen(
