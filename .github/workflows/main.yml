            // =====================================================
            // SETTINGS
            // =====================================================

            function Settings() {

              const [
                key,
                setKey
              ] = useState(
                apiKey
              );


              function saveKey() {

                localStorage.setItem(
                  "ou_openrouter_key",
                  key.trim()
                );

                setApiKey(
                  key.trim()
                );


                alert(
                  "OpenRouter key saved locally on this browser."
                );

              }


              function generateCode(
                roleName
              ) {

                const codes =
                  JSON.parse(
                    localStorage.getItem(
                      "ou_codes"
                    ) || "{}"
                  );


                const prefix =
                  roleName ===
                  "Admin"
                    ? "ADM"
                    : roleName ===
                      "Member"
                    ? "MEM"
                    : "GST";


                const code =
                  prefix +
                  "-" +
                  Math.random()
                    .toString(36)
                    .substring(
                      2,
                      8
                    )
                    .toUpperCase();


                codes[
                  crypto.randomUUID()
                ] = {

                  code,

                  role:
                    roleName,

                  created:
                    new Date().toISOString()

                };


                localStorage.setItem(
                  "ou_codes",
                  JSON.stringify(
                    codes
                  )
                );


                alert(
                  `${roleName} code created: ${code}`
                );

              }


              const requests =
                JSON.parse(
                  localStorage.getItem(
                    "ou_access_requests"
                  ) || "[]"
                );


              return (

                <div>

                  <PageHeader
                    title="Settings"
                    text="Configure OU The Builder."
                  />


                  <div
                    className="settings-grid"
                  >

                    <div
                      className="panel"
                    >

                      <h2>
                        AI Agent Settings
                      </h2>


                      <p>
                        Connect the chat to
                        OpenRouter's free
                        model system.
                      </p>


                      <label>
                        OpenRouter API Key
                      </label>


                      <input
                        type="password"
                        value={
                          key
                        }
                        onChange={
                          event =>
                            setKey(
                              event.target.value
                            )
                        }
                        placeholder="Enter your API key"
                      />


                      <button
                        className="primary-button"
                        onClick={
                          saveKey
                        }
                      >
                        SAVE AI KEY
                      </button>


                      <div
                        className="info-box"
                      >

                        Current model route:

                        <strong>
                          {
                            FREE_MODEL
                          }
                        </strong>

                      </div>


                      <p
                        className="small-muted"
                      >
                        This foundation stores
                        the key locally in the
                        browser. It will be moved
                        to a secure backend later.
                      </p>

                    </div>


                    {role ===
                      "Super Admin" && (

                      <div
                        className="panel"
                      >

                        <h2>
                          Super Admin
                        </h2>


                        <p>
                          Administrative controls
                          for the foundation.
                        </p>


                        <div
                          className="limit-row"
                        >

                          <span>
                            Default Super Admin
                          </span>

                          <strong>
                            Admins123
                          </strong>

                        </div>


                        <div
                          className="limit-row"
                        >

                          <span>
                            Admin codes
                          </span>

                          <strong>
                            Maximum 3
                          </strong>

                        </div>


                        <div
                          className="limit-row"
                        >

                          <span>
                            Member codes
                          </span>

                          <strong>
                            Maximum 2
                          </strong>

                        </div>


                        <div
                          className="limit-row"
                        >

                          <span>
                            Guest codes
                          </span>

                          <strong>
                            Maximum 10
                          </strong>

                        </div>


                        <h3>
                          Generate Access Code
                        </h3>


                        <div
                          className="button-row"
                        >

                          <button
                            className="secondary-button"
                            onClick={() =>
                              generateCode(
                                "Admin"
                              )
                            }
                          >
                            ADMIN
                          </button>


                          <button
                            className="secondary-button"
                            onClick={() =>
                              generateCode(
                                "Member"
                              )
                            }
                          >
                            MEMBER
                          </button>


                          <button
                            className="secondary-button"
                            onClick={() =>
                              generateCode(
                                "Guest"
                              )
                            }
                          >
                            GUEST
                          </button>

                        </div>

                      </div>

                    )}


                    {role ===
                      "Super Admin" && (

                      <div
                        className="panel"
                      >

                        <h2>
                          Access Requests
                        </h2>


                        {requests.length ===
                        0 ? (

                          <p
                            className="muted"
                          >
                            No access requests.
                          </p>

                        ) : (

                          requests.map(
                            request => (

                              <div
                                className="request-item"
                                key={
                                  request.id
                                }
                              >

                                <strong>
                                  {
                                    request.name
