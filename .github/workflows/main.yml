name: OU The Builder WBA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy WBA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Show project structure
        run: |
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort | head -200

      - name: Verify source files
        run: |
          set -e

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          if [ ! -d "src" ]; then
            echo "ERROR: src directory was not found."
            exit 1
          fi

          if [ ! -f "src/App.jsx" ]; then
            echo "ERROR: src/App.jsx was not found."
            exit 1
          fi

          echo "package.json found."
          echo "src directory found."
          echo "src/App.jsx found."

      - name: Check App.jsx for accidental YAML
        run: |
          set -e

          if grep -n "^- name:" src/App.jsx; then
            echo ""
            echo "ERROR: GitHub Actions YAML was found inside src/App.jsx."
            echo "Please restore src/App.jsx to the last valid React version."
            exit 1
          fi

          if grep -n "uses: actions/" src/App.jsx; then
            echo ""
            echo "ERROR: GitHub Actions configuration was found inside src/App.jsx."
            exit 1
          fi

          echo "App.jsx does not contain GitHub Actions YAML."

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build application
        run: |
          npm run build

      - name: Verify build
        run: |
          set -e

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Build output:"
          find dist -maxdepth 3 -type f | sort

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ou-the-builder-wba
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Final status
        run: |
          echo ""
          echo "========================================"
          echo "OU THE BUILDER WBA"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Node.js:"
          node --version
          echo ""
          echo "Website:"
          echo "https://outhebuilder.github.io/OUTheBuilderWBA/"
