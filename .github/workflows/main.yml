name: OU The Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      android_project_zip:
        description: "Optional direct HTTPS URL to an Android project ZIP"
        required: false
        type: string

      google_drive_file_id:
        description: "Temporary Google Drive file ID for an Android project ZIP"
        required: false
        type: string

      android_build_type:
        description: "Android build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

      android_gradle_task:
        description: "Optional Gradle task (leave blank for automatic detection)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  # ============================================================
  # EXISTING WBA BUILD + GITHUB PAGES DEPLOYMENT
  # ============================================================

  build-and-deploy-wba:
    name: Build and Deploy OU The Builder WBA
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build OU The Builder WBA
        shell: bash
        run: |
          set -e
          npm run build

      - name: Verify WBA build
        shell: bash
        run: |
          set -e

          test -f dist/index.html

          echo "WBA build verified successfully."
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort | head -200

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WBA Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy WBA to GitHub Pages
        uses: actions/deploy-pages@v4


  # ============================================================
  # REMOTE ANDROID BUILD
  #
  # Supports:
  # 1. Direct HTTPS Android project ZIP
  # 2. Temporary Google Drive project ZIP through
  #    the OU The Builder Build Bridge
  #
  # This job is independent from the WBA Pages deployment.
  # ============================================================

  remote-android-build:
    name: Remote Android APK Build
    runs-on: ubuntu-24.04

    if: >
      github.event_name == 'workflow_dispatch' &&
      (
        github.event.inputs.android_project_zip != '' ||
        github.event.inputs.google_drive_file_id != ''
      )

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ----------------------------------------------------------
      # DOWNLOAD / PREPARE ANDROID PROJECT
      #
      # Priority:
      # Google Drive file ID if supplied.
      # Otherwise direct HTTPS ZIP URL.
      # ----------------------------------------------------------

      - name: Prepare Android project workspace
        shell: bash
        env:
          PROJECT_ZIP_URL: ${{ github.event.inputs.android_project_zip }}
          GOOGLE_DRIVE_FILE_ID: ${{ github.event.inputs.google_drive_file_id }}
          GOOGLE_DRIVE_BRIDGE_URL: ${{ secrets.GOOGLE_DRIVE_BRIDGE_URL }}
          GOOGLE_DRIVE_BRIDGE_SECRET: ${{ secrets.GOOGLE_DRIVE_BRIDGE_SECRET }}

        run: |
          set -euo pipefail

          rm -rf android-build
          mkdir -p android-build

          echo "=========================================="
          echo "PREPARING ANDROID PROJECT"
          echo "=========================================="

          # ------------------------------------------------------
          # GOOGLE DRIVE TEMPORARY PROJECT
          # ------------------------------------------------------

          if [ -n "$GOOGLE_DRIVE_FILE_ID" ]; then

            echo "Source: Google Drive temporary project"
            echo "Google Drive file ID received."

            if [ -z "$GOOGLE_DRIVE_BRIDGE_URL" ]; then
              echo "::error::GOOGLE_DRIVE_BRIDGE_URL secret is missing."
              exit 1
            fi

            if [ -z "$GOOGLE_DRIVE_BRIDGE_SECRET" ]; then
              echo "::error::GOOGLE_DRIVE_BRIDGE_SECRET secret is missing."
              exit 1
            fi

            echo "Requesting temporary project from build bridge..."

            ENCODED_FILE_ID="$(
              printf '%s' "$GOOGLE_DRIVE_FILE_ID" |
              jq -sRr @uri
            )"

            ENCODED_SECRET="$(
              printf '%s' "$GOOGLE_DRIVE_BRIDGE_SECRET" |
              jq -sRr @uri
            )"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --connect-timeout 30 \
              --output bridge-response.json \
              "$GOOGLE_DRIVE_BRIDGE_URL?action=download&fileId=$ENCODED_FILE_ID&secret=$ENCODED_SECRET"

            echo "Bridge response received."

            jq -e \
              '.ok == true and (.base64 | type == "string")' \
              bridge-response.json \
              >/dev/null

            echo "Bridge download verified."

            jq -r '.base64' bridge-response.json |
              base64 --decode > android-project.zip

            rm -f bridge-response.json

          # ------------------------------------------------------
          # EXISTING DIRECT HTTPS PROJECT
          # ------------------------------------------------------

          elif [ -n "$PROJECT_ZIP_URL" ]; then

            echo "Source: direct HTTPS project ZIP"

            curl \
              --fail \
              --location \
              --show-error \
              --retry 3 \
              --connect-timeout 30 \
              --output android-project.zip \
              "$PROJECT_ZIP_URL"

          else

            echo "::error::No Android project source was provided."
            exit 1

          fi

          # ------------------------------------------------------
          # VERIFY ZIP
          # ------------------------------------------------------

          test -s android-project.zip

          echo "Android project ZIP downloaded successfully."

          echo
          echo "ZIP information:"
          ls -lh android-project.zip

          # ------------------------------------------------------
          # EXTRACT PROJECT
          # ------------------------------------------------------

          unzip -q android-project.zip -d android-build

          echo
          echo "Extracted project files:"
          find android-build \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300


      # ----------------------------------------------------------
      # LOCATE GRADLE PROJECT
      # ----------------------------------------------------------

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          GRADLEW_PATH="$(
            find android-build \
              -type f \
              -name gradlew \
              -print \
              -quit \
              || true
          )"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew file was found in the uploaded Android project."
            echo
            echo "The Android project must contain:"
            echo "gradlew"
            echo "gradle/wrapper/gradle-wrapper.jar"
            echo
            echo "Files found:"
            find android-build -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # VALIDATE GRADLE WRAPPER
      # ----------------------------------------------------------

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f gradlew

          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing."
            exit 1
          fi

          echo "Gradle wrapper:"
          ./gradlew --version


      # ----------------------------------------------------------
      # INSPECT PROJECT
      # ----------------------------------------------------------

      - name: Inspect Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "ANDROID PROJECT"
          echo "=============================="

          echo
          echo "Project directory:"
          pwd

          echo
          echo "Gradle files:"

          find . \
            -maxdepth 4 \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print \
            | sort

          echo
          echo "Android manifests:"

          find . \
            -name AndroidManifest.xml \
            -print \
            | sort


      # ----------------------------------------------------------
      # DETERMINE BUILD TASK
      # ----------------------------------------------------------

      - name: Determine Gradle build task
        shell: bash
        env:
          REQUESTED_TASK: ${{ github.event.inputs.android_gradle_task }}
          BUILD_TYPE: ${{ github.event.inputs.android_build_type }}

        run: |
          set -e

          if [ -n "$REQUESTED_TASK" ]; then

            BUILD_TASK="$REQUESTED_TASK"

          elif [ "$BUILD_TYPE" = "release" ]; then

            BUILD_TASK="assembleRelease"

          else

            BUILD_TASK="assembleDebug"

          fi

          echo "Gradle task:"
          echo "$BUILD_TASK"

          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # BUILD APK
      # ----------------------------------------------------------

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "OU THE BUILDER REMOTE BUILD"
          echo "=========================================="

          echo
          echo "Project:"
          echo "$PROJECT_DIR"

          echo
          echo "Gradle task:"
          echo "$BUILD_TASK"

          echo
          echo "Java:"
          java -version

          echo
          echo "Starting Gradle..."

          ./gradlew "$BUILD_TASK" \
            --stacktrace \
            --no-daemon \
            2>&1 |
            tee "$GITHUB_WORKSPACE/android-build.log"


      # ----------------------------------------------------------
      # LOCATE APK
      # ----------------------------------------------------------

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" |
            wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Gradle completed but no APK was found."
            exit 1
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/android-build-output"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} \
            "$GITHUB_WORKSPACE/android-build-output/" \;


      # ----------------------------------------------------------
      # BUILD INFORMATION
      # ----------------------------------------------------------

      - name: Save build information
        shell: bash
        run: |
          set -e

          cat > \
            "$GITHUB_WORKSPACE/android-build-output/build-info.txt" \
            <<EOF

          OU The Builder Remote Android Build

          Repository:
          $GITHUB_REPOSITORY

          Commit:
          $GITHUB_SHA

          Build type:
          ${{ github.event.inputs.android_build_type }}

          Gradle task:
          $BUILD_TASK

          Project directory:
          $PROJECT_DIR

          Java:
          17

          Android SDK:
          36

          Build tools:
          36.0.0

          Build source:
          $(
            if [ -n "${GOOGLE_DRIVE_FILE_ID:-}" ]; then
              echo "Google Drive temporary storage"
            else
              echo "Direct HTTPS ZIP"
            fi
          )

          EOF


      # ----------------------------------------------------------
      # INCLUDE BUILD LOG
      # ----------------------------------------------------------

      - name: Include build log
        shell: bash
        run: |
          set -e

          cp \
            "$GITHUB_WORKSPACE/android-build.log" \
            "$GITHUB_WORKSPACE/android-build-output/android-build.log"


      # ----------------------------------------------------------
      # UPLOAD APK + LOG
      # ----------------------------------------------------------

      - name: Upload APK and build log
        uses: actions/upload-artifact@v4
        with:
          name: ou-the-builder-android-build-${{ github.run_number }}
          path: android-build-output
          if-no-files-found: error
          retention-days: 7


      # ----------------------------------------------------------
      # DELETE TEMPORARY GOOGLE DRIVE PROJECT
      #
      # always() means this cleanup runs even if the build fails.
      # ----------------------------------------------------------

      - name: Remove temporary Google Drive project
        if: >
          always() &&
          github.event.inputs.google_drive_file_id != ''

        shell: bash

        env:
          GOOGLE_DRIVE_BRIDGE_URL: ${{ secrets.GOOGLE_DRIVE_BRIDGE_URL }}
          GOOGLE_DRIVE_BRIDGE_SECRET: ${{ secrets.GOOGLE_DRIVE_BRIDGE_SECRET }}
          GOOGLE_DRIVE_FILE_ID: ${{ github.event.inputs.google_drive_file_id }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TEMPORARY GOOGLE DRIVE CLEANUP"
          echo "=========================================="

          if [ -z "$GOOGLE_DRIVE_BRIDGE_URL" ]; then
            echo "::warning::GOOGLE_DRIVE_BRIDGE_URL is missing."
            echo "Temporary Google Drive file was not removed."
            exit 0
          fi

          if [ -z "$GOOGLE_DRIVE_BRIDGE_SECRET" ]; then
            echo "::warning::GOOGLE_DRIVE_BRIDGE_SECRET is missing."
            echo "Temporary Google Drive file was not removed."
            exit 0
          fi

          jq -n \
            --arg action "delete" \
            --arg secret "$GOOGLE_DRIVE_BRIDGE_SECRET" \
            --arg fileId "$GOOGLE_DRIVE_FILE_ID" \
            '{
              action: $action,
              secret: $secret,
              fileId: $fileId
            }' \
            > delete-request.json

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --request POST \
            --header "Content-Type: application/json" \
            --data @delete-request.json \
            "$GOOGLE_DRIVE_BRIDGE_URL"

          rm -f delete-request.json

          echo
          echo "Temporary Google Drive project removed."


      # ----------------------------------------------------------
      # FINAL STATUS
      # ----------------------------------------------------------

      - name: Build completed
        shell: bash
        run: |
          echo "=========================================="
          echo "OU THE BUILDER ANDROID BUILD COMPLETED"
          echo "=========================================="

          echo
          echo "APK files:"

          find \
            android-build-output \
            -type f \
            -name "*.apk" \
            -print

          echo
          echo "APK and build log are available"
          echo "in the GitHub Actions artifact."
