name: OU The Builder WBA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ou-the-builder-wba"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # 2. Node.js 24
      # ---------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # ---------------------------------------------------------
      # 3. Create application directories
      # ---------------------------------------------------------
      - name: Create WBA structure
        shell: bash
        run: |
          set -e

          mkdir -p client/src
          mkdir -p server
          mkdir -p docs

      # ---------------------------------------------------------
      # 4. Root package
      # ---------------------------------------------------------
      - name: Create root package
        shell: bash
        run: |
          cat > package.json <<'JSON'
          {
            "name": "ou-the-builder-wba",
            "private": true,
            "version": "0.2.0",
            "workspaces": [
              "client",
              "server"
            ],
            "scripts": {
              "build": "npm run build --workspace client",
              "start": "npm start --workspace server"
            }
          }
          JSON

      # ---------------------------------------------------------
      # 5. Frontend package
      # ---------------------------------------------------------
      - name: Create frontend package
        shell: bash
        run: |
          cat > client/package.json <<'JSON'
          {
            "name": "ou-the-builder-wba-client",
            "private": true,
            "version": "0.2.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@vitejs/plugin-react": "^5.0.4",
              "vite": "^7.1.7",
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {}
          }
          JSON

      # ---------------------------------------------------------
      # 6. Vite configuration
      # ---------------------------------------------------------
      - name: Create Vite configuration
        shell: bash
        run: |
          cat > client/vite.config.js <<'JS'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            base: './'
          })
          JS

      # ---------------------------------------------------------
      # 7. HTML
      # ---------------------------------------------------------
      - name: Create HTML entry
        shell: bash
        run: |
          cat > client/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              />
              <meta
                name="description"
                content="OU The Builder - AI-powered web-based application builder"
              />
              <meta name="theme-color" content="#07101f" />
              <title>OU The Builder</title>
            </head>

            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML

      # ---------------------------------------------------------
      # 8. React entry
      # ---------------------------------------------------------
      - name: Create React entry
        shell: bash
        run: |
          cat > client/src/main.jsx <<'JS'
          import React from 'react'
          import { createRoot } from 'react-dom/client'
          import App from './App.jsx'
          import './App.css'

          createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          )
          JS

      # ---------------------------------------------------------
      # 9. Main application
      # ---------------------------------------------------------
      - name: Create WBA application
        shell: bash
        run: |
          cat > client/src/App.jsx <<'JS'
          import React, { useEffect, useMemo, useRef, useState } from 'react'

          const navItems = [
            { id: 'home', icon: '⌂', label: 'Home' },
            { id: 'projects', icon: '▣', label: 'Projects' },
            { id: 'files', icon: '▤', label: 'Files' },
            { id: 'build', icon: '⚙', label: 'Build' },
            { id: 'chat', icon: '▢', label: 'AI Chat' },
            { id: 'flow', icon: '◇', label: 'Image Flow' },
            { id: 'drive', icon: '△', label: 'Google Drive' },
            { id: 'settings', icon: '⚙', label: 'Settings' }
          ]

          const initialProjects = []

          function loadProjects() {
            try {
              return JSON.parse(
                localStorage.getItem('ou-builder-projects') || 'null'
              ) || initialProjects
            } catch {
              return initialProjects
            }
          }

          function loadActivity() {
            try {
              return JSON.parse(
                localStorage.getItem('ou-builder-activity') || 'null'
              ) || []
            } catch {
              return []
            }
          }

          function App() {
            const [active, setActive] = useState('home')
            const [projects, setProjects] = useState(loadProjects)
            const [activity, setActivity] = useState(loadActivity)
            const [selectedProject, setSelectedProject] = useState(null)
            const [files, setFiles] = useState([])
            const [showProjectDialog, setShowProjectDialog] = useState(false)
            const [projectName, setProjectName] = useState('')
            const [chatMessage, setChatMessage] = useState('')
            const [chatMessages, setChatMessages] = useState([
              {
                type: 'builder',
                text:
                  "Hello! I'm your OU The Builder AI assistant. 👋 You can ask me about projects, files, building, APK compilation, or the application flow."
              }
            ])
            const [buildStatus, setBuildStatus] = useState('Ready')
            const fileInput = useRef(null)

            useEffect(() => {
              localStorage.setItem(
                'ou-builder-projects',
                JSON.stringify(projects)
              )
            }, [projects])

            useEffect(() => {
              localStorage.setItem(
                'ou-builder-activity',
                JSON.stringify(activity)
              )
            }, [activity])

            const currentProject = useMemo(
              () =>
                projects.find(
                  project => project.id === selectedProject
                ) || null,
              [projects, selectedProject]
            )

            function addActivity(text) {
              setActivity(previous => [
                {
                  id: Date.now(),
                  text,
                  time: new Date().toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                  })
                },
                ...previous
              ].slice(0, 8))
            }

            function createProject() {
              const name = projectName.trim()

              if (!name) return

              const project = {
                id: Date.now().toString(),
                name,
                target: 'Android APK',
                files: [],
                created: new Date().toISOString()
              }

              setProjects(previous => [project, ...previous])
              setSelectedProject(project.id)
              setProjectName('')
              setShowProjectDialog(false)
              addActivity(`Created project "${name}"`)
              setActive('projects')
            }

            function handleFiles(event) {
              const selectedFiles = Array.from(event.target.files || [])

              if (!selectedFiles.length) return

              const fileInfo = selectedFiles.map(file => ({
                id: `${file.name}-${file.size}-${Date.now()}`,
                name: file.name,
                size: file.size,
                type: file.type || 'Unknown',
                modified: new Date().toISOString()
              }))

              setFiles(previous => [...fileInfo, ...previous])
              addActivity(
                `${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''} uploaded`
              )
              setActive('files')

              event.target.value = ''
            }

            function openUpload() {
              fileInput.current?.click()
            }

            function sendChat(text = chatMessage) {
              const message = text.trim()

              if (!message) return

              setChatMessages(previous => [
                ...previous,
                { type: 'user', text: message }
              ])

              setChatMessage('')

              const lower = message.toLowerCase()

              let response =
                'I can work with your project system, files, build system, and application flow. This AI connection will be connected to the backend in the next stage.'

              if (lower.includes('project')) {
                response =
                  'I can create and manage projects. Use "Create New Project" to start one.'
              } else if (
                lower.includes('upload') ||
                lower.includes('file')
              ) {
                response =
                  'Use the Files section or "Upload File". Uploaded files will become part of the centralized Builder file system as the backend is connected.'
              } else if (
                lower.includes('apk') ||
                lower.includes('build') ||
                lower.includes('compile')
              ) {
                response =
                  'The Build system is being prepared for remote Android compilation. The same project source will be used by manual and AI build commands.'
              } else if (
                lower.includes('flow') ||
                lower.includes('screen')
              ) {
                response =
                  'Image Flow will provide a visual representation of project screens, buttons, and navigation.'
              }

              setTimeout(() => {
                setChatMessages(previous => [
                  ...previous,
                  { type: 'builder', text: response }
                ])
              }, 250)
            }

            function runBuild() {
              if (!currentProject) {
                setActive('projects')
                addActivity('Build requested without a selected project')
                return
              }

              setBuildStatus('Preparing...')
              addActivity(`Build started for "${currentProject.name}"`)

              setTimeout(() => setBuildStatus('Checking project...'), 700)
              setTimeout(() => setBuildStatus('Ready for remote compile'), 1500)
            }

            function renderHome() {
              return (
                <>
                  <section className="welcome">
                    <div className="welcome-copy">
                      <div className="eyebrow">WEB-BASED APPLICATION</div>

                      <h1>
                        Welcome to
                        <br />
                        <span>OU</span> The Builder
                      </h1>

                      <p>
                        Your AI-powered web-based app builder. Create,
                        manage, build and bring your ideas to life — faster
                        and easier.
                      </p>
                    </div>

                    <div className="hero-art">
                      <div className="monitor">
                        <div className="monitor-top">
                          <i />
                          <i />
                          <i />
                        </div>
                        <div className="code">&lt;/&gt;</div>
                      </div>

                      <div className="phone">
                        <div>◆</div>
                      </div>

                      <div className="cloud">↑</div>
                    </div>
                  </section>

                  <section className="feature-grid">
                    <FeatureCard
                      icon="▢"
                      title="AI Builder"
                      text="Use the AI chat as the central control interface for all builder capabilities."
                      className="blue"
                      onClick={() => setActive('chat')}
                    />

                    <FeatureCard
                      icon="▣"
                      title="Projects"
                      text="Create and manage your projects, files and resources in one place."
                      className="green"
                      onClick={() => setActive('projects')}
                    />

                    <FeatureCard
                      icon="⚙"
                      title="Build"
                      text="Prepare your project for remote compilation and APK generation."
                      className="orange"
                      onClick={() => setActive('build')}
                    />

                    <FeatureCard
                      icon="◇"
                      title="Image Flow"
                      text="Visualize your app's screens, buttons and flows before compiling."
                      className="purple"
                      onClick={() => setActive('flow')}
                    />
                  </section>

                  <section className="home-columns">
                    <div className="chat-panel">
                      <ChatPanel
                        messages={chatMessages}
                        message={chatMessage}
                        setMessage={setChatMessage}
                        onSend={sendChat}
                        onQuick={sendChat}
                      />
                    </div>

                    <aside className="right-stack">
                      <CurrentProject
                        project={currentProject}
                        onNew={() => setShowProjectDialog(true)}
                        onOpen={() => setActive('projects')}
                      />

                      <QuickActions
                        onNew={() => setShowProjectDialog(true)}
                        onUpload={openUpload}
                        onDrive={() => setActive('drive')}
                        onLogs={() => setActive('build')}
                      />

                      <SystemStatus />
                      <RecentActivity activity={activity} />
                    </aside>
                  </section>
                </>
              )
            }

            function renderPage() {
              if (active === 'home') return renderHome()

              if (active === 'projects') {
                return (
                  <Page
                    title="Projects"
                    subtitle="Create and manage your Builder projects."
                    action={
                      <button
                        className="primary-button"
                        onClick={() => setShowProjectDialog(true)}
                      >
                        + New Project
                      </button>
                    }
                  >
                    <div className="section-grid">
                      {projects.length === 0 ? (
                        <EmptyState
                          icon="▣"
                          title="No projects yet"
                          text="Create your first Builder project to get started."
                          action={
                            <button
                              className="primary-button"
                              onClick={() => setShowProjectDialog(true)}
                            >
                              Create New Project
                            </button>
                          }
                        />
                      ) : (
                        projects.map(project => (
                          <article
                            className={`project-card ${
                              selectedProject === project.id
                                ? 'selected'
                                : ''
                            }`}
                            key={project.id}
                            onClick={() => setSelectedProject(project.id)}
                          >
                            <div className="project-icon">▣</div>
                            <div>
                              <h3>{project.name}</h3>
                              <p>{project.target}</p>
                              <small>
                                {new Date(project.created).toLocaleDateString()}
                              </small>
                            </div>
                          </article>
                        ))
                      )}
                    </div>
                  </Page>
                )
              }

              if (active === 'files') {
                return (
                  <Page
                    title="Files"
                    subtitle="Central project files and uploaded resources."
                    action={
                      <button
                        className="primary-button"
                        onClick={openUpload}
                      >
                        ↑ Upload File
                      </button>
                    }
                  >
                    <div className="file-drop" onClick={openUpload}>
                      <div className="drop-icon">↑</div>
                      <h3>Upload project files</h3>
                      <p>
                        ZIP, source files, documents, images, audio, video
                        and project resources.
                      </p>
                      <span>Tap to choose files</span>
                    </div>

                    <div className="file-list">
                      {files.length === 0 ? (
                        <EmptyState
                          icon="▤"
                          title="No uploaded files"
                          text="Files uploaded through this interface will appear here."
                        />
                      ) : (
                        files.map(file => (
                          <div className="file-row" key={file.id}>
                            <div className="file-icon">▤</div>
                            <div className="file-info">
                              <strong>{file.name}</strong>
                              <span>
                                {formatSize(file.size)} · {file.type}
                              </span>
                            </div>
                            <span className="file-ready">Ready</span>
                          </div>
                        ))
                      )}
                    </div>
                  </Page>
                )
              }

              if (active === 'build') {
                return (
                  <Page
                    title="Build"
                    subtitle="Prepare and compile the selected project."
                  >
                    <div className="build-layout">
                      <section className="build-card">
                        <div className="build-header">
                          <div>
                            <span className="eyebrow">BUILD TARGET</span>
                            <h2>Android APK</h2>
                          </div>

                          <span className="status-pill ready">
                            {buildStatus}
                          </span>
                        </div>

                        <div className="build-options">
                          <div className="build-option active">
                            <strong>Android APK</strong>
                            <span>Remote Android compilation</span>
                          </div>

                          <div className="build-option">
                            <strong>Web App</strong>
                            <span>Web deployment target</span>
                          </div>
                        </div>

                        <div className="build-project">
                          <span>Current Project</span>
                          <strong>
                            {currentProject
                              ? currentProject.name
                              : 'No project selected'}
                          </strong
