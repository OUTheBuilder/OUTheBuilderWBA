            font-size:
              11px;

            font-weight:
              900;

            letter-spacing:
              0.16em;

          }


          h1 {

            margin:
              8px 0 8px;

            font-size:
              clamp(
                30px,
                4vw,
                48px
              );

            line-height:
              1.05;

          }


          h2,
          h3 {

            margin-top:
              0;

          }


          p {

            color:
              #8fa6bc;

            line-height:
              1.6;

          }


          .hero p {

            max-width:
              650px;

            font-size:
              16px;

          }


          .stats-grid {

            display:
              grid;

            grid-template-columns:
              repeat(
                4,
                1fr
              );

            gap:
              14px;

            margin:
              18px 0;

          }


          .stat-card {

            padding:
              18px;

            display:
              flex;

            gap:
              13px;

            align-items:
              center;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              15px;

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

          }


          .stat-icon {

            font-size:
              24px;

          }


          .stat-card small {

            display:
              block;

            color:
              #718ba3;

          }


          .stat-card strong {

            display:
              block;

            margin-top:
              4px;

          }


          .feature-grid {

            display:
              grid;

            grid-template-columns:
              repeat(
                4,
                1fr
              );

            gap:
              14px;

          }


          .feature-card {

            min-height:
              170px;

            padding:
              20px;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              15px;

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

            color:
              white;

            text-align:
              left;

          }


          .feature-card:hover {

            border-color:
              rgba(
                45,
                189,
                255,
                0.35
              );

            transform:
              translateY(
                -2px
              );

          }


          .feature-card p {

            font-size:
              13px;

          }


          .feature-card span {

            color:
              #3fd5ff;

            font-size:
              11px;

            font-weight:
              900;

          }


          .page-header {

            display:
              flex;

            justify-content:
              space-between;

            align-items:
              flex-end;

            gap:
              20px;

            margin-bottom:
              22px;

          }


          .page-header h1 {

            font-size:
              clamp(
                30px,
                4vw,
                42px
              );

          }


          .page-header p {

            margin-bottom:
              0;

          }


          .panel {

            padding:
              22px;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              16px;

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

          }


          .center {

            text-align:
              center;

          }


          .big-icon {

            font-size:
              42px;

            margin-bottom:
              10px;

          }


          .project-grid,
          .settings-grid {

            display:
              grid;

            grid-template-columns:
              repeat(
                2,
                1fr
              );

            gap:
              16px;

          }


          .project-card {

            padding:
              22px;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              15px;

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

          }


          .project-icon {

            font-size:
              32px;

            margin-bottom:
              15px;

          }


          .upload-zone {

            min-height:
              300px;

            display:
              grid;

            place-items:
              center;

            text-align:
              center;

            border:
              1px dashed
              rgba(
                69,
                169,
                235,
                0.3
              );

            border-radius:
              14px;

            padding:
              30px;

          }


          .upload-zone input {

            max-width:
              100%;

          }


          .upload-icon {

            font-size:
              40px;

          }


          .file-list {

            width:
              min(
                700px,
                100%
              );

            margin-top:
              18px;

            text-align:
              left;

          }


          .file-list div {

            padding:
              10px;

            border-bottom:
              1px solid
              rgba(
                255,
                255,
                255,
                0.07
              );

          }


          .file-list span {

            margin-right:
              8px;

          }


          .build-layout {

            display:
              grid;

            grid-template-columns:
              0.8fr 1.2fr;

            gap:
              16px;

          }


          .large-select,
          input,
          textarea,
          select {

            width:
              100%;

            border:
              1px solid
              rgba(
                86,
                151,
                198,
                0.2
              );

            border-radius:
              10px;

            padding:
              12px;

            color:
              white;

            background:
              #091525;

            outline:
              none;

          }


          label {

            display:
              block;

            margin:
              20px 0 7px;

            color:
              #8ea7bd;

            font-size:
              13px;

          }


          .large-select {

            margin:
              10px 0 18px;

          }


          .full {

            width:
              100%;

          }


          .console {

            font-family:
              monospace;

            line-height:
              2;

            color:
              #a7c6df;

            background:
              #030810;

          }


          .console-title {

            color:
              #4cd7ff;

            font-weight:
              900;

            margin-bottom:
              8px;

          }


          .flow-canvas {

            min-height:
              450px;

            display:
              flex;

            flex-direction:
              column;

            align-items:
              center;

            justify-content:
              center;

            gap:
              13px;

            padding:
              30px;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              18px;

            background:
              radial-gradient(
                circle,
                rgba(
                  52,
                  135,
                  255,
                  0.08
                ),
                transparent 45%
              );

          }


          .flow-node {

            width:
              190px;

            padding:
              16px;

            text-align:
              center;

            border:
              1px solid
              rgba(
                57,
                195,
                255,
                0.35
              );

            border-radius:
              13px;

            background:
              rgba(
                19,
                54,
                85,
                0.55
              );

          }


          .flow-node span {

            display:
              block;

            color:
              #50d7ff;

            font-size:
              9px;

            letter-spacing:
              0.14em;

          }


          .flow-node strong {

            display:
              block;

            margin-top:
              4px;

          }


          .flow-arrow {

            color:
              #55d7ff;

          }


          .flow-branches {

            display:
              flex;

            gap:
              14px;

          }


          .info-box {

            margin-top:
              15px;

            padding:
              13px;

            border-radius:
              10px;

            background:
              rgba(
                33,
                129,
                196,
                0.08
              );

            color:
              #91aac0;

          }


          .info-box strong {

            display:
              block;

            color:
              white;

            margin-top:
              5px;

          }


          .limit-row,
          .request-item {

            display:
              flex;

            justify-content:
              space-between;

            gap:
              15px;

            padding:
              12px 0;

            border-bottom:
              1px solid
              rgba(
                255,
                255,
                255,
                0.06
              );

          }


          .limit-row span,
          .request-item span {

            color:
              #7e98b0;

          }


          .button-row {

            display:
              flex;

            flex-wrap:
              wrap;

            gap:
              8px;

          }


          .small-muted,
          .muted {

            color:
              #6e8499;

            font-size:
              12px;

          }


          .empty-panel {

            min-height:
              350px;

            display:
              grid;

            place-items:
              center;

            align-content:
              center;

            text-align:
              center;

            border:
              1px dashed
              rgba(
                85,
                139,
                183,
                0.2
              );

            border-radius:
              16px;

          }


          /* =====================================================
             CHAT
             ===================================================== */

          .chat-shell {

            height:
              calc(
                100vh - 190px
              );

            min-height:
              520px;

            display:
              flex;

            flex-direction:
              column;

            overflow:
              hidden;

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.18
              );

            border-radius:
              18px;

            background:
              rgba(
                5,
                13,
                24,
                0.8
              );

          }


          .chat-toolbar {

            display:
              grid;

            grid-template-columns:
              240px
              1fr
              auto;

            align-items:
              center;

            gap:
              15px;

            padding:
              14px;

            border-bottom:
              1px solid
              rgba(
                85,
                139,
                183,
                0.13
              );

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

          }


          .toolbar-label {

            display:
              block;

            color:
              #66839c;

            font-size:
              9px;

            letter-spacing:
              0.14em;

            font-weight:
              900;

            margin-bottom:
              5px;

          }


          .agent-description {

            display:
              flex;

            flex-direction:
              column;

            gap:
              3px;

          }


          .agent-description span {

            color:
              #728ca5;

            font-size:
              12px;

          }


          .free-badge {

            padding:
              7px 9px;

            border-radius:
              8px;

            color:
              #64e5b8;

            background:
              rgba(
                62,
                218,
                167,
                0.08
              );

            font-size:
              9px;

            font-weight:
              900;

          }


          .messages {

            flex:
              1;

            overflow-y:
              auto;

            padding:
              24px;

          }


          .empty-chat {

            max-width:
              680px;

            margin:
              50px auto;

            text-align:
              center;

          }


          .empty-icon {

            font-size:
              50px;

            color:
              #48d5ff;

          }


          .empty-chat h2 {

            margin-bottom:
              5px;

          }


          .prompt-grid {

            display:
              grid;

            grid-template-columns:
              repeat(
                2,
                1fr
              );

            gap:
              9px;

            margin-top:
              25px;

          }


          .prompt-grid button {

            padding:
              12px;

            text-align:
              left;

            color:
              #b9cde0;

            background:
              rgba(
                255,
                255,
                255,
                0.025
              );

            border:
              1px solid
              rgba(
                85,
                139,
                183,
                0.16
              );

            border-radius:
              10px;

          }


          .prompt-grid button:hover {

            border-color:
              rgba(
                53,
                196,
                255,
                0.35
              );

          }


          .message-row {

            display:
              flex;

            margin-bottom:
              14px;

          }


          .user-row {

            justify-content:
              flex-end;

          }


          .assistant-row {

            justify-content:
              flex-start;

          }


          .message-bubble {

            max-width:
              min(
                78%,
                760px
              );

            padding:
              13px 16px;

            border-radius:
              15px;

            line-height:
              1.55;

          }


          .user-message {

            background:
              linear-gradient(
                135deg,
                rgba(
                  0,
                  157,
                  223,
                  0.3
                ),
                rgba(
                  88,
                  74,
                  219,
                  0.25
                )
              );

            border:
              1px solid
              rgba(
                63,
                185,
                255,
                0.2
              );

            border-bottom-right-radius:
              4px;

          }


          .assistant-message {

            background:
              rgba(
                255,
                255,
                255,
                0.035
              );

            border:
              1px solid
              rgba(
                104,
                146,
                184,
                0.14
              );

            border-bottom-left-radius:
              4px;

          }


          .error-message {

            border-color:
              rgba(
                255,
                95,
                95,
                0.3
              );

          }


          .message-label {

            margin-bottom:
              5px;

            color:
              #5bd8ff;

            font-size:
              9px;

            font-weight:
              900;

            letter-spacing:
              0.12em;

          }


          .message-content {

            color:
              #dceafa;

            overflow-wrap:
              anywhere;

          }


          .typing {

            display:
              flex;

            align-items:
              center;

            gap:
              5px;

            color:
              #7e9ab1;

            font-size:
              13px;

          }


          .typing span {

            width:
              6px;

            height:
              6px;

            border-radius:
              50%;

            background:
              #46d3ff;

            animation:
              pulse
              1s infinite
              alternate;

          }


          .typing span:nth-child(2) {

            animation-delay:
              0.2s;

          }


          .typing span:nth-child(3) {

            animation-delay:
              0.4s;

          }


          @keyframes pulse {

            from {

              opacity:
                0.25;

              transform:
                translateY(
                  1px
                );

            }

            to {

              opacity:
                1;

              transform:
                translateY(
                  -1px
                );

            }

          }


          .chat-input-area {

            display:
              flex;

            align-items:
              flex-end;

            gap:
              9px;

            padding:
              12px;

            border-top:
              1px solid
              rgba(
                85,
                139,
                183,
                0.13
              );

          }


          .chat-input-area textarea {

            min-height:
              46px;

            max-height:
              160px;

            resize:
              vertical;

          }


          .send-button {

            width:
              48px;

            height:
              46px;

            flex:
              0 0 48px;

            border:
              0;

            border-radius:
              11px;

            color:
              white;

            background:
              linear-gradient(
                135deg,
                #00aeea,
                #625cff
              );

            font-size:
              20px;

          }


          .chat-footer {

            display:
              flex;

            justify-content:
              space-between;

            gap:
              10px;

            padding:
              0 13px
              11px;

            color:
              #61798f;

            font-size:
              9px;

          }


          /* =====================================================
             ACCESS
             ===================================================== */

          .access-page {

            min-height:
              100vh;

            display:
              grid;

            place-items:
              center;

            padding:
              20px;

            background:
              radial-gradient(
                circle at 50% 10%,
                rgba(
                  0,
                  178,
                  255,
                  0.12
                ),
                transparent 35%
              ),
              #040a13;

          }


          .access-card {

            width:
              min(
                440px,
                100%
              );

            padding:
              35px;

            text-align:
              center;

            border:
              1px solid
              rgba(
                75,
                162,
                222,
                0.2
              );

            border-radius:
              20px;

            background:
              rgba(
                8,
                18,
                32,
                0.95
              );

            box-shadow:
              0 30px 80px
              rgba(
                0,
                0,
                0,
                0.3
              );

          }


          .access-card h1 {

            font-size:
              32px;

          }


          .access-input {

            margin-top:
              18px;

          }


          .access-card >
          .primary-button {

            width:
              100%;

            margin-top:
              10px;

          }


          .request-box {

            margin-top:
              25px;

            padding-top:
              22px;

            border-top:
              1px solid
              rgba(
                255,
                255,
                255,
                0.07
              );

          }


          .section-title {

            margin-bottom:
              10px;

            font-weight:
              800;

          }


          .request-box input {

            margin-bottom:
              9px;

          }


          .request-box
          .secondary-button {

            width:
              100%;

          }


          /* =====================================================
             RESPONSIVE
             ===================================================== */

          @media (
            max-width: 1050px
          ) {

            .stats-grid,
            .feature-grid {

              grid-template-columns:
                repeat(
                  2,
                  1fr
                );

            }


            .chat-toolbar {

              grid-template-columns:
                1fr 1fr;

            }


            .free-badge {

              display:
                none;

            }

          }


          @media (
            max-width: 760px
          ) {

            .sidebar {

              display:
                none;

            }


            .mobile-header {

              position:
                fixed;

              display:
                flex;

              top:
                0;

              left:
                0;

              right:
                0;

              height:
                62px;

              padding:
                10px 14px;

              justify-content:
                space-between;

              align-items:
                center;

              border-bottom:
                1px solid
                rgba(
                  85,
                  139,
                  183,
                  0.15
                );

              background:
                rgba(
                  5,
                  12,
                  24,
                  0.97
                );

              z-index:
                30;

            }


            .mobile-chat {

              width:
                40px;

              height:
                40px;

              border:
                0;

              border-radius:
                10px;

              color:
                white;

              background:
                rgba(
                  49,
                  155,
                  255,
                  0.15
                );

            }


            .main-content {

              width:
                100%;

              margin-left:
                0;

              padding:
                84px 14px
                25px;

            }


            .hero {

              min-height:
                310px;

              padding:
                24px;

              flex-direction:
                column;

              align-items:
                flex-start;

              justify-content:
                flex-end;

            }


            .stats-grid,
            .feature-grid,
            .project-grid,
            .settings-grid,
            .build-layout {

              grid-template-columns:
                1fr;

            }


            .page-header {

              align-items:
                flex-start;

              flex-direction:
                column;

            }


            .page-header
            .primary-button,
            .page-header
            .secondary-button {

              width:
                100%;

            }


            .chat-shell {

              height:
                calc(
                  100vh - 175px
                );

              min-height:
                480px;

            }


            .chat-toolbar {

              grid-template-columns:
                1fr;

            }


            .agent-description {

              display:
                none;

            }


            .messages {

              padding:
                15px 10px;

            }


            .message-bubble {

              max-width:
                90%;

            }


            .prompt-grid {

              grid-template-columns:
                1fr;

            }


            .chat-footer {

              flex-direction:
                column;

            }


            .flow-branches {

              width:
                100%;

              flex-wrap:
                wrap;

              justify-content:
                center;

            }


            .flow-node {

              width:
                150px;

            }

          }


          @media (
            max-width: 420px
          ) {

            .access-card {

              padding:
                25px 18px;

            }


            h1 {

              font-size:
                30px;

            }


            .hero
            .primary-button {

              width:
                100%;

            }

          }
          EOF

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        working-directory: client
        run: |
          npm install

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build WBA
        working-directory: client
        run: |
          npm run build

      # =========================================================
      # VERIFY
      # =========================================================

      - name: Verify build
        working-directory: client
        run: |
          test -f dist/index.html
          echo "OU The Builder WBA build verified successfully."

      # =========================================================
      # GITHUB PAGES
      # =========================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
