name: OU The Builder WBA - Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build OU The Builder WBA
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Get the repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. Install Node.js 24
      # ------------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # ------------------------------------------------------------
      # 3. Show environment information
      # ------------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "======================================"
          echo "OU THE BUILDER WBA BUILD ENVIRONMENT"
          echo "======================================"
          node --version
          npm --version
          echo "Repository:"
          pwd
          echo ""
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Source directory:"
          if [ -d "src" ]; then
            ls -la src
          else
            echo "No root src directory."
          fi

      # ------------------------------------------------------------
      # 4. Check the client application
      # ------------------------------------------------------------
      - name: Check client application
        shell: bash
        run: |
          set -e

          if [ ! -d "client" ]; then
            echo "ERROR: client directory was not found."
            exit 1
          fi

          if [ ! -f "client/package.json" ]; then
            echo "ERROR: client/package.json was not found."
            exit 1
          fi

          if [ ! -f "client/index.html" ]; then
            echo "ERROR: client/index.html was not found."
            exit 1
          fi

          echo "Client application found."

          echo ""
          echo "Client files:"
          find client -maxdepth 3 -type f | sort

      # ------------------------------------------------------------
      # 5. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "Installing npm dependencies..."

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # ------------------------------------------------------------
      # 6. Verify important source files before compiling
      # ------------------------------------------------------------
      - name: Verify application source
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "Checking application source..."

          if [ ! -f "src/main.jsx" ]; then
            echo "ERROR: src/main.jsx not found."
            exit 1
          fi

          if [ ! -f "src/App.jsx" ]; then
            echo "ERROR: src/App.jsx not found."
            exit 1
          fi

          if [ ! -f "src/style.css" ]; then
            echo "ERROR: src/style.css not found."
            exit 1
          fi

          echo "Source files found:"
          echo "  ✓ src/main.jsx"
          echo "  ✓ src/App.jsx"
          echo "  ✓ src/style.css"

      # ------------------------------------------------------------
      # 7. Build the WBA
      # ------------------------------------------------------------
      - name: Build application
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING OU THE BUILDER WBA"
          echo "======================================"

          npm run build

          echo ""
          echo "Build command completed."

      # ------------------------------------------------------------
      # 8. Verify the production build
      # ------------------------------------------------------------
      - name: Verify production build
        working-directory: client
        shell: bash
        run: |
          set -e

          echo "Checking production output..."

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo ""
          echo "Production build verified successfully."

          echo ""
          echo "Build output:"
          find dist -maxdepth 3 -type f | sort

          echo ""
          echo "Build size:"
          du -sh dist

      # ------------------------------------------------------------
      # 9. Configure GitHub Pages
      # ------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # 10. Prepare Pages artifact
      # ------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  # ================================================================
  # DEPLOY
  # ================================================================
  deploy:
    name: Deploy OU The Builder WBA
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 11. Deploy to GitHub Pages
      # ------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ------------------------------------------------------------
      # 12. Display deployment information
      # ------------------------------------------------------------
      - name: Deployment complete
        shell: bash
        run: |
          echo "======================================"
          echo "OU THE BUILDER WBA DEPLOYMENT COMPLETE"
          echo "======================================"
          echo ""
          echo "GitHub Pages URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "Build and deployment completed successfully."
