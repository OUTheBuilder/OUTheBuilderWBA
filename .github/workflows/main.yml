name: OU The Builder WBA - Folder Import

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create WBA application
        shell: bash
        run: |
          set -e

          mkdir -p client/src

          cat > client/package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "version": "0.4.4",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^5.0.4",
              "vite": "^7.1.7"
            }
          }
          EOF

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              />
              <meta
                name="theme-color"
                content="#070b18"
              />
              <title>OU The Builder</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > client/vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            base: "/OUTheBuilderWBA/",
            plugins: [react()]
          });
          EOF

          cat > client/src/main.jsx <<'EOF'
          import React, { useEffect, useMemo, useRef, useState } from "react";
          import { createRoot } from "react-dom/client";
          import "./style.css";

          const AGENTS = [
            {
              id: "ou-builder",
              name: "OU Builder AI",
              description: "Main builder assistant"
            },
            {
              id: "coding",
              name: "Coding Agent",
              description: "Code and project assistance"
            },
            {
              id: "general",
              name: "General AI",
              description: "General-purpose assistant"
            },
            {
              id: "research",
              name: "Research Agent",
              description: "Research and analysis"
            },
            {
              id: "free-auto",
              name: "Free Auto Agent",
              description: "Automatic free-agent route"
            }
          ];

          const STORAGE_KEY = "ou_builder_project";
          const API_KEY_STORAGE = "ou_openrouter_key";

          function formatBytes(bytes) {
            if (!Number.isFinite(bytes)) return "Unknown size";
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) {
              return `${(bytes / 1024).toFixed(1)} KB`;
            }
            if (bytes < 1024 * 1024 * 1024) {
              return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
            }
            return `${(bytes / (1024 * 1024 * 1024)).toFixed(1)} GB`;
          }

          function isTextLike(file) {
            const name = file.name.toLowerCase();

            const extensions = [
              ".txt",
              ".md",
              ".json",
              ".js",
              ".jsx",
              ".ts",
              ".tsx",
              ".css",
              ".scss",
              ".html",
              ".xml",
              ".yaml",
              ".yml",
              ".gradle",
              ".kts",
              ".java",
              ".kt",
              ".py",
              ".php",
              ".c",
              ".cpp",
              ".h",
              ".hpp",
              ".properties",
              ".toml",
              ".sh",
              ".bat"
            ];

            return (
              file.type.startsWith("text/") ||
              extensions.some((extension) => name.endsWith(extension))
            );
          }

          function normalizeFolderFiles(fileList) {
            return Array.from(fileList).map((file) => ({
              name: file.name,
              path:
                file.webkitRelativePath ||
                file.name,
              size: file.size,
              type: file.type || "application/octet-stream",
              lastModified: file.lastModified,
              file
            }));
          }

          function App() {
            const [activePage, setActivePage] = useState("home");
            const [agent, setAgent] = useState(AGENTS[0]);
            const [agentOpen, setAgentOpen] = useState(false);

            const [messages, setMessages] = useState([
              {
                id: crypto.randomUUID(),
                role: "assistant",
                text:
                  "Welcome to OU The Builder. You can upload files or use an entire project folder with the Use this Folder button."
              }
            ]);

            const [input, setInput] = useState("");
            const [apiKey, setApiKey] = useState(
              () => localStorage.getItem(API_KEY_STORAGE) || ""
            );

            const [showApiKey, setShowApiKey] = useState(false);

            const [project, setProject] = useState(() => {
              try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
              } catch {
                return null;
              }
            });

            const [projectFiles, setProjectFiles] = useState([]);
            const [status, setStatus] = useState("ONLINE");

            const fileInputRef = useRef(null);
            const folderInputRef = useRef(null);

            useEffect(() => {
              if (project) {
                localStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify(project)
                );
              } else {
                localStorage.removeItem(STORAGE_KEY);
              }
            }, [project]);

            function addMessage(role, text) {
              setMessages((current) => [
                ...current,
                {
                  id: crypto.randomUUID(),
                  role,
                  text
                }
              ]);
            }

            function saveApiKey() {
              if (!apiKey.trim()) {
                localStorage.removeItem(API_KEY_STORAGE);
                addMessage(
                  "assistant",
                  "The API key field is empty. No key was saved."
                );
                return;
              }

              localStorage.setItem(
                API_KEY_STORAGE,
                apiKey.trim()
              );

              addMessage(
                "assistant",
                "The API key was saved in this browser. Secure account/server storage will be added with the backend connection."
              );
            }

            function deleteApiKey() {
              localStorage.removeItem(API_KEY_STORAGE);
              setApiKey("");
              addMessage(
                "assistant",
                "The locally stored API key has been deleted."
              );
            }

            function createProjectFromFiles(
              files,
              sourceType = "folder"
            ) {
              if (!files.length) return;

              const firstPath =
                files[0].path ||
                files[0].name;

              const rootName =
                firstPath.includes("/")
                  ? firstPath.split("/")[0]
                  : files[0].name.replace(/\.[^/.]+$/, "");

              const projectName =
                rootName || "Imported Project";

              const projectInfo = {
                id: crypto.randomUUID(),
                name: projectName,
                sourceType,
                fileCount: files.length,
                totalSize: files.reduce(
                  (sum, item) => sum + (item.size || 0),
                  0
                ),
                createdAt: new Date().toISOString()
              };

              setProject(projectInfo);
              setProjectFiles(files);

              addMessage(
                "assistant",
                `Project "${projectName}" is now the current project. ${files.length} file(s) were imported from the ${sourceType}.`
              );

              setActivePage("projects");
            }

            function handleFiles(event) {
              const selected = Array.from(
                event.target.files || []
              );

              if (!selected.length) return;

              const files = selected.map((file) => ({
                name: file.name,
                path: file.name,
                size: file.size,
                type:
                  file.type ||
                  "application/octet-stream",
                lastModified: file.lastModified,
                file
              }));

              createProjectFromFiles(files, "files");
              event.target.value = "";
            }

            function handleFolder(event) {
              const selected = normalizeFolderFiles(
                event.target.files || []
              );

              if (!selected.length) return;

              createProjectFromFiles(
                selected,
                "folder"
              );

              event.target.value = "";
            }

            function openAddFile() {
              fileInputRef.current?.click();
            }

            function openFolderPicker() {
              folderInputRef.current?.click();
            }

            async function readTextFile(file) {
              try {
                if (!isTextLike(file)) {
                  return null;
                }

                return await file.text();
              } catch {
                return null;
              }
            }

            async function sendMessage() {
              const text = input.trim();

              if (!text) return;

              addMessage("user", text);
              setInput("");

              if (
                text.toLowerCase().includes("use this folder") &&
                project
              ) {
                addMessage(
                  "assistant",
                  `The current project folder "${project.name}" is already selected and ready for builder features.`
                );
                return;
              }

              if (
                text.toLowerCase().includes("compile") ||
                text.toLowerCase().includes("build")
              ) {
                addMessage(
                  "assistant",
                  "The Build section is ready for the remote build system. The project is currently stored in this browser prototype."
                );
                setActivePage("build");
                return;
              }

              addMessage(
                "assistant",
                `Message received by ${agent.name}. Connect the secure AI backend to send this request to the selected agent.`
              );
            }

            async function copyMessage(text) {
              try {
                await navigator.clipboard.writeText(text);
              } catch {
                const textarea =
                  document.createElement("textarea");

                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
              }
            }

            async function copyConversation() {
              const text = messages
                .map(
                  (message) =>
                    `${message.role.toUpperCase()}: ${message.text}`
                )
                .join("\n\n");

              await copyMessage(text);
            }

            async function inspectProject() {
              if (!projectFiles.length) {
                addMessage(
                  "assistant",
                  "There are no imported project files to inspect."
                );
                return;
              }

              const readable = [];

              for (const item of projectFiles.slice(0, 50)) {
                const content = await readTextFile(
                  item.file
                );

                readable.push({
                  path: item.path,
                  size: item.size,
                  readable: content !== null
                });
              }

              const readableCount =
                readable.filter(
                  (item) => item.readable
                ).length;

              addMessage(
                "assistant",
                `Project inspection complete. ${projectFiles.length} file(s) detected; ${readableCount} text/source file(s) can currently be read by the browser prototype.`
              );
            }

            const pageTitle = useMemo(() => {
              const titles = {
                home: "Command Center",
                projects: "Project & Storage",
                build: "Build",
                chat: "AI Chat",
                flow: "Image Flow",
                settings: "Settings"
              };

              return titles[activePage] || "Command Center";
            }, [activePage]);

            return (
              <div className="app">
                <input
                  ref={fileInputRef}
                  className="hiddenInput"
                  type="file"
                  multiple
                  onChange={handleFiles}
                />

                <input
                  ref={folderInputRef}
                  className="hiddenInput"
                  type="file"
                  multiple
                  webkitdirectory=""
                  directory=""
                  onChange={handleFolder}
                />

                <aside className="sidebar">
                  <div className="brand">
                    <div className="brandMark">
                      OU
                    </div>

                    <div>
                      <div className="brandName">
                        OU The Builder
                      </div>
                      <div className="brandSub">
                        WEB APPLICATION
                      </div>
                    </div>
                  </div>

                  <nav className="nav">
                    {[
                      ["home", "⌂", "Home"],
                      ["projects", "▣", "Project & Storage"],
                      ["build", "⚙", "Build"],
                      ["chat", "✦", "AI Chat"],
                      ["flow", "⌘", "Image Flow"],
                      ["settings", "⚙", "Settings"]
                    ].map(([id, icon, label]) => (
                      <button
                        key={id}
                        className={
                          activePage === id
                            ? "navItem active"
                            : "navItem"
                        }
                        onClick={() =>
                          setActivePage(id)
                        }
                      >
                        <span>{icon}</span>
                        {label}
                      </button>
                    ))}
                  </nav>

                  <div className="sidebarBottom">
                    <div className="online">
                      <span className="dot" />
                      {status}
                    </div>

                    <div className="version">
                      v0.4.4
                    </div>
                  </div>
                </aside>

                <main className="main">
                  <header className="topbar">
                    <div>
                      <div className="eyebrow">
                        OU THE BUILDER
                      </div>
                      <h1>{pageTitle}</h1>
                    </div>

                    <div className="topActions">
                      <button
                        className="secondaryButton"
                        onClick={openAddFile}
                      >
                        ＋ Add File
                      </button>

                      <button
                        className="primaryButton"
                        onClick={openFolderPicker}
                      >
                        📁 Use this Folder
                      </button>
                    </div>
                  </header>

                  {activePage === "home" && (
                    <section className="content">
                      <div className="hero">
                        <div>
                          <span className="badge">
                            FOUNDATION STAGE
                          </span>

                          <h2>
                            Build your projects
                            <br />
                            from one place.
                          </h2>

                          <p>
                            Manage projects, files,
                            AI agents and remote
                            builds from OU The Builder.
                          </p>
                        </div>

                        <div className="heroOrb">
                          OU
                        </div>
                      </div>

                      <div className="grid">
                        <DashboardCard
                          title="AI Builder"
                          value={agent.name}
                          description={agent.description}
                          icon="✦"
                          onClick={() =>
                            setActivePage("chat")
                          }
                        />

                        <DashboardCard
                          title="Projects"
                          value={
                            project
                              ? project.name
                              : "No project"
                          }
                          description={
                            project
                              ? `${project.fileCount} files`
                              : "Import a project folder"
                          }
                          icon="▣"
                          onClick={() =>
                            setActivePage("projects")
                          }
                        />

                        <DashboardCard
                          title="Build System"
                          value="Remote Build"
                          description="APK and web build pipeline"
                          icon="⚙"
                          onClick={() =>
                            setActivePage("build")
                          }
                        />

                        <DashboardCard
                          title="Image Flow"
                          value="Visual Flow"
                          description="Application screen mapping"
                          icon="⌘"
                          onClick={() =>
                            setActivePage("flow")
                          }
                        />
                      </div>

                      <div className="sectionGrid">
                        <div className="panel">
                          <div className="panelTitle">
                            System Status
                          </div>

                          <StatusRow
                            name="WBA"
                            state="Online"
                          />

                          <StatusRow
                            name="AI Interface"
                            state="Ready"
                          />

                          <StatusRow
                            name="Project Storage"
                            state="Ready"
                          />

                          <StatusRow
                            name="Build Service"
                            state="Ready"
                          />

                          <StatusRow
                            name="Google Drive"
                            state="Not connected"
                          />
                        </div>

                        <div className="panel">
                          <div className="panelTitle">
                            Current Project
                          </div>

                          {project ? (
                            <>
                              <div className="projectName">
                                {project.name}
                              </div>

                              <div className="muted">
                                {project.fileCount} files
                                {" · "}
                                {formatBytes(
                                  project.totalSize
                                )}
                              </div>

                              <button
                                className="outlineButton"
                                onClick={inspectProject}
                              >
                                Inspect Project
                              </button>
                            </>
                          ) : (
                            <>
                              <div className="empty">
                                No project selected.
                              </div>

                              <button
                                className="outlineButton"
                                onClick={
                                  openFolderPicker
                                }
                              >
                                📁 Use this Folder
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                    </section>
                  )}

                  {activePage === "projects" && (
                    <section className="content">
                      <div className="pageIntro">
                        <div>
                          <span className="badge">
                            PROJECT & STORAGE
                          </span>

                          <h2>
                            Projects, files and
                            storage
                          </h2>

                          <p>
                            Import individual files,
                            ZIP projects or an entire
                            extracted project folder.
                          </p>
                        </div>

                        <button
                          className="primaryButton large"
                          onClick={
                            openFolderPicker
                          }
                        >
                          📁 Use this Folder
                        </button>
                      </div>

                      <div className="importGrid">
                        <button
                          className="importCard"
                          onClick={openAddFile}
                        >
                          <div className="importIcon">
                            ＋
                          </div>

                          <strong>
                            Add Files
                          </strong>

                          <span>
                            Upload one or multiple
                            project files.
                          </span>
                        </button>

                        <button
                          className="importCard"
                          onClick={
                            openFolderPicker
                          }
                        >
                          <div className="importIcon">
                            📁
                          </div>

                          <strong>
                            Use this Folder
                          </strong>

                          <span>
                            Select an entire folder
                            including all subfolders
                            and files.
                          </span>
                        </button>

                        <div className="importCard">
                          <div className="importIcon">
                            ZIP
                          </div>

                          <strong>
                            ZIP Project
                          </strong>

                          <span>
                            ZIP files can be imported
                            for project preparation.
                          </span>
                        </div>

                        <div className="importCard">
                          <div className="importIcon">
                            ☁
                          </div>

                          <strong>
                            Google Drive
                          </strong>

                          <span>
                            Cloud storage connection
                            will be added through the
                            storage backend.
                          </span>
                        </div>
                      </div>

                      <div className="panel">
                        <div className="panelHeader">
                          <div>
                            <div className="panelTitle">
                              Current Project
                            </div>
                            <div className="muted">
                              The selected folder is
                              preserved as the current
                              project source.
                            </div>
                          </div>

                          {project && (
                            <span className="statusPill">
                              CURRENT
                            </span>
                          )}
                        </div>

                        {project ? (
                          <>
                            <div className="projectLarge">
                              <div className="folderIcon">
                                📁
                              </div>

                              <div>
                                <strong>
                                  {project.name}
                                </strong>

                                <div className="muted">
                                  Source:{" "}
                                  {project.sourceType}
                                  {" · "}
                                  {project.fileCount} files
                                  {" · "}
                                  {formatBytes(
                                    project.totalSize
                                  )}
                                </div>
                              </div>
                            </div>

                            <div className="fileList">
                              {projectFiles
                                .slice(0, 100)
                                .map(
                                  (item, index) => (
                                    <div
                                      className="fileRow"
                                      key={`${item.path}-${index}`}
                                    >
                                      <span>
                                        📄
                                      </span>

                                      <div className="filePath">
                                        {item.path}
                                      </div>

                                      <span className="muted">
                                        {formatBytes(
                                          item.size
                                        )}
                                      </span>
                                    </div>
                                  )
                                )}
                            </div>
                          </>
                        ) : (
                          <div className="emptyBox">
                            <div className="emptyIcon">
                              📁
                            </div>

                            <strong>
                              No project imported
                            </strong>

                            <span>
                              Select an extracted
                              project folder and press
                              <b> Use this Folder</b>.
                            </span>

                            <button
                              className="primaryButton"
                              onClick={
                                openFolderPicker
                              }
                            >
                              📁 Use this Folder
                            </button>
                          </div>
                        )}
                      </div>
                    </section>
                  )}

                  {activePage === "build" && (
                    <section className="content">
                      <div className="pageIntro">
                        <div>
                          <span className="badge">
                            BUILD
                          </span>

                          <h2>
                            Build your project
                          </h2>

                          <p>
                            The project source selected
                            in Project & Storage will
                            become the build input.
                          </p>
                        </div>
                      </div>

                      <div className="buildSteps">
                        {[
                          "Project detected",
                          "Compatibility check",
                          "Resource check",
                          "Build environment",
                          "Compile",
                          "Verify APK"
                        ].map(
                          (step, index) => (
                            <div
                              className="buildStep"
                              key={step}
                            >
                              <span>
                                {index + 1}
                              </span>

                              <div>
                                <strong>
                                  {step}
                                </strong>

                                <small>
                                  Ready
                                </small>
                              </div>
                            </div>
                          )
                        )}
                      </div>

                      <div className="panel console">
                        <div className="panelTitle">
                          Build Console
                        </div>

                        <pre>{`BUILD CONSOLE
✓ WBA loaded
✓ Project system ready
✓ Folder import available
→ Waiting for build service
→ Remote compiler will be connected
`}</pre>

                        <button
                          className="primaryButton"
                          onClick={() =>
                            addMessage(
                              "assistant",
                              "Remote build has not been connected yet. The selected project is ready to be sent to the build service."
                            )
                          }
                        >
                          Run Build
                        </button>
                      </div>
                    </section>
                  )}

                  {activePage === "chat" && (
                    <section className="content chatPage">
                      <div className="chatHeader">
                        <div>
                          <span className="badge">
                            AI BUILDER
                          </span>

                          <h2>
                            AI Chat
                          </h2>
                        </div>

                        <button
                          className="outlineButton"
                          onClick={
                            copyConversation
                          }
                        >
                          ⧉ Copy Conversation
                        </button>
                      </div>

                      <div className="chatMessages">
                        {messages.map(
                          (message) => (
                            <div
                              className={
                                message.role ===
                                "user"
                                  ? "message user"
                                  : "message assistant"
                              }
                              key={message.id}
                            >
                              <div className="messageBubble">
                                <div>
                                  {message.text}
                                </div>

                                <button
                                  className="copyButton"
                                  onClick={() =>
                                    copyMessage(
                                      message.text
                                    )
                                  }
                                  title="Copy message"
                                >
                                  ⧉
                                </button>
                              </div>
                            </div>
                          )
                        )}
                      </div>

                      <div className="composer">
                        <button
                          className="composerIcon"
                          onClick={openAddFile}
                          title="Add files"
                        >
                          ＋
                        </button>

                        <button
                          className="composerIcon"
                          onClick={
                            openFolderPicker
                          }
                          title="Use this Folder"
                        >
                          📁
                        </button>

                        <div className="agentSelect">
                          <button
                            className="agentButton"
                            onClick={() =>
                              setAgentOpen(
                                (value) => !value
                              )
                            }
                          >
                            ✦ {agent.name}
                            <span>⌃</span>
                          </button>

                          {agentOpen && (
                            <div className="agentMenu">
                              {AGENTS.map(
                                (item) => (
                                  <button
                                    key={item.id}
                                    onClick={() => {
                                      setAgent(item);
                                      setAgentOpen(
                                        false
                                      );
                                    }}
                                  >
                                    <strong>
                                      {item.name}
                                    </strong>

                                    <small>
                                      {
                                        item.description
                                      }
                                    </small>
                                  </button>
                                )
                              )}
                            </div>
                          )}
                        </div>

                        <input
                          value={input}
                          onChange={(event) =>
                            setInput(
                              event.target.value
                            )
                          }
                          onKeyDown={(event) => {
                            if (
                              event.key === "Enter" &&
                              !event.shiftKey
                            ) {
                              event.preventDefault();
                              sendMessage();
                            }
                          }}
                          placeholder="Tell OU The Builder what to do..."
                        />

                        <button
                          className="sendButton"
                          onClick={sendMessage}
                        >
                          ➤
                        </button>
                      </div>
                    </section>
                  )}

                  {activePage === "flow" && (
                    <section className="content">
                      <div className="pageIntro">
                        <div>
                          <span className="badge">
                            IMAGE FLOW
                          </span>

                          <h2>
                            Application Flow
                          </h2>

                          <p>
                            Visualize project screens,
                            buttons and navigation
                            relationships.
                          </p>
                        </div>
                      </div>

                      <div className="flowCanvas">
                        <FlowNode
                          title="Home"
                          subtitle="Main screen"
                          position="one"
                        />

                        <div className="flowArrow">
                          ↓
                        </div>

                        <FlowNode
                          title="Project & Storage"
                          subtitle="Files / Projects / Drive"
                          position="two"
                        />

                        <div className="flowArrow">
                          ↓
                        </div>

                        <FlowNode
                          title="Build"
                          subtitle="Compile / Verify / APK"
                          position="three"
                        />
                      </div>
                    </section>
                  )}

                  {activePage === "settings" && (
                    <section className="content">
                      <div className="pageIntro">
                        <div>
                          <span className="badge">
                            SETTINGS
                          </span>

                          <h2>
                            Connections
                          </h2>

                          <p>
                            Configure AI agents and
                            storage connections.
                          </p>
                        </div>
                      </div>

                      <div className="panel settingsPanel">
                        <div className="panelTitle">
                          AI Agents
                        </div>

                        <div className="settingRow">
                          <div>
                            <strong>
                              OpenRouter API Key
                            </strong>

                            <div className="muted">
                              Prototype storage:
                              browser local storage.
                              Secure backend storage
                              will replace this in the
                              backend stage.
                            </div>
                          </div>

                          <span
                            className={
                              apiKey
                                ? "statusPill"
                                : "statusPill mutedPill"
                            }
                          >
                            {apiKey
                              ? "SAVED"
                              : "NOT SET"}
                          </span>
                        </div>

                        <div className="keyBox">
                          <input
                            type={
                              showApiKey
                                ? "text"
                                : "password"
                            }
                            value={apiKey}
                            onChange={(event) =>
                              setApiKey(
                                event.target.value
                              )
                            }
                            placeholder="Enter OpenRouter API key"
                          />

                          <button
                            className="outlineButton"
                            onClick={() =>
                              setShowApiKey(
                                (value) =>
                                  !value
                              )
                            }
                          >
                            {showApiKey
                              ? "Hide"
                              : "Show"}
                          </button>
                        </div>

                        <div className="settingsActions">
                          <button
                            className="primaryButton"
                            onClick={saveApiKey}
                          >
                            Save / Replace Key
                          </button>

                          <button
                            className="dangerButton"
                            onClick={deleteApiKey}
                          >
                            Delete Key
                          </button>
                        </div>
                      </div>

                      <div className="panel">
                        <div className="panelTitle">
                          Google Drive
                        </div>

                        <div className="settingRow">
                          <div>
                            <strong>
                              Storage Connection
                            </strong>

                            <div className="muted">
                              Google Drive will be
                              connected through the
                              authenticated backend,
                              rather than exposing
                              credentials in the public
                              WBA.
                            </div>
                          </div>

                          <span className="statusPill mutedPill">
                            NOT CONNECTED
                          </span>
                        </div>
                      </div>
                    </section>
                  )}
                </main>
              </div>
            );
          }

          function DashboardCard({
            title,
            value,
            description,
            icon,
            onClick
          }) {
            return (
              <button
                className="dashboardCard"
                onClick={onClick}
              >
                <div className="cardIcon">
                  {icon}
                </div>

                <div className="cardTitle">
                  {title}
                </div>

                <div className="cardValue">
                  {value}
                </div>

                <div className="cardDescription">
                  {description}
                </div>
              </button>
            );
          }

          function StatusRow({ name, state }) {
            return (
              <div className="statusRow">
                <span>{name}</span>

                <span>
                  <span className="dot" />
                  {state}
                </span>
              </div>
            );
          }

          function FlowNode({
            title,
            subtitle
          }) {
            return (
              <div className="flowNode">
                <div className="flowNodeIcon">
                  ◈
                </div>

                <div>
                  <strong>{title}</strong>
                  <span>{subtitle}</span>
                </div>
              </div>
            );
          }

          createRoot(
            document.getElementById("root")
          ).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
