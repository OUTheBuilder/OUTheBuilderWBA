            background: linear-gradient(
              90deg,
              rgba(9, 42, 62, 0.48),
              rgba(8, 18, 32, 0.55)
            );
          }

          .statusPulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #21dc88;
            box-shadow: 0 0 15px rgba(33, 220, 136, 0.75);
          }

          .statusBanner strong {
            display: block;
            font-size: 13px;
          }

          .statusBanner span {
            display: block;
            color: #70809a;
            font-size: 11px;
            margin-top: 2px;
          }

          .bannerVersion {
            margin-left: auto;
            color: #7284a2;
            font-size: 11px;
          }

          .dashboardGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 13px;
            margin-bottom: 14px;
          }

          .monitorCard {
            min-height: 190px;
            padding: 17px;
            border: 1px solid #1a2943;
            border-radius: 14px;
            background: #09111f;
            color: #eaf1ff;
            text-align: left;
            transition:
              transform 0.15s,
              border-color 0.15s;
          }

          .monitorCard:hover {
            transform: translateY(-2px);
            border-color: #315ba4;
          }

          .monitorTop {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
          }

          .monitorTop > span {
            color: #38d890;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
          }

          .monitorIcon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: #7da8ff;
            background: rgba(44, 91, 175, 0.13);
            border: 1px solid #1c3969;
          }

          .monitorCard > strong {
            font-size: 11px;
            color: #8292b0;
          }

          .monitorCard h3 {
            margin: 7px 0 7px;
            font-size: 17px;
          }

          .monitorCard p {
            margin: 0;
            color: #65748f;
            font-size: 11px;
            line-height: 1.5;
          }

          .twoColumn {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
          }

          .panel {
            border: 1px solid #192740;
            border-radius: 14px;
            background: #080f1c;
            padding: 18px;
          }

          .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 17px;
          }

          .panelHeader h2 {
            margin: 4px 0 0;
            font-size: 16px;
          }

          .greenBadge,
          .yellowBadge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.8px;
          }

          .greenBadge {
            color: #4be09c;
            border: 1px solid #164d39;
            background: #08251c;
          }

          .yellowBadge {
            color: #f4c96a;
            border: 1px solid #5a4820;
            background: #211b0b;
          }

          .statusRows {
            display: grid;
          }

          .infoRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid #141e31;
            color: #8a98b1;
            font-size: 11px;
          }

          .infoRow:last-child {
            border-bottom: 0;
          }

          .rowOk,
          .rowMuted {
            display: flex;
            align-items: center;
            gap: 6px;
          }

          .rowOk {
            color: #4bdc9a;
          }

          .rowOk i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #35d88d;
          }

          .rowMuted {
            color: #6b7890;
          }

          .emptyProject {
            min-height: 180px;
            display: grid;
            place-items: center;
            align-content: center;
            text-align: center;
          }

          .emptyIcon {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            margin-bottom: 11px;
            border-radius: 14px;
            color: #729eff;
            background: #0d1a31;
            border: 1px solid #203860;
          }

          .emptyIcon.large {
            width: 70px;
            height: 70px;
          }

          .emptyProject p,
          .emptyLarge p {
            color: #697893;
            font-size: 12px;
            margin: 0 0 14px;
          }

          .primaryButton,
          .secondaryButton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 37px;
            padding: 0 13px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 700;
          }

          .primaryButton {
            color: white;
            border: 1px solid #3977ff;
            background: linear-gradient(135deg, #1767ff, #7040ff);
          }

          .secondaryButton {
            color: #a9b9d4;
            border: 1px solid #263957;
            background: #0b1424;
          }

          .quickActions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
          }

          .quickActions button {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid #1a2942;
            border-radius: 10px;
            background: #0a1322;
            color: #dce7fb;
            text-align: left;
          }

          .quickActions button:hover {
            border-color: #31548d;
          }

          .quickActions svg {
            color: #6f9fff;
          }

          .quickActions strong,
          .quickActions small {
            display: block;
          }

          .quickActions strong {
            font-size: 11px;
          }

          .quickActions small {
            margin-top: 3px;
            color: #65748e;
            font-size: 9px;
          }

          .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            padding: 4px;
            border: 1px solid #17243a;
            border-radius: 10px;
            width: fit-content;
            background: #080f1c;
          }

          .tabs button {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 0;
            border-radius: 7px;
            padding: 9px 12px;
            background: transparent;
            color: #7787a2;
            font-size: 11px;
          }

          .tabs button.active {
            color: white;
            background: #14213a;
          }

          .emptyLarge {
            min-height: 330px;
            display: grid;
            place-items: center;
            align-content: center;
            text-align: center;
          }

          .emptyLarge h3 {
            margin: 4px 0 8px;
          }

          .fileInfo {
            display: flex;
            gap: 13px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #17253d;
            border-radius: 10px;
            background: #0a1322;
          }

          .fileType {
            min-width: 45px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #111f37;
            color: #77a4ff;
            font-size: 9px;
            font-weight: 800;
          }

          .fileInfo strong {
            font-size: 12px;
          }

          .fileInfo p {
            margin: 4px 0 0;
            color: #687892;
            font-size: 10px;
          }

          .driveLogo {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: #111c30;
            border: 1px solid #293c5d;
            font-size: 23px;
            font-weight: 900;
          }

          .buildGrid {
            display: grid;
            grid-template-columns: 390px 1fr;
            gap: 15px;
          }

          .field {
            display: grid;
            gap: 7px;
            margin-bottom: 14px;
          }

          .field > span {
            color: #7f8da6;
            font-size: 10px;
            font-weight: 700;
          }

          .field input,
          .field select {
            width: 100%;
            min-height: 39px;
            padding: 0 11px;
            border: 1px solid #21314d;
            border-radius: 8px;
            outline: none;
            background: #0b1424;
            color: #dfe8f9;
            font-size: 11px;
          }

          .field input:focus,
          .field select:focus {
            border-color: #396fe2;
          }

          .compatibility {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 17px 0;
            padding: 11px;
            border: 1px solid #1d3144;
            border-radius: 9px;
            background: #09171d;
          }

          .compatibility p {
            margin: 0;
            color: #6f8097;
            font-size: 10px;
            line-height: 1.4;
          }

          .buildButton,
          .fullButton {
            width: 100%;
          }

          .console {
            min-height: 370px;
            max-height: 600px;
            overflow: auto;
            padding: 14px;
            border: 1px solid #111c30;
            border-radius: 9px;
            background: #050a13;
            color: #7c8ca7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px;
            line-height: 1.9;
          }

          .consoleOk {
            color: #52dca0;
          }

          .consoleSuccess {
            color: #63a1ff;
            font-weight: 800;
          }

          .chatPage {
            height: 100vh;
            display: flex;
            flex-direction: column;
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 30px 30px 20px;
          }

          .chatHeader {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 17px;
          }

          .chatHeader h1 {
            margin-bottom: 5px;
          }

          .copyConversationButton {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid #273957;
            border-radius: 9px;
            background: #0b1424;
            color: #9eaecc;
            font-size: 10px;
            font-weight: 700;
          }

          .copyConversationButton:hover {
            color: #dce8ff;
            border-color: #3c5f96;
          }

          .sourceBar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            border: 1px solid #1b2a42;
            border-radius: 10px;
            background: #08111f;
          }

          .sourceIcon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #85aaff;
            background: #101f39;
          }

          .sourceBar strong,
          .sourceBar span {
            display: block;
          }

          .sourceBar strong {
            font-size: 10px;
          }

          .sourceBar span {
            color: #65758e;
            font-size: 9px;
            margin-top: 2px;
          }

          .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px 4px 12px;
            scroll-behavior: smooth;
          }

          .messageRow {
            display: flex;
            margin-bottom: 10px;
          }

          .assistantRow {
            justify-content: flex-start;
          }

          .userRow {
            justify-content: flex-end;
          }

          .messageBubble {
            position: relative;
            max-width: min(780px, 88%);
            padding: 12px 42px 13px 15px;
            border-radius: 14px;
            border: 1px solid #1b2a43;
            line-height: 1.55;
            white-space: pre-wrap;
            font-size: 12px;
          }

          .assistantBubble {
            background: #0b1423;
            color: #d4def0;
            border-top-left-radius: 5px;
          }

          .userBubble {
            background: linear-gradient(
              135deg,
              rgba(28, 78, 168, 0.34),
              rgba(67, 44, 151, 0.28)
            );
            color: #edf4ff;
            border-color: #29477b;
            border-top-right-radius: 5px;
          }

          .messageRole {
            color: #7094d4;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 5px;
            text-transform: uppercase;
          }

          .userBubble .messageRole {
            color: #9f9be9;
          }

          .messageText {
            overflow-wrap: anywhere;
          }

          .messageCopy {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 27px;
            height: 27px;
            display: grid;
            place-items: center;
            border: 1px solid #253752;
            border-radius: 7px;
            background: rgba(6, 12, 23, 0.7);
            color: #71819d;
          }

          .messageCopy:hover {
            color: #dce7fa;
            border-color: #43638f;
          }

          .chatEmpty {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
          }

          .chatEmptyIcon {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            color: #7ca8ff;
            background: #0d1c34;
            border: 1px solid #254575;
            box-shadow: 0 0 35px rgba(43, 103, 226, 0.12);
          }

          .chatEmpty h2 {
            margin: 15px 0 6px;
            font-size: 20px;
          }

          .chatEmpty p {
            max-width: 500px;
            margin: 0;
            color: #65758f;
            font-size: 11px;
          }

          .suggestionGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            margin-top: 18px;
          }

          .suggestionGrid button {
            padding: 8px 10px;
            border: 1px solid #223451;
            border-radius: 8px;
            background: #0a1322;
            color: #8292ac;
            font-size: 9px;
          }

          .suggestionGrid button:hover {
            color: #d5e1f6;
            border-color: #3b5b8e;
          }

          .loadingBubble {
            min-width: 100px;
          }

          .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 17px;
          }

          .typing span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #6685bc;
            animation: typing 1s infinite ease-in-out;
          }

          .typing span:nth-child(2) {
            animation-delay: 0.15s;
          }

          .typing span:nth-child(3) {
            animation-delay: 0.3s;
          }

          @keyframes typing {
            0%,
            60%,
            100% {
              transform: translateY(0);
              opacity: 0.4;
            }

            30% {
              transform: translateY(-3px);
              opacity: 1;
            }
          }

          .chatComposer {
            flex-shrink: 0;
            padding-top: 6px;
          }

          .attachmentTray {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 7px;
          }

          .attachmentChip {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 260px;
            min-height: 32px;
            padding: 5px 7px 5px 9px;
            border: 1px solid #263b5b;
            border-radius: 8px;
            background: #0b1526;
            color: #89a2c9;
          }

          .attachmentChip > div {
            min-width: 0;
          }

          .attachmentChip strong,
          .attachmentChip span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .attachmentChip strong {
            max-width: 175px;
            color: #c9d8ed;
            font-size: 9px;
          }

          .attachmentChip span {
            color: #657792;
            font-size: 8px;
          }

          .attachmentChip > button {
            width: 21px;
            height: 21px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #677995;
          }

          .attachmentChip > button:hover {
            color: #f0a0a0;
            background: #25151c;
          }

          .hiddenFileInput {
            display: none;
          }

          .composerBox {
            position: relative;
            min-height: 108px;
            padding: 12px 12px 56px 14px;
            border: 1px solid #263957;
            border-radius: 15px;
            background: #091321;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.18);
          }

          .composerBox:focus-within {
            border-color: #355c98;
            box-shadow:
              0 0 0 1px rgba(53, 92, 152, 0.15),
              0 8px 35px rgba(0, 0, 0, 0.18);
          }

          .composerBox textarea {
            display: block;
            width: 100%;
            min-height: 53px;
            max-height: 160px;
            resize: vertical;
            border: 0;
            outline: none;
            background: transparent;
            color: #e7eefc;
            font-size: 12px;
            line-height: 1.5;
          }

          .composerBox textarea::placeholder {
            color: #596984;
          }

          .composerControls {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
          }

          .composerIconButton,
          .composerAgentButton,
          .sendButton {
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
          }

          .composerIconButton {
            width: 32px;
            padding: 0;
            border: 1px solid #263958;
            background: #0c1728;
            color: #8093b2;
          }

          .composerIconButton:hover {
            color: #e0eaff;
            border-color: #3a5c8c;
          }

          .composerAgentButton {
            max-width: 170px;
            gap: 6px;
            padding: 0 9px;
            border: 1px solid #293d60;
            background: #0e192b;
            color: #91a8ce;
            font-size: 9px;
            font-weight: 700;
          }

          .composerAgentButton:hover {
            color: #e9f1ff;
            border-color: #42669c;
          }

          .composerAgentButton span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .sendButton {
            width: 35px;
            padding: 0;
            border: 1px solid #3d75ee;
            background: linear-gradient(135deg, #196bff, #7044ee);
            color: white;
            box-shadow: 0 5px 18px rgba(44, 105, 245, 0.2);
          }

          .sendButton:not(:disabled):hover {
            transform: translateY(-1px);
          }

          .agentControl {
            position: relative;
          }

          .agentMenu {
            position: absolute;
            z-index: 50;
            min-width: 250px;
            border: 1px solid #263a5a;
            border-radius: 10px;
            background: #0a1322;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
            overflow: hidden;
          }

          .composerAgentMenu {
            right: 0;
            bottom: calc(100% + 8px);
          }

          .agentMenuTitle {
            padding: 9px 11px;
            border-bottom: 1px solid #192841;
            color: #607493;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1px;
          }

          .agentMenu > button {
            width: 100%;
            display: grid;
            grid-template-columns: 27px 1fr auto;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border: 0;
            border-bottom: 1px solid #141f33;
            background: transparent;
            color: #9caecc;
            text-align: left;
          }

          .agentMenu > button:last-child {
            border-bottom: 0;
          }

          .agentMenu > button:hover,
          .agentMenu > button.selected {
            background: #101d32;
            color: #eef5ff;
          }

          .agentMenuIcon {
            width: 27px;
            height: 27px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: #76a1ff;
            background: #132340;
          }

          .agentMenu strong,
          .agentMenu span {
            display: block;
          }

          .agentMenu strong {
            font-size: 10px;
          }

          .agentMenu span {
            color: #63748f;
            font-size: 8px;
            margin-top: 2px;
          }

          .agentMenu > button > svg {
            color: #4bdc99;
          }

          .composerHint {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 3px 0;
            color: #52627c;
            font-size: 8px;
          }

          .settingsGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
          }

          .connection {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 0;
            border-bottom: 1px solid #162237;
          }

          .connection:last-of-type {
            border-bottom: 0;
          }

          .connectionIcon {
            width: 33px;
            height: 33px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 8px;
            color: #7ba4ff;
            background: #101d33;
          }

          .connection > div:nth-child(2) {
            flex: 1;
            min-width: 0;
          }

          .connection strong {
            display: block;
            font-size: 10px;
          }

          .connection p {
            margin: 3px 0 0;
            color: #63728a;
            font-size: 9px;
          }

          .securityNote {
            margin: 0 0 13px;
            color: #65758e;
            font-size: 9px;
            line-height: 1.5;
          }

          .flowCanvas {
            min-height: 510px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 30px;
            border: 1px solid #16243a;
            border-radius: 11px;
            background:
              linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
              #060c16;
            background-size: 30px 30px;
          }

          .flowNode {
            min-width: 180px;
            padding: 13px;
            display: grid;
            grid-template-columns: 34px 1fr;
            column-gap: 9px;
            align-items: center;
            border: 1px solid #28426c;
            border-radius: 10px;
            background: #0b1728;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
          }

          .flowNodeIcon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            grid-row: span 2;
            border-radius: 8px;
            color: #75a3ff;
            background: #11233e;
          }

          .flowNode strong {
            font-size: 11px;
          }

          .flowNode span {
            color: #63748e;
            font-size: 9px;
            margin-top: 2px;
          }

          .flowArrow {
            color: #4d73ad;
            font-size: 17px;
          }

          .flowSplit {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
          }

          @media (max-width: 1050px) {
            .dashboardGrid {
              grid-template-columns: repeat(2, 1fr);
            }

            .quickActions {
              grid-template-columns: repeat(2, 1fr);
            }

            .buildGrid {
              grid-template-columns: 1fr;
            }
          }

          @media (max-width: 800px) {
            .sidebar {
              display: none;
            }

            .mainArea {
              width: 100%;
              margin-left: 0;
              padding-bottom: 65px;
            }

            .mobileHeader {
              display: flex;
              align-items: center;
              gap: 9px;
              height: 55px;
              padding: 0 15px;
              border-bottom: 1px solid #17243a;
              background: rgba(5, 9, 20, 0.94);
              position: sticky;
              top: 0;
              z-index: 15;
            }

            .mobileHeader strong {
              font-size: 12px;
            }

            .mobileNav {
              display: grid;
              grid-template-columns: repeat(6, 1fr);
              position: fixed;
              left: 0;
              right: 0;
              bottom: 0;
              height: 62px;
              z-index: 30;
              border-top: 1px solid #1b2941;
              background: rgba(5, 9, 20, 0.98);
              backdrop-filter: blur(14px);
            }

            .mobileNav button {
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 3px;
              border: 0;
              background: transparent;
              color: #5f6e87;
              font-size: 7px;
            }

            .mobileNav button.active {
              color: #75a4ff;
            }

            .page {
              padding: 22px 14px 30px;
            }

            .twoColumn,
            .settingsGrid {
              grid-template-columns: 1fr;
            }

            .dashboardGrid {
              grid-template-columns: 1fr 1fr;
            }

            .chatPage {
              height: calc(100vh - 55px);
              padding: 18px 12px 9px;
            }

            .chatHeader {
              padding-bottom: 12px;
            }

            .chatHeader p {
              display: none;
            }

            .copyConversationButton span {
              display: none;
            }

            .copyConversationButton {
              width: 36px;
              padding: 0;
            }

            .sourceBar span {
              display: none;
            }

            .messages {
              padding-top: 12px;
            }

            .messageBubble {
              max-width: 94%;
            }

            .composerAgentButton {
              max-width: 145px;
            }

            .composerHint span:last-child {
              display: none;
            }
          }

          @media (max-width: 520px) {
            .dashboardGrid,
            .quickActions {
              grid-template-columns: 1fr;
            }

            .statusBanner {
              align-items: flex-start;
            }

            .bannerVersion {
              display: none;
            }

            .tabs {
              width: 100%;
              overflow-x: auto;
            }

            .tabs button {
              white-space: nowrap;
            }

            .panel {
              padding: 14px;
            }

            .chatHeader h1 {
              font-size: 24px;
            }

            .composerBox {
              min-height: 105px;
              padding-bottom: 55px;
            }

            .composerAgentButton {
              width: 32px;
              padding: 0;
            }

            .composerAgentButton span {
              display: none;
            }

            .composerControls {
              right: 8px;
              bottom: 8px;
            }

            .composerIconButton,
            .composerAgentButton {
              width: 31px;
              height: 31px;
            }

            .sendButton {
              width: 34px;
              height: 34px;
            }

            .attachmentChip {
              max-width: 100%;
            }

            .attachmentChip strong {
              max-width: 150px;
            }

            .composerHint {
              font-size: 7px;
            }

            .flowSplit {
              width: 100%;
            }

            .flowNode {
              min-width: 150px;
            }
          }
          EOF

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build WBA
        working-directory: client
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          test -f client/dist/index.html
          echo "OU The Builder WBA build verified successfully."
          find client/dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
