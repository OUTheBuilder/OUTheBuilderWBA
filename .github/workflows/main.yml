name: OU The Builder WBA - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Create OU The Builder WBA foundation
        shell: bash
        run: |
          set -e

          mkdir -p src public

          cat > package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "private": true,
            "version": "0.1.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@vitejs/plugin-react": "^5.0.4",
              "vite": "^7.1.7",
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {}
          }
          EOF

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            base: './'
          })
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#050816" />
              <title>OU The Builder</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > src/main.jsx <<'EOF'
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'
          import './App.css'

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          )
          EOF

          cat > src/App.jsx <<'EOF'
          import React, { useState } from 'react'

          const navigation = [
            ['Home', '⌂'],
            ['Projects', '▣'],
            ['Files', '▤'],
            ['Build', '⚙'],
            ['AI Chat', '✦'],
            ['Image Flow', '◇'],
            ['Google Drive', '☁'],
            ['Settings', '⚙']
          ]

          function App() {
            const [active, setActive] = useState('Home')
            const [message, setMessage] = useState('')

            const sendMessage = () => {
              if (!message.trim()) return
              setMessage('')
            }

            return (
              <div className="app">
                <header className="topbar">
                  <div className="brand">
                    <div className="logo">OU</div>
                    <div>
                      <div className="brand-name">OU The Builder</div>
                      <div className="brand-subtitle">Web-Based Application</div>
                    </div>
                  </div>

                  <div className="online">
                    <span></span>
                    Online
                  </div>
                </header>

                <div className="layout">
                  <aside className="sidebar">
                    <div className="nav-title">BUILDER</div>

                    {navigation.map(([name, icon]) => (
                      <button
                        key={name}
                        className={`nav-item ${active === name ? 'active' : ''}`}
                        onClick={() => setActive(name)}
                      >
                        <span className="nav-icon">{icon}</span>
                        <span>{name}</span>
                      </button>
                    ))}
                  </aside>

                  <main className="main">
                    <section className="hero">
                      <div>
                        <div className="eyebrow">FOUNDATION STAGE</div>
                        <h1>Welcome to <span>OU The Builder</span></h1>
                        <p>
                          Build, manage, visualize and compile your projects
                          from one web-based workspace.
                        </p>
                      </div>

                      <div className="hero-badge">
                        <strong>v0.1.0</strong>
                        <span>Foundation</span>
                      </div>
                    </section>

                    <section className="cards">
                      <div className="card ai">
                        <div className="card-icon">✦</div>
                        <div>
                          <h2>AI Builder</h2>
                          <p>Use AI as the central control interface for your builder.</p>
                          <button onClick={() => setActive('AI Chat')}>Open AI Chat</button>
                        </div>
                      </div>

                      <div className="card">
                        <div className="card-icon">▣</div>
                        <div>
                          <h2>Projects</h2>
                          <p>Create, import, manage and export your projects.</p>
                          <button onClick={() => setActive('Projects')}>Open Projects</button>
                        </div>
                      </div>

                      <div className="card">
                        <div className="card-icon">⚙</div>
                        <div>
                          <h2>Build</h2>
                          <p>Prepare projects for remote compilation and APK generation.</p>
                          <button onClick={() => setActive('Build')}>Open Build</button>
                        </div>
                      </div>

                      <div className="card">
                        <div className="card-icon">◇</div>
                        <div>
                          <h2>Image Flow</h2>
                          <p>Visualize application screens, buttons and navigation.</p>
                          <button onClick={() => setActive('Image Flow')}>Open Image Flow</button>
                        </div>
                      </div>
                    </section>

                    <section className="workspace">
                      <div className="panel chat-panel">
                        <div className="panel-header">
                          <div>
                            <h2>AI Chat</h2>
                            <p>Central Builder Control</p>
                          </div>
                          <span className="status-dot">Ready</span>
                        </div>

                        <div className="chat-area">
                          <div className="assistant-message">
                            <div className="avatar">OU</div>
                            <div>
                              <strong>OU Builder</strong>
                              <p>
                                Hello! Tell me what you want to build, import,
                                inspect or compile.
                              </p>
                            </div>
                          </div>
                        </div>

                        <div className="chat-input">
                          <input
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter') sendMessage()
                            }}
                            placeholder="Tell OU The Builder what to do..."
                          />
                          <button onClick={sendMessage}>Send</button>
                        </div>
                      </div>

                      <div className="panel">
                        <div className="panel-header">
                          <div>
                            <h2>System Status</h2>
                            <p>Foundation services</p>
                          </div>
                        </div>

                        <div className="status-list">
                          <div>
                            <span>WBA Interface</span>
                            <b>Ready</b>
                          </div>
                          <div>
                            <span>Project System</span>
                            <b>Foundation</b>
                          </div>
                          <div>
                            <span>Build System</span>
                            <b>Foundation</b>
                          </div>
                          <div>
                            <span>AI Interface</span>
                            <b>Ready</b>
                          </div>
                        </div>
                      </div>
                    </section>

                    <section className="lower-grid">
                      <div className="panel">
                        <div className="panel-header">
                          <div>
                            <h2>Current Project</h2>
                            <p>No project selected</p>
                          </div>
                        </div>

                        <div className="empty-state">
                          <div className="empty-icon">▣</div>
                          <strong>No project selected</strong>
                          <p>Create or import a project to begin.</p>
                          <button onClick={() => setActive('Projects')}>
                            Manage Projects
                          </button>
                        </div>
                      </div>

                      <div className="panel">
                        <div className="panel-header">
                          <div>
                            <h2>Quick Actions</h2>
                            <p>Common builder actions</p>
                          </div>
                        </div>

                        <div className="quick-actions">
                          <button onClick={() => setActive('Projects')}>＋ New Project</button>
                          <button onClick={() => setActive('Files')}>↑ Import Project</button>
                          <button onClick={() => setActive('Build')}>⚙ Build Project</button>
                          <button onClick={() => setActive('Image Flow')}>◇ View Flow</button>
                        </div>
                      </div>
                    </section>

                    <section className="panel activity">
                      <div className="panel-header">
                        <div>
                          <h2>Recent Activity</h2>
                          <p>Latest builder activity</p>
                        </div>
                      </div>

                      <div className="activity-row">
                        <span className="activity-dot"></span>
                        <div>
                          <strong>OU The Builder WBA foundation loaded</strong>
                          <p>System ready for the next development stage.</p>
                        </div>
                        <time>Now</time>
                      </div>
                    </section>

                    <footer>
                      OU The Builder · Web-Based Application · v0.1.0 · Foundation Stage
                    </footer>
                  </main>
                </div>
              </div>
            )
          }

          export default App
          EOF

          cat > src/App.css <<'EOF'
          * {
            box-sizing: border-box;
          }

          :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #eef4ff;
            background: #050816;
          }

          body {
            margin: 0;
            min-width: 320px;
            background:
              radial-gradient(circle at 20% 10%, rgba(45, 91, 255, .13), transparent 30%),
              radial-gradient(circle at 80% 30%, rgba(139, 52, 255, .10), transparent 28%),
              #050816;
          }

          button,
          input {
            font: inherit;
          }

          button {
            cursor: pointer;
          }

          .app {
            min-height: 100vh;
          }

          .topbar {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid rgba(130, 160, 220, .15);
            background: rgba(5, 8, 22, .92);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 10;
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 13px;
          }

          .logo {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            font-weight: 900;
            background: linear-gradient(135deg, #168cff, #8d45ff);
            box-shadow: 0 0 25px rgba(62, 112, 255, .35);
          }

          .brand-name {
            font-weight: 800;
            font-size: 18px;
          }

          .brand-subtitle {
            color: #8290aa;
            font-size: 12px;
            margin-top: 2px;
          }

          .online {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7fe6b2;
            font-size: 13px;
          }

          .online span,
          .status-dot,
          .activity-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #35dc8c;
            box-shadow: 0 0 10px rgba(53, 220, 140, .7);
          }

          .layout {
            display: flex;
          }

          .sidebar {
            width: 235px;
            min-height: calc(100vh - 76px);
            padding: 25px 14px;
            border-right: 1px solid rgba(130, 160, 220, .12);
            background: rgba(4, 7, 19, .72);
          }

          .nav-title {
            color: #5f6c85;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 0 13px 12px;
          }

          .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            border: 0;
            border-radius: 10px;
            padding: 12px 13px;
            margin-bottom: 5px;
            color: #8793aa;
            background: transparent;
            text-align: left;
          }

          .nav-item:hover,
          .nav-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(37, 112, 255, .20), rgba(117, 61, 255, .12));
          }

          .nav-item.active {
            box-shadow: inset 3px 0 0 #348cff;
          }

          .nav-icon {
            width: 22px;
            text-align: center;
            color: #56a5ff;
          }

          .main {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px;
          }

          .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 32px;
            margin-bottom: 20px;
            border: 1px solid rgba(83, 127, 220, .18);
            border-radius: 18px;
            background:
              linear-gradient(120deg, rgba(27, 77, 155, .17), rgba(92, 47, 150, .13)),
              rgba(11, 17, 39, .72);
          }

          .eyebrow {
            color: #4ca1ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
          }

          h1 {
            margin: 0;
            font-size: clamp(27px, 4vw, 42px);
          }

          h1 span {
            background: linear-gradient(90deg, #48a7ff, #a35cff);
            -webkit-background-clip: text;
            color: transparent;
          }

          .hero p {
            color: #8c99b2;
            max-width: 720px;
            margin-bottom: 0;
          }

          .hero-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            padding: 13px;
            border: 1px solid rgba(83, 127, 220, .2);
            border-radius: 12px;
            background: rgba(0, 0, 0, .15);
          }

          .hero-badge span {
            color: #77849d;
            font-size: 11px;
            margin-top: 3px;
          }

          .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
          }

          .card,
          .panel {
            border: 1px solid rgba(103, 131, 193, .15);
            border-radius: 15px;
            background: rgba(12, 18, 40, .72);
          }

          .card {
            padding: 20px;
          }

          .card-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            margin-bottom: 15px;
            border-radius: 11px;
            color: #69b5ff;
            background: rgba(49, 124, 255, .12);
            font-size: 20px;
          }

          .card h2,
          .panel h2 {
            margin: 0;
            font-size: 17px;
          }

          .card p,
          .panel-header p {
            color: #7f8da7;
            font-size: 13px;
            line-height: 1.55;
          }

          .card button,
          .empty-state button {
            border: 1px solid rgba(67, 145, 255, .28);
            border-radius: 8px;
            padding: 8px 11px;
            color: #b9dcff;
            background: rgba(44, 119, 255, .10);
          }

          .workspace,
          .lower-grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 14px;
            margin-top: 14px;
          }

          .panel {
            padding: 20px;
          }

          .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
          }

          .panel-header p {
            margin: 4px 0 0;
          }

          .status-dot {
            width: auto;
            height: auto;
            border-radius: 20px;
            padding: 5px 9px;
            font-size: 11px;
            box-shadow: none;
            background: rgba(53, 220, 140, .10);
            color: #7fe6b2;
          }

          .chat-area {
            min-height: 130px;
            padding: 15px;
            border-radius: 11px;
            background: rgba(2, 5, 15, .45);
          }

          .assistant-message {
            display: flex;
            gap: 11px;
            color: #dbe5f8;
            font-size: 13px;
          }

          .assistant-message p {
            color: #8491aa;
            margin: 5px 0;
          }

          .avatar {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: linear-gradient(135deg, #237eff, #8545ff);
            font-size: 10px;
            font-weight: 800;
          }

          .chat-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
          }

          .chat-input input {
            min-width: 0;
            flex: 1;
            border: 1px solid rgba(103, 131, 193, .18);
            border-radius: 9px;
            outline: none;
            padding: 11px;
            color: white;
            background: rgba(3, 7, 18, .65);
          }

          .chat-input button {
            border: 0;
            border-radius: 9px;
            padding: 0 16px;
            color: white;
            background: linear-gradient(135deg, #197eff, #7546ed);
          }

          .status-list {
            display: grid;
            gap: 11px;
          }

          .status-list div {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px;
            border-radius: 9px;
            background: rgba(4, 8, 20, .45);
            color: #8996ae;
            font-size: 13px;
          }

          .status-list b {
            color: #72dfa8;
            font-weight: 600;
          }

          .empty-state {
            text-align: center;
            padding: 18px 10px 5px;
          }

          .empty-icon {
            font-size: 30px;
            color: #568dff;
            margin-bottom: 10px;
          }

          .empty-state strong {
            display: block;
          }

          .empty-state p {
            color: #77849e;
            font-size: 13px;
            margin: 7px 0 15px;
          }

          .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
          }

          .quick-actions button {
            border: 1px solid rgba(103, 131, 193, .15);
            border-radius: 9px;
            padding: 13px 8px;
            color: #aebbd2;
            background: rgba(4, 8, 20, .45);
          }

          .quick-actions button:hover {
            border-color: rgba(70, 144, 255, .4);
            color: white;
          }

          .activity {
            margin-top: 14px;
          }

          .activity-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            border-radius: 9px;
            background: rgba(4, 8, 20, .45);
            font-size: 13px;
          }

          .activity-row p {
            color: #77849e;
            margin: 4px 0 0;
          }

          .activity-row time {
            margin-left: auto;
            color: #65718a;
            font-size: 11px;
          }

          footer {
            padding: 25px 5px 8px;
            text-align: center;
            color: #56637b;
            font-size: 11px;
          }

          @media (max-width: 1050px) {
            .cards {
              grid-template-columns: repeat(2, 1fr);
            }

            .sidebar {
              width: 200px;
            }
          }

          @media (max-width: 760px) {
            .topbar {
              padding: 0 15px;
              height: 68px;
            }

            .sidebar {
              width: 100%;
              min-height: auto;
              display: flex;
              overflow-x: auto;
              padding: 8px;
              border-right: 0;
              border-bottom: 1px solid rgba(130, 160, 220, .12);
            }

            .layout {
              display: block;
            }

            .nav-title {
              display: none;
            }

            .nav-item {
              min-width: max-content;
              width: auto;
              margin: 0 2px;
              padding: 10px 12px;
            }

            .nav-item.active {
              box-shadow: inset 0 -3px 0 #348cff;
            }

            .nav-item span:last-child {
              font-size: 12px;
            }

            .main {
              padding: 15px;
            }

            .hero {
              padding: 22px;
              align-items: flex-start;
            }

            .hero-badge {
              display: none;
            }

            .cards,
            .workspace,
            .lower-grid {
              grid-template-columns: 1fr;
            }

            .cards {
              gap: 10px;
            }

            .brand-subtitle {
              display: none;
            }
          }

          @media (max-width: 430px) {
            .brand-name {
              font-size: 15px;
            }

            .online {
              font-size: 11px;
            }

            .hero {
              padding: 18px;
            }

            h1 {
              font-size: 27px;
            }

            .quick-actions {
              grid-template-columns: 1fr;
            }
          }
          EOF

          touch public/.nojekyll

      - name: Install dependencies
        run: npm install

      - name: Build WBA
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "OU The Builder WBA build completed successfully."
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
