                      )
                    }
                  >

                    <span
                      className="logo-small"
                    >
                      OU
                    </span>


                    <span>

                      <strong>
                        OU The Builder
                      </strong>

                      <small>
                        Web-Based Application
                      </small>

                    </span>

                  </button>


                  <div
                    className="online"
                  >

                    <span></span>

                    ONLINE

                  </div>


                  <nav>

                    {NAV.map(
                      ([
                        id,
                        icon,
                        label
                      ]) => {

                        if (
                          id ===
                            "settings" &&
                          role !==
                            "Super Admin"
                        ) {

                          return null;

                        }


                        return (

                          <button
                            key={
                              id
                            }
                            className={
                              screen ===
                              id
                                ? "nav-item active"
                                : "nav-item"
                            }
                            onClick={() =>
                              setScreen(
                                id
                              )
                            }
                          >

                            <span>
                              {
                                icon
                              }
                            </span>


                            {
                              label
                            }

                          </button>

                        );

                      }
                    )}

                  </nav>


                  <div
                    className="sidebar-bottom"
                  >

                    <div
                      className="role-card"
                    >

                      <span>
                        ROLE
                      </span>


                      <strong>
                        {
                          role
                        }
                      </strong>

                    </div>


                    <button
                      className="logout-button"
                      onClick={
                        logout
                      }
                    >
                      LOG OUT
                    </button>

                  </div>

                </aside>


                <main
                  className="main-content"
                >

                  {
                    renderScreen()
                  }

                </main>

              </div>

            );

          }


          // =====================================================
          // SMALL COMPONENTS
          // =====================================================

          function Stat({
            title,
            value,
            icon
          }) {

            return (

              <div
                className="stat-card"
              >

                <span
                  className="stat-icon"
                >
                  {
                    icon
                  }
                </span>


                <div>

