            return (

              <button
                className="feature-card"
                onClick={
                  action
                }
              >

                <h3>
                  {
                    title
                  }
                </h3>


                <p>
                  {
                    text
                  }
                </p>


                <span>
                  OPEN →
                </span>

              </button>

            );

          }


          function PageHeader({
            title,
            text,
            action
          }) {

            return (

              <div
                className="page-header"
              >

                <div>

                  <span
                    className="eyebrow"
                  >
                    OU THE BUILDER
                  </span>


                  <h1>
                    {
                      title
                    }
                  </h1>


                  <p>
                    {
                      text
                    }
                  </p>

                </div>


                {
                  action
                }

              </div>

            );

          }


          function Empty({
            icon,
            title,
            text
          }) {

            return (

              <div
                className="empty-panel"
              >

                <div
                  className="big-icon"
                >
                  {
                    icon
                  }
                </div>


                <h2>
                  {
                    title
                  }
                </h2>


                <p>
                  {
                    text
                  }
                </p>

              </div>

            );

          }


          function FlowNode({
            title
          }) {

            return (

              <div
                className="flow-node"
              >

                <span>
                  SCREEN
                </span>


                <strong>
                  {
                    title
                  }
                </strong>

              </div>

            );

          }


          // =====================================================
          // START APPLICATION
          // =====================================================

          createRoot(
            document.getElementById(
              "root"
            )
          ).render(
            <App />
          );

