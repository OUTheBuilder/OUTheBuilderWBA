name: OU The Builder WBA - Multi Agent Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Create OU The Builder WBA
        shell: bash
        run: |
          set -e

          rm -rf client
          mkdir -p client/src

          cat > client/package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "private": true,
            "version": "0.4.1",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@vitejs/plugin-react": "5.0.4",
              "vite": "7.1.7",
              "react": "19.1.1",
              "react-dom": "19.1.1"
            },
            "devDependencies": {}
          }
          EOF

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#07101f" />
              <title>OU The Builder</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > client/vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            base: "/OUTheBuilderWBA/",
            plugins: [react()]
          });
          EOF

          cat > client/src/main.jsx <<'EOF'
          import React, { useEffect, useMemo, useRef, useState } from "react";
          import { createRoot } from "react-dom/client";
          import "./styles.css";

          const DEFAULT_ADMIN = "Admins123";

          const AGENTS = [
            {
              id: "builder",
              name: "OU Builder AI",
              description: "Builder control and project assistant",
              prompt:
                "You are OU Builder AI, the main assistant for OU The Builder. Help the user create, inspect, modify, organize and build projects. Give practical step-by-step answers and understand builder commands."
            },
            {
              id: "coding",
              name: "Coding Agent",
              description: "Code and debugging assistant",
              prompt:
                "You are the Coding Agent for OU The Builder. Help write, inspect, explain and debug code. Prefer complete working solutions and identify likely errors clearly."
            },
            {
              id: "general",
              name: "General AI",
              description: "General purpose assistant",
              prompt:
                "You are a helpful general-purpose AI assistant inside OU The Builder."
            },
            {
              id: "research",
              name: "Research Agent",
              description: "Research and information assistant",
              prompt:
                "You are the Research Agent inside OU The Builder. Organize information carefully, distinguish known facts from uncertainty, and provide useful research-oriented answers."
            },
            {
              id: "free",
              name: "Free Auto Agent",
              description: "Free OpenRouter model router",
              prompt:
                "You are the Free Auto Agent inside OU The Builder. Be useful, concise and practical while helping with projects, coding and builder tasks."
            }
          ];

          const NAV = [
            ["home", "Home", "⌂"],
            ["projects", "Projects", "▣"],
            ["files", "Files", "□"],
            ["build", "Build", "▶"],
            ["chat", "AI Chat", "✦"],
            ["flow", "Image Flow", "◇"],
            ["drive", "Google Drive", "☁"],
            ["settings", "Settings", "⚙"]
          ];

          const defaultSettings = {
            maxAdmin: 3,
            maxMember: 2,
            maxGuest: 10,
            guestPerAdmin: 10,
            guestPerMember: 10,
            guestBuilds: 1
          };

          function read(key, fallback) {
            try {
              const value = localStorage.getItem(key);
              return value === null ? fallback : JSON.parse(value);
            } catch {
              return fallback;
            }
          }

          function write(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
          }

          function makeId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
          }

          function makeCode(prefix) {
            return (
              prefix +
              "-" +
              Math.random().toString(36).slice(2, 8).toUpperCase() +
              Math.random().toString(36).slice(2, 6).toUpperCase()
            );
          }

          function AccessScreen({ onLogin }) {
            const [code, setCode] = useState("");
            const [name, setName] = useState(read("ou_request_name", ""));
            const [requestMode, setRequestMode] = useState(false);
            const [message, setMessage] = useState("");

            useEffect(() => {
              const timer = setInterval(() => {
                const savedName = localStorage.getItem("ou_request_name");
                if (!savedName) return;

                const requests = read("ou_access_requests", []);
                const found = requests.find(
                  item =>
                    item.name.toLowerCase() === savedName.toLowerCase() &&
                    item.status === "approved" &&
                    item.code
                );

                if (found) {
                  setCode(found.code);
                  setMessage("Your access code was received automatically.");
                }
              }, 1000);

              return () => clearInterval(timer);
            }, []);

            function submitLogin(event) {
              event.preventDefault();

              const entered = code.trim();

              if (entered === DEFAULT_ADMIN) {
                onLogin({
                  role: "Super Admin",
                  code: DEFAULT_ADMIN
                });
                return;
              }

              const customAdmins = read("ou_custom_super_admins", []);
              const custom = customAdmins.find(item => item.code === entered);

              if (custom) {
                onLogin({
                  role: "Super Admin",
                  code: entered
                });
                return;
              }

              const codes = read("ou_access_codes", []);
              const found = codes.find(item => item.code === entered && item.active);

              if (!found) {
                setMessage("Invalid or inactive access code.");
                return;
              }

              onLogin({
                role: found.role,
                code: found.code
              });
            }

            function requestAccess(event) {
              event.preventDefault();

              if (!name.trim()) {
                setMessage("Enter your name first.");
                return;
              }

              const requests = read("ou_access_requests", []);

              const existing = requests.find(
                item =>
                  item.name.toLowerCase() === name.trim().toLowerCase() &&
                  item.status === "pending"
              );

              if (existing) {
                setMessage("Your request is already waiting for Super Admin.");
                return;
              }

              requests.push({
                id: makeId(),
                name: name.trim(),
                status: "pending",
                code: "",
                createdAt: new Date().toISOString()
              });

              write("ou_access_requests", requests);
              localStorage.setItem("ou_request_name", name.trim());

              setMessage(
                "Request sent. Your access code will appear here when approved."
              );
            }

            return (
              <div className="access-page">
                <div className="access-card">
                  <div className="logo-mark">OU</div>

                  <div className="eyebrow">WEB-BASED APPLICATION</div>

                  <h1>OU The Builder</h1>

                  <p className="muted">
                    Secure access to your application builder.
                  </p>

                  {!requestMode ? (
                    <form onSubmit={submitLogin}>
                      <label>Password / Access Code</label>

                      <input
                        value={code}
                        onChange={e => setCode(e.target.value)}
                        placeholder="Enter access code"
                        autoComplete="off"
                      />

                      <button className="primary-button full" type="submit">
                        ENTER
                      </button>

                      <button
                        className="text-button"
                        type="button"
                        onClick={() => {
                          setRequestMode(true);
                          setMessage("");
                        }}
                      >
                        Request an access code
                      </button>

                      <div className="demo-note">
                        Foundation prototype default Super Admin:
                        <strong> Admins123</strong>
                      </div>
                    </form>
                  ) : (
                    <form onSubmit={requestAccess}>
                      <label>Your name</label>

                      <input
                        value={name}
                        onChange={e => setName(e.target.value)}
                        placeholder="Enter your name"
                      />

                      <button className="primary-button full" type="submit">
                        REQUEST CODE
                      </button>

                      <button
                        className="text-button"
                        type="button"
                        onClick={() => {
                          setRequestMode(false);
                          setMessage("");
                        }}
                      >
                        Back to access
                      </button>
                    </form>
                  )}

                  {message && <div className="notice">{message}</div>}

                  <div className="version">Foundation v0.4.1</div>
                </div>
              </div>
            );
          }

          function Home({ session, go }) {
            const projects = read("ou_projects", []);

            return (
              <div>
                <section className="hero">
                  <div>
                    <div className="eyebrow">WELCOME BACK</div>
                    <h1>Build with OU The Builder</h1>
                    <p>
                      Your AI-assisted application builder foundation is ready.
                    </p>
                  </div>

                  <div className="role-badge">{session.role}</div>
                </section>

                <div className="grid three">
                  <button className="feature-card" onClick={() => go("projects")}>
                    <span>▣</span>
                    <h3>Projects</h3>
                    <p>{projects.length} project(s)</p>
                  </button>

                  <button className="feature-card" onClick={() => go("build")}>
                    <span>▶</span>
                    <h3>Build</h3>
                    <p>Prepare and compile projects</p>
                  </button>

                  <button className="feature-card" onClick={() => go("chat")}>
                    <span>✦</span>
                    <h3>AI Chat</h3>
                    <p>Multiple selectable AI agents</p>
                  </button>
                </div>

                <div className="grid two">
                  <section className="panel">
                    <div className="panel-title">
                      <h2>System Status</h2>
                      <span className="online">● Online</span>
                    </div>

                    <div className="status-list">
                      <div><span>WBA</span><b>Running</b></div>
                      <div><span>AI Chat</span><b>Ready</b></div>
                      <div><span>Projects</span><b>Available</b></div>
                      <div><span>Build System</span><b>Foundation</b></div>
                    </div>
                  </section>

                  <section className="panel">
                    <div className="panel-title">
                      <h2>Quick Actions</h2>
                    </div>

                    <div className="quick-actions">
                      <button onClick={() => go("projects")}>New Project</button>
                      <button onClick={() => go("files")}>Upload Files</button>
                      <button onClick={() => go("chat")}>Open AI Chat</button>
                      <button onClick={() => go("build")}>Build Project</button>
                    </div>
                  </section>
                </div>
              </div>
            );
          }

          function Projects({ session }) {
            const [projects, setProjects] = useState(() =>
              read("ou_projects", [])
            );

            useEffect(() => {
              write("ou_projects", projects);
            }, [projects]);

            function createProject() {
              const name = window.prompt("Project name:");

              if (!name || !name.trim()) return;

              if (session.role === "Guest" && projects.length >= 1) {
                alert("Guest accounts can create only one project.");
                return;
              }

              setProjects([
                ...projects,
                {
                  id: makeId(),
                  name: name.trim(),
                  createdAt: new Date().toISOString()
                }
              ]);
            }

            function deleteProject(id) {
              if (session.role === "Guest") {
                alert("Guest accounts have limited project modification access.");
                return;
              }

              setProjects(projects.filter(item => item.id !== id));
            }

            return (
              <div>
                <PageHeader
                  title="Projects"
                  subtitle="Create and manage builder projects."
                />

                <div className="toolbar">
                  <button className="primary-button" onClick={createProject}>
                    + NEW PROJECT
                  </button>
                </div>

                {projects.length === 0 ? (
                  <Empty text="No projects yet." />
                ) : (
                  <div className="grid three">
                    {projects.map(project => (
                      <div className="project-card" key={project.id}>
                        <div className="project-icon">▣</div>
                        <h3>{project.name}</h3>
                        <p>OU Builder Project</p>

                        <button
                          className="danger-button"
                          onClick={() => deleteProject(project.id)}
                        >
                          Delete
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          }

          function Files() {
            const [files, setFiles] = useState([]);

            function chooseFiles(event) {
              const selected = Array.from(event.target.files || []);

              setFiles(old => [
                ...old,
                ...selected.map(file => ({
                  name: file.name,
                  size: file.size
                }))
              ]);
            }

            return (
              <div>
                <PageHeader
                  title="Files"
                  subtitle="Project files and resources."
                />

                <section className="panel upload-panel">
                  <label className="upload-box">
                    <input
                      type="file"
                      multiple
                      onChange={chooseFiles}
                    />
                    <span className="upload-icon">↑</span>
                    <strong>Select project files</strong>
                    <small>
                      ZIP, source code, images, PDF, audio, video and other files
                    </small>
                  </label>
                </section>

                <section className="panel">
                  <div className="panel-title">
                    <h2>Selected Files</h2>
                    <span>{files.length}</span>
                  </div>

                  {files.length === 0 ? (
                    <Empty text="No files selected." />
                  ) : (
                    <div className="file-list">
                      {files.map((file, index) => (
                        <div className="file-row" key={index}>
                          <span>□</span>
                          <div>
                            <strong>{file.name}</strong>
                            <small>{Math.round(file.size / 1024)} KB</small>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>
              </div>
            );
          }

          function Build({ session }) {
            const [target, setTarget] = useState("Android APK");
            const [building, setBuilding] = useState(false);
            const [consoleLines, setConsoleLines] = useState([]);
            const [guestBuilds, setGuestBuilds] = useState(() =>
              session.role === "Guest"
                ? read("ou_guest_build_" + session.code, 0)
                : 0
            );

            function runBuild() {
              if (building) return;

              if (session.role === "Guest" && guestBuilds >= 1) {
                alert("Your Guest build allowance has already been used.");
                return;
              }

              setBuilding(true);
              setConsoleLines([]);

              const lines = [
                "Project check started",
                "Checking compatibility",
                "Checking project resources",
                "Preparing build environment",
                "Starting remote build request",
                "Compiling project",
                "Packaging output",
                "Verifying build",
                "BUILD FOUNDATION COMPLETE"
              ];

              lines.forEach((line, index) => {
                setTimeout(() => {
                  setConsoleLines(old => [...old, line]);

                  if (index === lines.length - 1) {
                    setBuilding(false);

                    if (session.role === "Guest") {
                      const next = guestBuilds + 1;
                      setGuestBuilds(next);
                      write("ou_guest_build_" + session.code, next);
                    }
                  }
                }, index * 450);
              });
            }

            return (
              <div>
                <PageHeader
                  title="Build"
                  subtitle="Project compatibility and remote build foundation."
                />

                <div className="grid two">
                  <section className="panel">
                    <label>Build Target</label>

                    <select
                      value={target}
                      onChange={e => setTarget(e.target.value)}
                    >
                      <option>Android APK</option>
                      <option>Web App</option>
                      <option>Hybrid App</option>
                    </select>

                    <div className="build-info">
                      <div><span>Role</span><b>{session.role}</b></div>
                      <div>
                        <span>Guest builds</span>
                        <b>
                          {session.role === "Guest"
                            ? guestBuilds + " / 1"
                            : "Unlimited"}
                        </b>
                      </div>
                    </div>

                    <button
                      className="primary-button full"
                      onClick={runBuild}
                      disabled={building}
                    >
                      {building ? "BUILDING..." : "RUN BUILD"}
                    </button>
                  </section>

                  <section className="panel">
                    <div className="panel-title">
                      <h2>Build Console</h2>
                      <span>{building ? "Running" : "Ready"}</span>
                    </div>

                    <div className="console">
                      {consoleLines.length === 0 && (
                        <span className="console-muted">
                          Build output will appear here.
                        </span>
                      )}

                      {consoleLines.map((line, index) => (
                        <div key={index}>
                          <span className="console-arrow">›</span> {line}
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              </div>
            );
          }

          function Chat() {
            const [agentId, setAgentId] = useState(
              () => localStorage.getItem("ou_selected_agent") || "builder"
            );

            const agent = useMemo(
              () => AGENTS.find(item => item.id === agentId) || AGENTS[0],
              [agentId]
            );

            const storageKey = "ou_chat_" + agentId;

            const [messages, setMessages] = useState(() =>
              read(storageKey, [
                {
                  role: "assistant",
                  content:
                    "Hello. I am " +
                    agent.name +
                    ". Select an agent and start a conversation."
                }
              ])
            );

            const [input, setInput] = useState("");
            const [busy, setBusy] = useState(false);
            const bottomRef = useRef(null);

            useEffect(() => {
              localStorage.setItem("ou_selected_agent", agentId);

              setMessages(
                read("ou_chat_" + agentId, [
                  {
                    role: "assistant",
                    content:
                      "Hello. I am " +
                      agent.name +
                      ". How can I help you?"
                  }
                ])
              );
            }, [agentId]);

            useEffect(() => {
              write(storageKey, messages);

              if (bottomRef.current) {
                bottomRef.current.scrollIntoView({
                  behavior: "smooth"
                });
              }
            }, [messages, storageKey]);

            function newChat() {
              const first = {
                role: "assistant",
                content:
                  "New conversation started with " +
                  agent.name +
                  "."
              };

              setMessages([first]);
            }

            async function sendMessage() {
              const text = input.trim();

              if (!text || busy) return;

              const key = localStorage.getItem("ou_openrouter_key");

              const userMessage = {
                role: "user",
                content: text
              };

              setMessages(old => [...old, userMessage]);
              setInput("");

              if (!key) {
                setMessages(old => [
                  ...old,
                  {
                    role: "assistant",
                    content:
                      "Your OpenRouter API key is not configured yet. Open Settings → AI Agent Settings and enter your key."
                  }
                ]);
                return;
              }

              setBusy(true);

              try {
                const history = [...messages, userMessage].slice(-20);

                const response = await fetch(
                  "https://openrouter.ai/api/v1/chat/completions",
                  {
                    method: "POST",
                    headers: {
                      Authorization: "Bearer " + key,
                      "Content-Type": "application/json",
                      "HTTP-Referer": window.location.origin,
                      "X-Title": "OU The Builder"
                    },
                    body: JSON.stringify({
                      model: "openrouter/free",
                      messages: [
                        {
                          role: "system",
                          content:
                            agent.prompt +
                            " The user is communicating through the OU The Builder WBA."
                        },
                        ...history
                      ]
                    })
                  }
                );

                const data = await response.json();

                if (!response.ok) {
                  throw new Error(
                    data?.error?.message || "OpenRouter request failed."
                  );
                }

                const answer =
                  data?.choices?.[0]?.message?.content ||
                  "The agent returned no text response.";

                setMessages(old => [
                  ...old,
                  {
                    role: "assistant",
                    content: answer
                  }
                ]);
              } catch (error) {
                setMessages(old => [
                  ...old,
                  {
                    role: "assistant",
                    content:
                      "AI connection error: " +
                      error.message +
                      ". Check your API key and network connection."
                  }
                ]);
              } finally {
                setBusy(false);
              }
            }

            function handleKeyDown(event) {
              if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
              }
            }

            async function copyLast() {
              const last = messages[messages.length - 1];

              if (!last) return;

              try {
                await navigator.clipboard.writeText(last.content);
                alert("Last message copied.");
              } catch {
                alert("Copy was not available on this browser.");
              }
            }

            return (
              <div className="chat-page">
                <PageHeader
                  title="AI Chat"
                  subtitle="Multiple agents with persistent conversations."
                />

                <section className="chat-shell">
                  <div className="chat-top">
                    <div>
                      <label>AI Agent</label>

                      <select
                        value={agentId}
                        onChange={e => setAgentId(e.target.value)}
                      >
                        {AGENTS.map(item => (
                          <option key={item.id} value={item.id}>
                            {item.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="agent-description">
                      {agent.description}
                    </div>
                  </div>

                  <div className="messages">
                    {messages.map((message, index) => (
                      <div
                        className={
                          "message-row " +
                          (message.role === "user" ? "user" : "assistant")
                        }
                        key={index}
                      >
                        <div className="message">
                          <small>
                            {message.role === "user" ? "You" : agent.name}
                          </small>
                          <div>{message.content}</div>
                        </div>
                      </div>
                    ))}

                    {busy && (
                      <div className="message-row assistant">
                        <div className="message typing">
                          {agent.name} is thinking...
                        </div>
                      </div>
                    )}

                    <div ref={bottomRef} />
                  </div>

                  <div className="composer">
                    <textarea
                      value={input}
                      onChange={e => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder="Ask the selected agent anything..."
                      rows="3"
                    />

                    <div className="composer-actions">
                      <button
                        className="secondary-button"
                        onClick={newChat}
                      >
                        + New Chat
                      </button>

                      <button
                        className="secondary-button"
                        onClick={copyLast}
                      >
                        Copy
                      </button>

                      <button
                        className="primary-button send-button"
                        onClick={sendMessage}
                        disabled={busy}
                      >
                        {busy ? "..." : "Send"}
                      </button>
                    </div>

                    <div className="composer-hint">
                      Enter = Send · Shift + Enter = New line
                    </div>
                  </div>
                </section>
              </div>
            );
          }

          function Flow() {
            return (
              <div>
                <PageHeader
                  title="Image Flow"
                  subtitle="Visual application screen and navigation flow."
                />

                <section className="panel">
                  <div className="flow">
                    <FlowNode title="Home" subtitle="Main screen" />
                    <div className="flow-arrow">↓</div>
                    <FlowNode title="Projects" subtitle="Project manager" />
                    <div className="flow-arrow">↓</div>
                    <FlowNode title="Build" subtitle="Compile project" />
                    <div className="flow-arrow">↓</div>
                    <FlowNode title="APK" subtitle="Build output" />
                  </div>

                  <div className="notice">
                    The future Image Flow engine will generate this view from
                    the actual project screens, buttons and navigation.
                  </div>
                </section>
              </div>
            );
          }

          function Drive() {
            return (
              <div>
                <PageHeader
                  title="Google Drive"
                  subtitle="Cloud storage integration."
                />

                <section className="panel center-panel">
                  <div className="big-icon">☁</div>
                  <h2>Google Drive Integration</h2>
                  <p>
                    OAuth-based Drive storage will be connected in the backend
                    stage.
                  </p>
                  <button className="secondary-button" disabled>
                    CONNECT DRIVE
                  </button>
                </section>
              </div>
            );
          }

          function Settings({ session }) {
            const [settings, setSettings] = useState(() =>
              read("ou_builder_settings", defaultSettings)
            );

            const [apiKey, setApiKey] = useState(
              () => localStorage.getItem("ou_openrouter_key") || ""
            );

            const [codes, setCodes] = useState(() =>
              read("ou_access_codes", [])
            );

            const [requests, setRequests] = useState(() =>
              read("ou_access_requests", [])
            );

            const [customAdmins, setCustomAdmins] = useState(() =>
              read("ou_custom_super_admins", [])
            );

            const [customCode, setCustomCode] = useState("");

            useEffect(() => {
              write("ou_builder_settings", settings);
            }, [settings]);

            function saveKey() {
              localStorage.setItem("ou_openrouter_key", apiKey.trim());
              alert("AI API key saved in this browser.");
            }

            function generateCode(role, creatorRole) {
              const current = read("ou_access_codes", []);
              const currentSettings = read(
                "ou_builder_settings",
                defaultSettings
              );

              if (role === "Admin") {
                const count = current.filter(
                  item => item.role === "Admin"
                ).length;

                if (count >= Number(currentSettings.maxAdmin)) {
                  alert("Maximum Admin codes reached.");
                  return;
                }
              }

              if (role === "Member") {
                const count = current.filter(
                  item => item.role === "Member"
                ).length;

                if (count >= Number(currentSettings.maxMember)) {
                  alert("Maximum Member codes reached.");
                  return;
                }
              }

              if (role === "Guest") {
                const count = current.filter(
                  item => item.role === "Guest"
                ).length;

                if (count >= Number(currentSettings.maxGuest)) {
                  alert("Maximum Guest codes reached.");
                  return;
                }

                if (creatorRole === "Admin") {
                  const made = current.filter(
                    item =>
                      item.role === "Guest" &&
                      item.createdBy === "Admin"
                  ).length;

                  if (made >= Number(currentSettings.guestPerAdmin)) {
                    alert("This Admin reached the Guest-code limit.");
                    return;
                  }
                }

                if (creatorRole === "Member") {
                  const made = current.filter(
                    item =>
                      item.role === "Guest" &&
                      item.createdBy === "Member"
                  ).length;

                  if (made >= Number(currentSettings.guestPerMember)) {
                    alert("This Member reached the Guest-code limit.");
                    return;
                  }
                }
              }

              const prefix =
                role === "Admin"
                  ? "ADM"
                  : role === "Member"
                  ? "MEM"
                  : "GST";

              const newCode = {
                id: makeId(),
                code: makeCode(prefix),
                role,
                createdBy: creatorRole,
                active: true,
                createdAt: new Date().toISOString()
              };

              const next = [...current, newCode];

              write("ou_access_codes", next);
              setCodes(next);

              alert("New " + role + " code: " + newCode.code);
            }

            function createCustomSuperAdmin() {
              const newCode = makeCode("SA");

              const next = [
                ...customAdmins,
                {
                  id: makeId(),
                  code: newCode,
                  createdAt: new Date().toISOString()
                }
              ];

              write("ou_custom_super_admins", next);
              setCustomAdmins(next);
              setCustomCode(newCode);
            }

            function approveRequest(id, role) {
              if (session.role !== "Super Admin") return;

              const codeList = read("ou_access_codes", []);
              const currentSettings = read(
                "ou_builder_settings",
                defaultSettings
              );

              if (role === "Admin") {
                if (
                  codeList.filter(item => item.role === "Admin").length >=
                  Number(currentSettings.maxAdmin)
                ) {
                  alert("Maximum Admin codes reached.");
                  return;
                }
              }

              if (role === "Member") {
                if (
                  codeList.filter(item => item.role === "Member").length >=
                  Number(currentSettings.maxMember)
                ) {
                  alert("Maximum Member codes reached.");
                  return;
                }
              }

              if (role === "Guest") {
                if (
                  codeList.filter(item => item.role === "Guest").length >=
                  Number(currentSettings.maxGuest)
                ) {
                  alert("Maximum Guest codes reached.");
                  return;
                }
              }

              const prefix =
                role === "Admin"
                  ? "ADM"
                  : role === "Member"
                  ? "MEM"
                  : "GST";

              const newCode = {
                id: makeId(),
                code: makeCode(prefix),
                role,
                createdBy: "Super Admin",
                active: true,
                createdAt: new Date().toISOString()
              };

              write("ou_access_codes", [...codeList, newCode]);
              setCodes([...codeList, newCode]);

              const nextRequests = requests.map(item =>
                item.id === id
                  ? {
                      ...item,
                      status: "approved",
                      role,
                      code: newCode.code
                    }
                  : item
              );

              write("ou_access_requests", nextRequests);
              setRequests(nextRequests);
            }

            function denyRequest(id) {
              const next = requests.map(item =>
                item.id === id
                  ? { ...item, status: "denied" }
                  : item
              );

              write("ou_access_requests", next);
              setRequests(next);
            }

            function updateNumber(key, value) {
              setSettings(old => ({
                ...old,
                [key]: Number(value)
              }));
            }

            return (
              <div>
                <PageHeader
                  title="Settings"
                  subtitle="Builder configuration and access management."
                />

                <section className="panel">
                  <div className="panel-title">
                    <h2>AI Agent Settings</h2>
                  </div>

                  <label>OpenRouter API Key</label>

                  <input
                    type="password"
                    value={apiKey}
                    onChange={e => setApiKey(e.target.value)}
                    placeholder="Enter your OpenRouter API key"
                  />

                  <p className="muted small">
                    The key is stored only in this browser for this foundation
                    prototype. Production will move API handling to the
                    backend.
                  </p>

                  <button className="primary-button" onClick={saveKey}>
                    SAVE API KEY
                  </button>
                </section>

                <section className="panel">
                  <div className="panel-title">
                    <h2>Access Limits</h2>
                  </div>

                  <div className="settings-grid">
                    <NumberSetting
                      label="Maximum Admin codes"
                      value={settings.maxAdmin}
                      onChange={value => updateNumber("maxAdmin", value)}
                      disabled={session.role !== "Super Admin"}
                    />

                    <NumberSetting
                      label="Maximum Member codes"
                      value={settings.maxMember}
                      onChange={value => updateNumber("maxMember", value)}
                      disabled={session.role !== "Super Admin"}
                    />

                    <NumberSetting
                      label="Maximum Guest codes"
                      value={settings.maxGuest}
                      onChange={value => updateNumber("maxGuest", value)}
                      disabled={session.role !== "Super Admin"}
                    />

                    <NumberSetting
                      label="Guest codes per Admin"
                      value={settings.guestPerAdmin}
                      onChange={value =>
                        updateNumber("guestPerAdmin", value)
                      }
                      disabled={session.role !== "Super Admin"}
                    />

                    <NumberSetting
                      label="Guest codes per Member"
                      value={settings.guestPerMember}
                      onChange={value =>
                        updateNumber("guestPerMember", value)
                      }
                      disabled={session.role !== "Super Admin"}
                    />

                    <NumberSetting
                      label="Guest successful builds"
                      value={settings.guestBuilds}
                      onChange={value => updateNumber("guestBuilds", value)}
                      disabled={session.role !== "Super Admin"}
                    />
                  </div>
                </section>

                {session.role !== "Guest" && (
                  <section className="panel">
                    <div className="panel-title">
                      <h2>Guest Access</h2>
                    </div>

                    <p className="muted">
                      {session.role === "Super Admin"
                        ? "Super Admin can generate Guest access codes."
                        : "Admin and Member can generate Guest access codes within their limits."}
                    </p>

                    <button
                      className="primary-button"
                      onClick={() =>
                        generateCode("Guest", session.role)
                      }
                    >
                      GENERATE GUEST CODE
                    </button>
                  </section>
                )}

                {session.role === "Super Admin" && (
                  <>
                    <section className="panel">
                      <div className="panel-title">
                        <h2>Super Admin Access</h2>
                      </div>

                      <div className="notice">
                        Permanent default Super Admin code:
                        <strong> Admins123</strong>
                        <br />
                        This default remains active even when custom Super
                        Admin codes are created.
                      </div>

                      <button
                        className="primary-button"
                        onClick={createCustomSuperAdmin}
                      >
                        CREATE CUSTOM SUPER ADMIN CODE
                      </button>

                      {customCode && (
                        <div className="generated-code">
                          New Super Admin code: <strong>{customCode}</strong>
                        </div>
                      )}

                      {customAdmins.length > 0 && (
                        <div className="code-list">
                          {customAdmins.map(item => (
                            <div className="code-row" key={item.id}>
                              <span>Super Admin</span>
                              <strong>{item.code}</strong>
                            </div>
                          ))}
                        </div>
                      )}
                    </section>

                    <section className="panel">
                      <div className="panel-title">
                        <h2>Generate Access Codes</h2>
                      </div>

                      <div className="quick-actions">
                        <button
                          onClick={() =>
                            generateCode("Admin", "Super Admin")
                          }
                        >
                          Generate Admin Code
                        </button>

                        <button
                          onClick={() =>
                            generateCode("Member", "Super Admin")
                          }
                        >
                          Generate Member Code
                        </button>

                        <button
                          onClick={() =>
                            generateCode("Guest", "Super Admin")
                          }
                        >
                          Generate Guest Code
                        </button>
                      </div>
                    </section>

                    <section className="panel">
                      <div className="panel-title">
                        <h2>Access Requests</h2>
                        <span>{requests.length}</span>
                      </div>

                      {requests.length === 0 ? (
                        <Empty text="No access requests." />
                      ) : (
                        <div className="request-list">
                          {requests.map(request => (
                            <div className="request-row" key={request.id}>
                              <div>
                                <strong>{request.name}</strong>
                                <small>{request.status}</small>
                              </div>

                              {request.status === "pending" ? (
                                <div className="request-actions">
                                  <button
                                    onClick={() =>
                                      approveRequest(
                                        request.id,
                                        "Admin"
                                      )
                                    }
                                  >
                                    Admin
                                  </button>

                                  <button
                                    onClick={() =>
                                      approveRequest(
                                        request.id,
                                        "Member"
                                      )
                                    }
                                  >
                                    Member
                                  </button>

                                  <button
                                    onClick={() =>
                                      approveRequest(
                                        request.id,
                                        "Guest"
                                      )
                                    }
                                  >
                                    Guest
                                  </button>

                                  <button
                                    className="danger-button"
                                    onClick={() =>
                                      denyRequest(request.id)
                                    }
                                  >
                                    Deny
                                  </button>
                                </div>
                              ) : (
                                <strong className="request-code">
                                  {request.code || request.status}
                                </strong>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </section>

                    <section className="panel">
                      <div className="panel-title">
                        <h2>All Generated Codes</h2>
                      </div>

                      {codes.length === 0 ? (
                        <Empty text="No generated codes yet." />
                      ) : (
                        <div className="code-list">
                          {codes.map(item => (
                            <div className="code-row" key={item.id}>
                              <span>{item.role}</span>
                              <strong>{item.code}</strong>
                              <small>Created by {item.createdBy}</small>
                            </div>
                          ))}
                        </div>
                      )}
                    </section>
                  </>
                )}
              </div>
            );
          }

          function NumberSetting({ label, value, onChange, disabled }) {
            return (
              <div>
                <label>{label}</label>
                <input
                  type="number"
                  min="1"
                  value={value}
                  disabled={disabled}
                  onChange={e => onChange(e.target.value)}
                />
              </div>
            );
          }

          function PageHeader({ title, subtitle }) {
            return (
              <div className="page-header">
                <div className="eyebrow">OU THE BUILDER</div>
                <h1>{title}</h1>
                <p>{subtitle}</p>
              </div>
            );
          }

          function Empty({ text }) {
            return <div className="empty">{text}</div>;
          }

          function App({ session, onLogout }) {
            const [page, setPage] = useState("home");
            const [mobileOpen, setMobileOpen] = useState(false);

            function navigate(next) {
              setPage(next);
              setMobileOpen(false);
            }

            function pageContent() {
              switch (page) {
                case "projects":
                  return <Projects session={session} />;
                case "files":
                  return <Files />;
                case "build":
                  return <Build session={session} />;
                case "chat":
                  return <Chat />;
                case "flow":
                  return <Flow />;
                case "drive":
                  return <Drive />;
                case "settings":
                  return <Settings session={session} />;
                default:
                  return <Home session={session} go={navigate} />;
              }
            }

            return (
              <div className="app-shell">
                <aside className={"sidebar " + (mobileOpen ? "open" : "")}>
                  <button
                    className="brand"
                    onClick={() => navigate("home")}
                  >
                    <div className="logo-mark small-logo">OU</div>
                    <div>
                      <strong>OU The Builder</strong>
                      <small>Web Application</small>
                    </div>
                  </button>

                  <nav>
                    {NAV.map(item => (
                      <button
                        key={item[0]}
                        className={
                          page === item[0] ? "nav-item active" : "nav-item"
                        }
                        onClick={() => navigate(item[0])}
                      >
                        <span>{item[2]}</span>
                        {item[1]}
                      </button>
                    ))}
                  </nav>

                  <div className="sidebar-bottom">
                    <div className="mini-user">
                      <span>●</span>
                      <div>
                        <strong>{session.role}</strong>
                        <small>Active session</small>
                      </div>
                    </div>

                    <button className="logout" onClick={onLogout}>
                      Log Out
                    </button>
                  </div>
                </aside>

                {mobileOpen && (
                  <button
                    className="mobile-overlay"
                    onClick={() => setMobileOpen(false)}
                    aria-label="Close menu"
                  />
                )}

                <main className="main">
                  <header className="topbar">
                    <button
                      className="menu-button"
                      onClick={() => setMobileOpen(true)}
                    >
                      ☰
                    </button>

                    <button
                      className="top-brand"
                      onClick={() => navigate("home")}
                    >
                      OU The Builder
                    </button>

                    <div className="top-status">
                      <span>●</span> Online
                    </div>
                  </header>

                  <div className="content">{pageContent()}</div>

                  <footer>
                    OU The Builder WBA · v0.4.1 · Foundation Stage
                  </footer>
                </main>
              </div>
            );
          }

          function Root() {
            const [session, setSession] = useState(() =>
              read("ou_access_session", null)
            );

            function login(data) {
              write("ou_access_session", data);
              setSession(data);
            }

            function logout() {
              localStorage.removeItem("ou_access_session");
              setSession(null);
            }

            if (!session) {
              return <AccessScreen onLogin={login} />;
            }

            return <App session={session} onLogout={logout} />;
          }

          createRoot(document.getElementById("root")).render(
            <React.StrictMode>
              <Root />
            </React.StrictMode>
          );
