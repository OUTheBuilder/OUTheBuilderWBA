              padding: 16px;
              align-items: flex-start;
              flex-direction: column;
            }

            .content {
              padding: 18px 14px;
            }

            .hero {
              padding: 25px;
              min-height: 260px;
            }

            .heroOrb {
              display: none;
            }

            .grid,
            .sectionGrid,
            .importGrid,
            .buildSteps {
              grid-template-columns: 1fr;
            }

            .pageIntro {
              align-items: flex-start;
              flex-direction: column;
            }

            .chatPage {
              height: calc(100vh - 170px);
            }

            .agentButton {
              min-width: 105px;
            }

            .composer {
              flex-wrap: wrap;
            }

            .composer input {
              order: 5;
              flex-basis: 100%;
            }

            .sendButton {
              order: 4;
            }

            .settingsActions,
            .keyBox {
              flex-direction: column;
            }
          }
          EOF

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build WBA
        working-directory: client
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -e

          test -f client/dist/index.html

          echo "WBA build verified."
          echo "Output:"
          find client/dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
