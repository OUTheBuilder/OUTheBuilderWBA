name: OU The Builder WBA - AI Chat Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create OU The Builder WBA
        shell: bash
        run: |
          rm -rf client
          mkdir -p client/src

          cat > client/package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "version": "0.4.2",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^5.0.2",
              "vite": "^7.1.7"
            }
          }
          EOF

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#070b18" />
              <title>OU The Builder</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > client/vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            base: "/OUTheBuilderWBA/",
            plugins: [react()]
          });
          EOF

          cat > client/src/main.jsx <<'EOF'
          import React, { useEffect, useState } from "react";
          import { createRoot } from "react-dom/client";
          import "./style.css";

          const AGENTS = [
            {
              id: "ou-builder",
              name: "OU Builder AI",
              description: "Builder and project assistant",
              model: "openrouter/free"
            },
            {
              id: "coding",
              name: "Coding Agent",
              description: "Code and debugging assistant",
              model: "openrouter/free"
            },
            {
              id: "general",
              name: "General AI",
              description: "General purpose assistant",
              model: "openrouter/free"
            },
            {
              id: "research",
              name: "Research Agent",
              description: "Research and information assistant",
              model: "openrouter/free"
            },
            {
              id: "auto",
              name: "Free Auto Agent",
              description: "Automatically routed free agent",
              model: "openrouter/free"
            }
          ];

          const NAV = [
            ["home", "⌂", "Home"],
            ["storage", "▣", "Project & Storage"],
            ["build", "⚙", "Build"],
            ["chat", "◉", "AI Chat"],
            ["flow", "◇", "Image Flow"],
            ["settings", "☷", "Settings"]
          ];

          function App() {
            const [screen, setScreen] = useState("home");
            const [mobileOpen, setMobileOpen] = useState(false);
            const [project, setProject] = useState(
              localStorage.getItem("ou_current_project") || "No project selected"
            );

            function navigate(id) {
              setScreen(id);
              setMobileOpen(false);
            }

            return (
              <div className="app">
                <header className="topbar">
                  <button className="brandButton" onClick={() => navigate("home")}>
                    <span className="logo">OU</span>
                    <span>
                      <strong>OU The Builder</strong>
                      <small>Web-Based Application</small>
                    </span>
                  </button>

                  <div className="topStatus">
                    <span className="onlineDot"></span>
                    ONLINE
                  </div>

                  <button
                    className="mobileMenu"
                    onClick={() => setMobileOpen(!mobileOpen)}
                  >
                    ☰
                  </button>
                </header>

                <aside className={`sidebar ${mobileOpen ? "open" : ""}`}>
                  <div className="navTitle">BUILDER</div>

                  {NAV.map(([id, icon, label]) => (
                    <button
                      key={id}
                      className={`navButton ${screen === id ? "active" : ""}`}
                      onClick={() => navigate(id)}
                    >
                      <span>{icon}</span>
                      <span>{label}</span>
                    </button>
                  ))}

                  <div className="sideFooter">
                    <div>Foundation Stage</div>
                    <small>v0.4.2</small>
                  </div>
                </aside>

                <main className="main">
                  {screen === "home" && (
                    <Home
                      project={project}
                      navigate={navigate}
                    />
                  )}

                  {screen === "storage" && (
                    <Storage
                      project={project}
                      setProject={setProject}
                    />
                  )}

                  {screen === "build" && (
                    <Build project={project} />
                  )}

                  {screen === "chat" && (
                    <Chat />
                  )}

                  {screen === "flow" && (
                    <Flow project={project} />
                  )}

                  {screen === "settings" && (
                    <Settings />
                  )}
                </main>
              </div>
            );
          }

          function PageTitle({ eyebrow, title, text }) {
            return (
              <div className="pageTitle">
                <div className="eyebrow">{eyebrow}</div>
                <h1>{title}</h1>
                <p>{text}</p>
              </div>
            );
          }

          function Home({ project, navigate }) {
            return (
              <div className="page">
                <PageTitle
                  eyebrow="COMMAND CENTER"
                  title="Welcome to OU The Builder"
                  text="Your WBA landing page and system monitoring center."
                />

                <div className="hero">
                  <div>
                    <span className="badge">● SYSTEM ONLINE</span>
                    <h2>Build. Manage. Create.</h2>
                    <p>
                      Control your projects, AI agents, files and build
                      environment from one place.
                    </p>
                  </div>

                  <button
                    className="primaryButton"
                    onClick={() => navigate("chat")}
                  >
                    Open AI Chat
                  </button>
                </div>

                <div className="monitorGrid">
                  <MonitorCard
                    title="AI Agent"
                    value="OU Builder AI"
                    detail="Provider: OpenRouter • Route: openrouter/free"
                    action="AI Chat"
                    onClick={() => navigate("chat")}
                  />

                  <MonitorCard
                    title="Current Project"
                    value={project}
                    detail="Project workspace"
                    action="Project & Storage"
                    onClick={() => navigate("storage")}
                  />

                  <MonitorCard
                    title="Build System"
                    value="Ready"
                    detail="Remote build integration prepared"
                    action="Build"
                    onClick={() => navigate("build")}
                  />

                  <MonitorCard
                    title="Google Drive"
                    value="Not Connected"
                    detail="Connection can be configured in Settings"
                    action="Settings"
                    onClick={() => navigate("settings")}
                  />
                </div>

                <div className="twoColumns">
                  <section className="panel">
                    <div className="panelHeader">
                      <h3>System Information</h3>
                      <span className="statusPill">ACTIVE</span>
                    </div>

                    <InfoRow label="WBA" value="Running" />
                    <InfoRow label="AI Service" value="Ready" />
                    <InfoRow label="Project Storage" value="Ready" />
                    <InfoRow label="Build Service" value="Ready" />
                    <InfoRow label="GitHub Pages" value="Connected" />
                  </section>

                  <section className="panel">
                    <div className="panelHeader">
                      <h3>Quick Actions</h3>
                    </div>

                    <div className="quickGrid">
                      <button onClick={() => navigate("storage")}>
                        + New Project
                      </button>
                      <button onClick={() => navigate("chat")}>
                        AI Chat
                      </button>
                      <button onClick={() => navigate("build")}>
                        Build Project
                      </button>
                      <button onClick={() => navigate("flow")}>
                        Image Flow
                      </button>
                    </div>
                  </section>
                </div>
              </div>
            );
          }

          function MonitorCard({ title, value, detail, action, onClick }) {
            return (
              <section className="monitorCard">
                <div className="cardIcon">◆</div>
                <span className="cardLabel">{title}</span>
                <h3>{value}</h3>
                <p>{detail}</p>
                <button onClick={onClick}>{action} →</button>
              </section>
            );
          }

          function InfoRow({ label, value }) {
            return (
              <div className="infoRow">
                <span>{label}</span>
                <strong>{value}</strong>
              </div>
            );
          }

          function Storage({ project, setProject }) {
            const [tab, setTab] = useState("projects");
            const [files, setFiles] = useState([]);

            function createProject() {
              const name = prompt("Project name:");
              if (!name) return;

              localStorage.setItem("ou_current_project", name);
              setProject(name);
            }

            return (
              <div className="page">
                <PageTitle
                  eyebrow="PROJECT & STORAGE"
                  title="Project & Storage"
                  text="Projects, files and Google Drive are managed from one section."
                />

                <div className="tabs">
                  <button
                    className={tab === "projects" ? "selected" : ""}
                    onClick={() => setTab("projects")}
                  >
                    Projects
                  </button>

                  <button
                    className={tab === "files" ? "selected" : ""}
                    onClick={() => setTab("files")}
                  >
                    Files
                  </button>

                  <button
                    className={tab === "drive" ? "selected" : ""}
                    onClick={() => setTab("drive")}
                  >
                    Google Drive
                  </button>
                </div>

                {tab === "projects" && (
                  <section className="panel">
                    <div className="panelHeader">
                      <h3>Projects</h3>
                      <button className="smallPrimary" onClick={createProject}>
                        + New Project
                      </button>
                    </div>

                    <div className="projectBox">
                      <div className="projectIcon">P</div>
                      <div>
                        <strong>{project}</strong>
                        <p>Current project</p>
                      </div>
                    </div>
                  </section>
                )}

                {tab === "files" && (
                  <section className="panel">
                    <div className="panelHeader">
                      <h3>Project Files</h3>

                      <label className="smallPrimary fileButton">
                        + Add Files
                        <input
                          type="file"
                          multiple
                          onChange={(e) =>
                            setFiles(Array.from(e.target.files || []))
                          }
                        />
                      </label>
                    </div>

                    {files.length === 0 ? (
                      <div className="emptyState">
                        No files selected yet.
                      </div>
                    ) : (
                      <div className="fileList">
                        {files.map((file) => (
                          <div className="fileItem" key={file.name}>
                            <span>📄</span>
                            <span>{file.name}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </section>
                )}

                {tab === "drive" && (
                  <section className="panel">
                    <div className="drivePanel">
                      <div className="driveIcon">G</div>
                      <h3>Google Drive</h3>
                      <p>
                        Google Drive connection will be handled through the
                        Connections system.
                      </p>
                      <span className="statusPill">NOT CONNECTED</span>
                    </div>
                  </section>
                )}
              </div>
            );
          }

          function Build({ project }) {
            const [target, setTarget] = useState("Android APK");
            const [building, setBuilding] = useState(false);
            const [logs, setLogs] = useState([]);

            function runBuild() {
              if (building) return;

              setBuilding(true);
              setLogs([]);

              const steps = [
                "Project check started",
                "Checking compatibility",
                "Checking project resources",
                "Preparing build environment",
                "Starting remote build request",
                "Compiling project",
                "Packaging output",
                "Verifying build",
                "BUILD FOUNDATION COMPLETE"
              ];

              steps.forEach((step, index) => {
                setTimeout(() => {
                  setLogs((current) => [...current, step]);

                  if (index === steps.length - 1) {
                    setBuilding(false);
                  }
                }, index * 500);
              });
            }

            return (
              <div className="page">
                <PageTitle
                  eyebrow="BUILD"
                  title="Build Project"
                  text="Prepare and run the project's remote build process."
                />

                <section className="panel">
                  <div className="formGrid">
                    <label>
                      Target
                      <select
                        value={target}
                        onChange={(e) => setTarget(e.target.value)}
                      >
                        <option>Android APK</option>
                        <option>Web App</option>
                        <option>Hybrid App</option>
                      </select>
                    </label>

                    <label>
                      Project
                      <input value={project} readOnly />
                    </label>
                  </div>

                  <button
                    className="primaryButton buildButton"
                    onClick={runBuild}
                    disabled={building}
                  >
                    {building ? "BUILDING..." : "RUN BUILD"}
                  </button>
                </section>

                <section className="panel console">
                  <div className="panelHeader">
                    <h3>Build Console</h3>
                    <span>{building ? "RUNNING" : "READY"}</span>
                  </div>

                  {logs.length === 0 ? (
                    <div className="consoleEmpty">
                      Build console is ready.
                    </div>
                  ) : (
                    logs.map((log, index) => (
                      <div
                        className={
                          log.includes("COMPLETE")
                            ? "consoleLine success"
                            : "consoleLine"
                        }
                        key={`${log}-${index}`}
                      >
                        {log.includes("COMPLETE") ? "✓" : "→"} {log}
                      </div>
                    ))
                  )}
                </section>
              </div>
            );
          }

          function Chat() {
            const [agentId, setAgentId] = useState(
              localStorage.getItem("ou_selected_agent") || "ou-builder"
            );

            const [messages, setMessages] = useState(() => {
              try {
                return JSON.parse(
                  localStorage.getItem(
                    `ou_chat_${agentId}`
                  ) || "[]"
                );
              } catch {
                return [];
              }
            });

            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [showAgents, setShowAgents] = useState(false);

            const agent =
              AGENTS.find((item) => item.id === agentId) || AGENTS[0];

            useEffect(() => {
              localStorage.setItem(
                `ou_chat_${agentId}`,
                JSON.stringify(messages)
              );
            }, [messages, agentId]);

            function changeAgent(id) {
              setAgentId(id);
              localStorage.setItem("ou_selected_agent", id);

              try {
                setMessages(
                  JSON.parse(
                    localStorage.getItem(`ou_chat_${id}`) || "[]"
                  )
                );
              } catch {
                setMessages([]);
              }

              setShowAgents(false);
            }

            function newChat() {
              setMessages([]);
              localStorage.removeItem(`ou_chat_${agentId}`);
            }

            async function sendMessage() {
              const text = input.trim();
              if (!text || loading) return;

              const userMessage = {
                role: "user",
                content: text
              };

              const nextMessages = [...messages, userMessage];
              setMessages(nextMessages);
              setInput("");
              setLoading(true);

              const apiKey =
                localStorage.getItem("ou_openrouter_key") || "";

              if (!apiKey) {
                setTimeout(() => {
                  setMessages((current) => [
                    ...current,
                    {
                      role: "assistant",
                      content:
                        "I am ready. Add your OpenRouter API key in Settings to enable the real AI connection."
                    }
                  ]);
                  setLoading(false);
                }, 500);

                return;
              }

              try {
                const response = await fetch(
                  "https://openrouter.ai/api/v1/chat/completions",
                  {
                    method: "POST",
                    headers: {
                      "Authorization": `Bearer ${apiKey}`,
                      "Content-Type": "application/json",
                      "HTTP-Referer": window.location.origin,
                      "X-Title": "OU The Builder"
                    },
                    body: JSON.stringify({
                      model: agent.model,
                      messages: [
                        {
                          role: "system",
                          content:
                            `You are ${agent.name}, the AI assistant inside OU The Builder. ${agent.description}. Help the user with projects, files, building, coding and the WBA.`
                        },
                        ...nextMessages.slice(-20)
                      ]
                    })
                  }
                );

                const data = await response.json();

                if (!response.ok) {
                  throw new Error(
                    data?.error?.message ||
                    `Request failed with status ${response.status}`
                  );
                }

                const answer =
                  data?.choices?.[0]?.message?.content ||
                  "The AI returned no message.";

                setMessages((current) => [
                  ...current,
                  {
                    role: "assistant",
                    content: answer
                  }
                ]);
              } catch (error) {
                setMessages((current) => [
                  ...current,
                  {
                    role: "assistant",
                    content:
                      `AI connection error: ${error.message}`
                  }
                ]);
              } finally {
                setLoading(false);
              }
            }

            function handleKeyDown(event) {
              if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
              }
            }

            async function copyConversation() {
              const text = messages
                .map(
                  (message) =>
                    `${message.role === "user" ? "You" : agent.name}: ${message.content}`
                )
                .join("\n\n");

              if (!text) return;

              try {
                await navigator.clipboard.writeText(text);
              } catch {
                const area = document.createElement("textarea");
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
              }
            }

            return (
              <div className="chatPage">
                <div className="chatHeader">
                  <div>
                    <div className="eyebrow">AI ASSISTANT</div>
                    <h1>AI Chat</h1>
                  </div>

                  <div className="chatHeaderActions">
                    <button onClick={newChat}>+ New Chat</button>

                    <button
                      className="agentSelector"
                      onClick={() => setShowAgents(!showAgents)}
                    >
                      {agent.name} ▼
                    </button>

                    {showAgents && (
                      <div className="agentMenu">
                        {AGENTS.map((item) => (
                          <button
                            key={item.id}
                            onClick={() => changeAgent(item.id)}
                          >
                            <strong>{item.name}</strong>
                            <small>{item.description}</small>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="sourceBar">
                  <span>Sources</span>
                  <strong>No Sources</strong>
                </div>

                <div className="messages">
                  {messages.length === 0 && (
                    <div className="chatWelcome">
                      <div className="chatLogo">OU</div>
                      <h2>{agent.name}</h2>
                      <p>
                        Ask me about your project, files, build process,
                        coding or OU The Builder.
                      </p>
                    </div>
                  )}

                  {messages.map((message, index) => (
                    <div
                      className={`messageRow ${
                        message.role === "user" ? "userRow" : ""
                      }`}
                      key={index}
                    >
                      <div
                        className={`messageBubble ${
                          message.role === "user"
                            ? "userBubble"
                            : "assistantBubble"
                        }`}
                      >
                        <span className="messageRole">
                          {message.role === "user"
                            ? "You"
                            : agent.name}
                        </span>
                        <div>{message.content}</div>
                      </div>
                    </div>
                  ))}

                  {loading && (
                    <div className="messageRow">
                      <div className="messageBubble assistantBubble">
                        <span className="messageRole">{agent.name}</span>
                        <div className="typing">Thinking...</div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="chatComposer">
                  <div className="composerBox">
                    <button
                      className="plusButton"
                      title="Attachments"
                    >
                      +
                    </button>

                    <textarea
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={`Message ${agent.name}...`}
                      rows="2"
                    />

                    <button
                      className="sendButton"
                      onClick={sendMessage}
                      disabled={loading || !input.trim()}
                    >
                      ↑
                    </button>
                  </div>

                  <div className="composerBottom">
                    <button
                      className="bottomAction"
                      onClick={copyConversation}
                    >
                      Copy
                    </button>

                    <span>
                      Enter to send • Shift + Enter for new line
                    </span>
                  </div>
                </div>
              </div>
            );
          }

          function Flow({ project }) {
            return (
              <div className="page">
                <PageTitle
                  eyebrow="IMAGE FLOW"
                  title="Application Flow"
                  text="Visualize how the project's screens and actions connect."
                />

                <section className="flowCanvas">
                  <FlowNode title="Home" />
                  <div className="flowArrow">↓</div>
                  <FlowNode title={project || "Project"} />
                  <div className="flowArrow">↓</div>
                  <FlowNode title="Build" />
                  <div className="flowArrow">↓</div>
                  <FlowNode title="APK Output" />
                </section>
              </div>
            );
          }

          function FlowNode({ title }) {
            return (
              <div className="flowNode">
                <span>SCREEN</span>
                <strong>{title}</strong>
              </div>
            );
          }

          function Settings() {
            const [key, setKey] = useState(
              localStorage.getItem("ou_openrouter_key") || ""
            );

            const [saved, setSaved] = useState(false);

            function saveKey() {
              localStorage.setItem("ou_openrouter_key", key.trim());
              setSaved(true);

              setTimeout(() => setSaved(false), 1800);
            }

            return (
              <div className="page">
                <PageTitle
                  eyebrow="SETTINGS"
                  title="Settings"
                  text="Configure AI agents and future service connections."
                />

                <section className="panel">
                  <div className="panelHeader">
                    <h3>AI Agents</h3>
                    <button className="smallPrimary">+ Add Agent</button>
                  </div>

                  <div className="agentSettingsList">
                    {AGENTS.map((agent) => (
                      <div className="agentSetting" key={agent.id}>
                        <div>
                          <strong>{agent.name}</strong>
                          <p>{agent.description}</p>
                        </div>
                        <span>{agent.model}</span>
                      </div>
                    ))}
                  </div>
                </section>

                <section className="panel">
                  <div className="panelHeader">
                    <h3>AI Connection</h3>
                    <span className="statusPill">OpenRouter</span>
                  </div>

                  <label>
                    OpenRouter API Key
                    <input
                      type="password"
                      value={key}
                      onChange={(e) => setKey(e.target.value)}
                      placeholder="Enter your API key"
                    />
                  </label>

                  <p className="warningText">
                    Prototype only: the key is stored in this browser.
                    Production authentication and secret storage will be
                    moved to the backend.
                  </p>

                  <button
                    className="primaryButton"
                    onClick={saveKey}
                  >
                    {saved ? "SAVED" : "SAVE CONNECTION"}
                  </button>
                </section>

                <section className="panel">
                  <div className="panelHeader">
                    <h3>Other Connections</h3>
                  </div>

                  <div className="connectionGrid">
                    <Connection name="Google Drive" status="Not Connected" />
                    <Connection name="Git / GitHub" status="Available" />
                    <Connection name="Build Service" status="Ready" />
                  </div>
                </section>
              </div>
            );
          }

          function Connection({ name, status }) {
            return (
              <div className="connection">
                <div>
                  <strong>{name}</strong>
                  <small>{status}</small>
                </div>
                <button>Configure</button>
              </div>
            );
          }

          createRoot(document.getElementById("root")).render(
            <App />
          );
          EOF

          cat > client/src/style.css <<'EOF'
          :root {
            font-family:
              Inter,
              ui-sans-serif,
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;

            color: #f5f7ff;
            background: #060914;
            font-synthesis: none;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background:
              radial-gradient(circle at 20% 10%, rgba(44, 70, 160, .16), transparent 28%),
              radial-gradient(circle at 80% 30%, rgba(124, 62, 185, .12), transparent 28%),
              #060914;
          }

          button,
          input,
          textarea,
          select {
            font: inherit;
          }

          button {
            cursor: pointer;
          }

          .app {
            min-height: 100vh;
          }

          .topbar {
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(5, 9, 20, .94);
            border-bottom: 1px solid rgba(120, 145, 220, .14);
            backdrop-filter: blur(16px);
          }

          .brandButton {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0;
            background: transparent;
            color: white;
            text-align: left;
          }

          .brandButton strong {
            display: block;
            font-size: 15px;
          }

          .brandButton small {
            display: block;
            color: #7e8aa8;
            margin-top: 3px;
          }

          .logo,
          .chatLogo {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #14b8ff, #8058ff);
            box-shadow: 0 0 25px rgba(54, 116, 255, .35);
            font-weight: 900;
          }

          .topStatus {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: #8de8bb;
          }

          .onlineDot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38e68a;
            box-shadow: 0 0 10px #38e68a;
          }

          .mobileMenu {
            display: none;
            border: 1px solid #27304a;
            border-radius: 10px;
            background: #11182a;
            color: white;
            padding: 8px 11px;
          }

          .sidebar {
            position: fixed;
            left: 0;
            top: 70px;
            bottom: 0;
            width: 245px;
            padding: 24px 14px;
            background: rgba(7, 11, 24, .96);
            border-right: 1px solid rgba(120, 145, 220, .13);
            z-index: 40;
          }

          .navTitle {
            color: #596684;
            font-size: 10px;
            letter-spacing: 2px;
            margin: 0 12px 12px;
          }

          .navButton {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 13px;
            margin-bottom: 5px;
            border: 1px solid transparent;
            border-radius: 11px;
            background: transparent;
            color: #8995b1;
            text-align: left;
          }

          .navButton:hover,
          .navButton.active {
            background: linear-gradient(
              90deg,
              rgba(39, 103, 255, .18),
              rgba(121, 73, 255, .12)
            );
            border-color: rgba(80, 127, 255, .22);
            color: #fff;
          }

          .navButton.active {
            box-shadow: inset 3px 0 #42a5ff;
          }

          .sideFooter {
            position: absolute;
            left: 25px;
            bottom: 25px;
            color: #56627e;
            font-size: 12px;
          }

          .sideFooter small {
            color: #39445e;
          }

          .main {
            padding-top: 70px;
            padding-left: 245px;
            min-height: 100vh;
          }

          .page {
            width: min(1400px, 100%);
            margin: 0 auto;
            padding: 38px;
          }

          .pageTitle {
            margin-bottom: 25px;
          }

          .eyebrow {
            color: #5daaff;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 7px;
          }

          h1,
          h2,
          h3,
          p {
            margin-top: 0;
          }

          h1 {
            font-size: clamp(27px, 4vw, 40px);
            margin-bottom: 7px;
          }

          .pageTitle p {
            color: #78849f;
            margin-bottom: 0;
          }

          .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            padding: 30px;
            border: 1px solid rgba(76, 126, 255, .22);
            border-radius: 20px;
            background:
              radial-gradient(circle at 85% 20%, rgba(104, 75, 255, .18), transparent 30%),
              linear-gradient(135deg, rgba(20, 45, 100, .34), rgba(14, 18, 35, .72));
            margin-bottom: 20px;
          }

          .hero h2 {
            margin: 16px 0 8px;
            font-size: clamp(24px, 4vw, 36px);
          }

          .hero p {
            color: #8995ae;
            max-width: 650px;
          }

          .badge {
            display: inline-block;
            padding: 7px 10px;
            border-radius: 20px;
            background: rgba(43, 219, 139, .1);
            color: #69e7a5;
            font-size: 10px;
            letter-spacing: 1px;
          }

          .primaryButton,
          .smallPrimary {
            border: 0;
            border-radius: 10px;
            color: white;
            background: linear-gradient(135deg, #258eff, #7652ff);
            padding: 12px 17px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(52, 94, 255, .16);
          }

          .primaryButton:disabled {
            opacity: .5;
            cursor: wait;
          }

          .smallPrimary {
            padding: 8px 12px;
            font-size: 12px;
          }

          .monitorGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
          }

          .monitorCard,
          .panel {
            background: rgba(12, 17, 32, .78);
            border: 1px solid rgba(111, 132, 190, .14);
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .14);
          }

          .monitorCard {
            padding: 19px;
          }

          .cardIcon {
            color: #5ba9ff;
            margin-bottom: 13px;
          }

          .cardLabel {
            display: block;
            color: #687593;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
          }

          .monitorCard h3 {
            margin: 7px 0;
            font-size: 17px;
          }

          .monitorCard p {
            color: #687593;
            min-height: 38px;
            font-size: 12px;
          }

          .monitorCard button {
            background: transparent;
            border: 0;
            color: #65aaff;
            padding: 0;
            font-size: 12px;
          }

          .twoColumns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
          }

          .panel {
            padding: 22px;
            margin-bottom: 18px;
          }

          .panelHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
          }

          .panelHeader h3 {
            margin: 0;
          }

          .statusPill {
            display: inline-flex;
            padding: 5px 8px;
            border-radius: 20px;
            background: rgba(57, 205, 137, .09);
            color: #62dba0;
            font-size: 9px;
            letter-spacing: 1px;
          }

          .infoRow {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(100, 120, 170, .08);
            color: #7c88a3;
            font-size: 13px;
          }

          .infoRow strong {
            color: #b7c0d5;
          }

          .quickGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
          }

          .quickGrid button,
          .tabs button,
          .chatHeaderActions button,
          .connection button {
            border: 1px solid #26304a;
            background: #10172a;
            color: #aeb9d1;
            border-radius: 9px;
            padding: 11px;
          }

          .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
          }

          .tabs button.selected {
            background: #1b4f99;
            border-color: #2c79d5;
            color: white;
          }

          .projectBox {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(28, 38, 67, .5);
          }

          .projectIcon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #1c6de2;
          }

          .projectBox p {
            color: #687593;
            margin: 4px 0 0;
            font-size: 12px;
          }

          .fileButton {
            position: relative;
            overflow: hidden;
            display: inline-block;
          }

          .fileButton input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
          }

          .emptyState,
          .consoleEmpty {
            padding: 35px;
            text-align: center;
            color: #687593;
          }

          .fileList {
            display: grid;
            gap: 8px;
          }

          .fileItem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px;
            background: #0b1120;
            border-radius: 8px;
            color: #a8b2c8;
          }

          .drivePanel {
            text-align: center;
            padding: 30px;
          }

          .driveIcon {
            display: grid;
            place-items: center;
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 15px;
            background: #16294b;
            color: #70aaff;
            font-size: 25px;
            font-weight: 900;
          }

          .drivePanel p {
            color: #6e7a96;
          }

          .formGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
          }

          label {
            display: block;
            color: #8a96b0;
            font-size: 12px;
          }

          input,
          select {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #28334e;
            border-radius: 9px;
            outline: none;
            background: #090f1d;
            color: #e8edfa;
          }

          input:focus,
          select:focus,
          textarea:focus {
            border-color: #3e89ff;
          }

          .buildButton {
            margin-top: 4px;
          }

          .console {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          }

          .consoleLine {
            padding: 8px 0;
            color: #7e91b6;
            font-size: 12px;
          }

          .consoleLine.success {
            color: #5be19b;
            font-weight: 800;
          }

          .chatPage {
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 30px 18px;
          }

          .chatHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
          }

          .chatHeader h1 {
            font-size: 27px;
            margin: 0;
          }

          .chatHeaderActions {
            display: flex;
            gap: 8px;
            position: relative;
          }

          .agentSelector {
            min-width: 145px;
          }

          .agentMenu {
            position: absolute;
            right: 0;
            top: 48px;
            width: 250px;
            z-index: 30;
            padding: 7px;
            border: 1px solid #293552;
            border-radius: 12px;
            background: #0c1323;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
          }

          .agentMenu button {
            width: 100%;
            text-align: left;
            display: block;
            border: 0;
            background: transparent;
            color: #d9e1f3;
            padding: 10px;
          }

          .agentMenu button:hover {
            background: #151f35;
          }

          .agentMenu strong,
          .agentMenu small {
            display: block;
          }

          .agentMenu small {
            color: #697691;
            margin-top: 3px;
          }

          .sourceBar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 8px;
            padding: 9px 12px;
            border: 1px solid #1c2740;
            border-radius: 9px;
            background: rgba(9, 14, 27, .7);
            color: #64718d;
            font-size: 11px;
          }

          .sourceBar strong {
            color: #929db5;
          }

          .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5px;
          }

          .chatWelcome {
            text-align: center;
            margin: 9vh auto;
            max-width: 500px;
            color: #7a86a0;
          }

          .chatLogo {
            margin: 0 auto 18px;
          }

          .chatWelcome h2 {
            color: #e9edfa;
            margin-bottom: 7px;
          }

          .messageRow {
            display: flex;
            justify-content: flex-start;
            margin: 12px 0;
          }

          .messageRow.userRow {
            justify-content: flex-end;
          }

          .messageBubble {
            max-width: min(760px, 88%);
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            font-size: 14px;
          }

          .assistantBubble {
            background: #101829;
            border: 1px solid #1f2b45;
            color: #d1d8e8;
          }

          .userBubble {
            background: linear-gradient(135deg, #174f9b, #4c38a5);
            color: white;
          }

          .messageRole {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            color: #6e9eff;
            font-weight: 800;
            letter-spacing: .5px;
          }

          .userBubble .messageRole {
            color: #d6e4ff;
          }

          .typing {
            color: #71809e;
          }

          .chatComposer {
            flex-shrink: 0;
            padding-top: 8px;
          }

          .composerBox {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 9px;
            border: 1px solid #293552;
            border-radius: 14px;
            background: #0b1221;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .22);
          }

          .composerBox textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            border: 0;
            outline: 0;
            background: transparent;
            color: white;
            padding: 10px 4px;
          }

          .plusButton,
          .sendButton {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 1px solid #26324e;
            background: #121b30;
            color: #b6c2db;
          }

          .sendButton {
            background: linear-gradient(135deg, #267fff, #704eff);
            color: white;
            border: 0;
          }

          .sendButton:disabled {
            opacity: .35;
          }

          .composerBottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 3px 0;
            color: #4f5b75;
            font-size: 10px;
          }

          .bottomAction {
            border: 1px solid #27324c;
            background: #0d1424;
            color: #8996b1;
            padding: 6px 12px;
            border-radius: 7px;
          }

          .bottomAction:hover {
            color: white;
            border-color: #3d6db6;
          }

          .flowCanvas {
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 30px;
            border: 1px solid #1d2942;
            border-radius: 18px;
            background: #080e1c;
          }

          .flowNode {
            width: min(420px, 90%);
            padding: 20px;
            text-align: center;
            border: 1px solid #315b9d;
            border-radius: 14px;
            background: linear-gradient(135deg, #101d36, #14152b);
          }

          .flowNode span {
            display: block;
            color: #5f8fd2;
            font-size: 9px;
            letter-spacing: 2px;
            margin-bottom: 7px;
          }

          .flowArrow {
            color: #4e93ff;
          }

          .agentSettingsList {
            display: grid;
            gap: 8px;
          }

          .agentSetting,
          .connection {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 14px;
            border: 1px solid #1d2940;
            border-radius: 10px;
            background: #0b1120;
          }

          .agentSetting p {
            color: #66738f;
            margin: 4px 0 0;
            font-size: 12px;
          }

          .agentSetting > span,
          .connection small {
            color: #5c87bf;
            font-size: 11px;
          }

          .warningText {
            color: #837a5f;
            font-size: 11px;
            line-height: 1.5;
            margin: 10px 0 15px;
          }

          .connectionGrid {
            display: grid;
            gap: 9px;
          }

          .connection > div strong,
          .connection > div small {
            display: block;
          }

          .connection > div small {
            margin-top: 4px;
          }

          @media (max-width: 1000px) {
            .monitorGrid {
              grid-template-columns: 1fr 1fr;
            }

            .twoColumns {
              grid-template-columns: 1fr;
            }
          }

          @media (max-width: 720px) {
            .topbar {
              padding: 10px 13px;
            }

            .mobileMenu {
              display: block;
            }

            .sidebar {
              transform: translateX(-100%);
              transition: transform .2s ease;
              box-shadow: 20px 0 50px rgba(0,0,0,.35);
            }

            .sidebar.open {
              transform: translateX(0);
            }

            .main {
              padding-left: 0;
            }

            .page {
              padding: 25px 15px 35px;
            }

            .hero {
              flex-direction: column;
              align-items: flex-start;
              padding: 22px;
            }

            .monitorGrid {
              grid-template-columns: 1fr;
            }

            .formGrid {
              grid-template-columns: 1fr;
            }

            .chatPage {
              height: calc(100vh - 70px);
              padding: 18px 12px 12px;
            }

            .chatHeader {
              align-items: flex-start;
              gap: 12px;
            }

            .chatHeaderActions {
              flex-wrap: wrap;
              justify-content: flex-end;
            }

            .chatHeaderActions > button {
              font-size: 11px;
              padding: 8px;
            }

            .agentSelector {
              min-width: auto;
            }

            .messageBubble {
              max-width: 92%;
            }

            .composerBottom {
              gap: 8px;
            }

            .composerBottom span {
              text-align: right;
            }

            .quickGrid {
              grid-template-columns: 1fr;
            }
          }

          @media (max-width: 450px) {
            .brandButton small {
              display: none;
            }

            .topStatus {
              display: none;
            }

            .chatHeader h1 {
              font-size: 22px;
            }

            .chatHeaderActions {
              max-width: 180px;
            }

            .sourceBar {
              margin-top: 13px;
            }

            .composerBottom {
              align-items: flex-start;
            }
          }
          EOF

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build WBA
        working-directory: client
        run: npm run build

      - name: Verify build output
        run: test -f client/dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
