name: OU The Builder WBA - Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build OU The Builder WBA
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. SETUP NODE.JS 24
      # ============================================================
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # ============================================================
      # 3. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "OU THE BUILDER WBA"
          echo "BUILD ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Source directory:"
          ls -la src

      # ============================================================
      # 4. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Checking OU The Builder WBA files..."

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          if [ ! -f "vite.config.js" ]; then
            echo "ERROR: vite.config.js was not found."
            exit 1
          fi

          if [ ! -f "src/main.jsx" ]; then
            echo "ERROR: src/main.jsx was not found."
            exit 1
          fi

          if [ ! -f "src/App.jsx" ]; then
            echo "ERROR: src/App.jsx was not found."
            exit 1
          fi

          echo ""
          echo "All required project files were found."

          echo ""
          echo "Verified:"
          echo "  ✓ package.json"
          echo "  ✓ index.html"
          echo "  ✓ vite.config.js"
          echo "  ✓ src/main.jsx"
          echo "  ✓ src/App.jsx"

      # ============================================================
      # 5. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING NPM DEPENDENCIES"
          echo "=============================================="

          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found."
            echo "Running npm ci..."
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json found."
            echo "Running npm install..."
            npm install --no-audit --no-fund
          fi

          echo ""
          echo "Dependencies installed successfully."

      # ============================================================
      # 6. BUILD APPLICATION
      # ============================================================
      - name: Build application
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING OU THE BUILDER WBA"
          echo "=============================================="

          npm run build

          echo ""
          echo "Vite build completed successfully."

      # ============================================================
      # 7. VERIFY DIST
      # ============================================================
      - name: Verify production build
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING PRODUCTION BUILD"
          echo "=============================================="

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo ""
          echo "Production build verified."

          echo ""
          echo "Build output:"
          find dist -maxdepth 3 -type f | sort

          echo ""
          echo "Build size:"
          du -sh dist

      # ============================================================
      # 8. CONFIGURE GITHUB PAGES
      # ============================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 9. UPLOAD PAGES ARTIFACT
      # ============================================================
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # ================================================================
  # DEPLOY JOB
  # ================================================================
  deploy:
    name: Deploy OU The Builder WBA
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 10. DEPLOY TO GITHUB PAGES
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 11. SHOW DEPLOYMENT RESULT
      # ============================================================
      - name: Deployment complete
        shell: bash
        run: |
          echo "=============================================="
          echo "OU THE BUILDER WBA"
          echo "DEPLOYMENT COMPLETE"
          echo "=============================================="

          echo ""
          echo "GitHub Pages URL:"
          echo "${{ steps.deployment.outputs.page_url }}"

          echo ""
          echo "OU The Builder WBA has been successfully deployed."
