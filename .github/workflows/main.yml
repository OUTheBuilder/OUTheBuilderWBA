name: OU The Builder WBA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare application
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            echo "package.json not found."
            exit 1
          fi

          if [ ! -d src ]; then
            echo "src directory not found."
            exit 1
          fi

          echo "Existing OU The Builder source detected."

      - name: Add Use this Folder support
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          app = Path("src/App.jsx")

          if not app.exists():
              raise SystemExit("src/App.jsx was not found.")

          text = app.read_text()

          marker = "/* OU_THE_BUILDER_FOLDER_IMPORT */"

          if marker in text:
              print("Folder import support is already installed.")
              raise SystemExit(0)

          folder_code = r'''
          /* OU_THE_BUILDER_FOLDER_IMPORT */

          function OUBuilderFolderImport({ onFolderSelected }) {
            const inputRef = React.useRef(null);

            function openFolderPicker() {
              inputRef.current?.click();
            }

            function handleFolder(event) {
              const files = Array.from(event.target.files || []);

              if (!files.length) {
                return;
              }

              const folderName =
                files[0].webkitRelativePath?.split("/")[0] ||
                "Selected Folder";

              onFolderSelected({
                name: folderName,
                files,
                fileCount: files.length,
                totalSize: files.reduce(
                  (total, file) => total + file.size,
                  0
                )
              });

              event.target.value = "";
            }

            return (
              <>
                <input
                  ref={inputRef}
                  type="file"
                  multiple
                  webkitdirectory=""
                  directory=""
                  style={{ display: "none" }}
                  onChange={handleFolder}
                />

                <button
                  type="button"
                  onClick={openFolderPicker}
                >
                  📁 Use this Folder
                </button>
              </>
            );
          }
          '''

          text += "\n" + folder_code + "\n"

          app.write_text(text)

          print("Use this Folder support added.")
          PY

      - name: Add folder-import helper
        shell: bash
        run: |
          set -e

          mkdir -p src/components

          cat > src/components/UseThisFolder.jsx <<'EOF'
          import React from "react";

          export default function UseThisFolder({
            onFolderSelected,
            className = ""
          }) {
            const inputRef = React.useRef(null);

            const openFolder = () => {
              inputRef.current?.click();
            };

            const handleFolder = (event) => {
              const files = Array.from(
                event.target.files || []
              );

              if (!files.length) {
                return;
              }

              const firstPath =
                files[0].webkitRelativePath ||
                files[0].name;

              const folderName =
                firstPath.split("/")[0] ||
                "Selected Folder";

              const projectFiles = files.map((file) => ({
                file,
                name: file.name,
                path:
                  file.webkitRelativePath ||
                  file.name,
                size: file.size,
                type:
                  file.type ||
                  "application/octet-stream",
                lastModified: file.lastModified
              }));

              onFolderSelected?.({
                name: folderName,
                files: projectFiles,
                fileCount: projectFiles.length,
                totalSize: projectFiles.reduce(
                  (total, item) =>
                    total + item.size,
                  0
                )
              });

              event.target.value = "";
            };

            return (
              <>
                <input
                  ref={inputRef}
                  type="file"
                  multiple
                  webkitdirectory=""
                  directory=""
                  onChange={handleFolder}
                  style={{ display: "none" }}
                />

                <button
                  type="button"
                  className={className}
                  onClick={openFolder}
                >
                  📁 Use this Folder
                </button>
              </>
            );
          }
          EOF

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build WBA
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -e

          if [ ! -f dist/index.html ]; then
            echo "dist/index.html was not created."
            exit 1
          fi

          echo "Build completed successfully."
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
