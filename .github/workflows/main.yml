            grid-template-columns: repeat(2, 1fr);
          }

          .feature-card,
          .project-card,
          .panel {
            border: 1px solid #20365d;
            border-radius: 18px;
            background: linear-gradient(145deg, #0c172c, #081222);
          }

          .feature-card {
            min-height: 155px;
            padding: 22px;
            color: #edf4ff;
            text-align: left;
          }

          .feature-card:hover {
            border-color: #3b65a8;
            transform: translateY(-1px);
          }

          .feature-card > span {
            font-size: 27px;
            color: #6c9fff;
          }

          .feature-card h3 {
            margin: 15px 0 5px;
          }

          .feature-card p {
            margin: 0;
            color: #7182a1;
            font-size: 13px;
          }

          .panel {
            padding: 22px;
            margin-bottom: 18px;
          }

          .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
          }

          .panel-title h2 {
            margin: 0;
            font-size: 17px;
          }

          .status-list > div,
          .build-info > div,
          .code-row,
          .request-row,
          .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #182943;
          }

          .status-list > div:last-child,
          .build-info > div:last-child {
            border-bottom: 0;
          }

          .status-list span,
          .build-info span {
            color: #7486a5;
          }

          .status-list b {
            color: #75dca9;
            font-size: 12px;
          }

          .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
          }

          .quick-actions button,
          .request-actions button {
            padding: 10px 12px;
            border: 1px solid #29446f;
            border-radius: 10px;
            color: #b9cdf0;
            background: #0c1a31;
            font-weight: 700;
          }

          .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
          }

          .project-card {
            padding: 20px;
          }

          .project-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: rgba(54, 116, 255, .13);
            color: #76a7ff;
          }

          .project-card h3 {
            margin: 15px 0 5px;
          }

          .project-card p {
            color: #7182a1;
            font-size: 12px;
          }

          .upload-box {
            min-height: 190px;
            display: grid;
            place-items: center;
            align-content: center;
            gap: 7px;
            border: 1px dashed #385a90;
            border-radius: 16px;
            background: #091529;
            text-align: center;
            cursor: pointer;
          }

          .upload-box input {
            display: none;
          }

          .upload-icon {
            font-size: 32px;
            color: #6ca0ff;
          }

          .upload-box small {
            color: #6e7e9b;
          }

          .file-row {
            justify-content: flex-start;
          }

          .file-row > span {
            color: #659bff;
          }

          .file-row strong,
          .file-row small {
            display: block;
          }

          .file-row small {
            margin-top: 3px;
            color: #657692;
          }

          .build-info {
            margin: 18px 0;
          }

          .console {
            min-height: 300px;
            padding: 17px;
            overflow: auto;
            border: 1px solid #182d4d;
            border-radius: 12px;
            color: #94b9ff;
            background: #030913;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
            line-height: 1.8;
          }

          .console-arrow {
            color: #4cdb9d;
          }

          .console-muted {
            color: #4d607f;
          }

          .center-panel {
            min-height: 300px;
            display: grid;
            place-items: center;
            align-content: center;
            text-align: center;
          }

          .big-icon {
            font-size: 50px;
            color: #6c9fff;
          }

          .flow {
            display: grid;
            justify-items: center;
            padding: 15px;
          }

          .flow-node {
            width: min(330px, 100%);
            padding: 18px;
            border: 1px solid #31558d;
            border-radius: 15px;
            background: linear-gradient(145deg, #0d1e38, #081323);
            text-align: center;
          }

          .flow-node strong,
          .flow-node small {
            display: block;
          }

          .flow-node small {
            margin-top: 4px;
            color: #7184a4;
          }

          .flow-arrow {
            padding: 9px;
            color: #5d99ff;
            font-size: 22px;
          }

          .chat-shell {
            overflow: hidden;
            border: 1px solid #21385f;
            border-radius: 20px;
            background: #071120;
          }

          .chat-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            padding: 18px;
            border-bottom: 1px solid #1a2d4b;
          }

          .chat-top > div:first-child {
            width: min(360px, 100%);
          }

          .agent-description {
            color: #7184a4;
            font-size: 12px;
          }

          .messages {
            height: min(55vh, 570px);
            overflow-y: auto;
            padding: 22px;
          }

          .message-row {
            display: flex;
            margin-bottom: 14px;
          }

          .message-row.user {
            justify-content: flex-end;
          }

          .message {
            max-width: min(780px, 88%);
            padding: 13px 15px;
            border: 1px solid #203a64;
            border-radius: 15px;
            background: #0c1b31;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
          }

          .message-row.user .message {
            border-color: #345aa1;
            background: linear-gradient(145deg, #142b51, #112241);
          }

          .message small {
            display: block;
            margin-bottom: 5px;
            color: #668dcb;
            font-size: 10px;
            font-weight: 900;
          }

          .typing {
            color: #8296b8;
          }

          .composer {
            padding: 15px;
            border-top: 1px solid #1a2d4b;
            background: #081426;
          }

          .composer textarea {
            min-height: 80px;
          }

          .composer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 9px;
          }

          .send-button {
            min-width: 80px;
          }

          .composer-hint {
            margin-top: 8px;
            color: #566987;
            font-size: 10px;
            text-align: right;
          }

          .settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
          }

          .code-list,
          .request-list {
            display: grid;
            gap: 0;
          }

          .code-row {
            justify-content: flex-start;
          }

          .code-row span {
            width: 100px;
            color: #72a1f6;
            font-weight: 800;
          }

          .code-row strong {
            color: #d5e4ff;
          }

          .code-row small {
            margin-left: auto;
            color: #5e718f;
          }

          .request-row {
            align-items: flex-start;
          }

          .request-row > div:first-child strong,
          .request-row > div:first-child small {
            display: block;
          }

          .request-row > div:first-child small {
            margin-top: 3px;
            color: #637795;
          }

          .request-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
          }

          .request-code {
            color: #72dca9;
          }

          .empty {
            padding: 35px 15px;
            color: #60718f;
            text-align: center;
          }

          footer {
            padding: 0 34px 25px;
            color: #465875;
            font-size: 10px;
          }

          .mobile-overlay {
            display: none;
          }

          @media (max-width: 900px) {
            .sidebar {
              transform: translateX(-100%);
              transition: transform .2s ease;
            }

            .sidebar.open {
              transform: translateX(0);
            }

            .mobile-overlay {
              display: block;
              position: fixed;
              z-index: 15;
              inset: 0;
              border: 0;
              background: rgba(0, 0, 0, .55);
            }

            .main {
              width: 100%;
              margin-left: 0;
            }

            .menu-button {
              display: block;
            }

            .topbar {
              padding: 0 16px;
            }

            .content {
              padding: 24px 16px;
            }

            footer {
              padding: 0 16px 20px;
            }

            .grid.three,
            .grid.two,
            .settings-grid {
              grid-template-columns: 1fr;
            }
          }

          @media (max-width: 600px) {
            .hero {
              align-items: flex-start;
              flex-direction: column;
              padding: 22px;
            }

            .chat-top {
              align-items: stretch;
              flex-direction: column;
            }

            .messages {
              height: 52vh;
              padding: 14px;
            }

            .message {
              max-width: 94%;
            }

            .composer-actions {
              justify-content: stretch;
            }

            .composer-actions button {
              flex: 1;
              padding-left: 8px;
              padding-right: 8px;
            }

            .request-row {
              flex-direction: column;
            }

            .request-actions {
              justify-content: flex-start;
            }

            .access-card {
              padding: 25px 20px;
            }
          }
          EOF

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Build application
        working-directory: client
        run: npm run build

      - name: Verify build output
        run: test -f client/dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
