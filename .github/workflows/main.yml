name: OU The Builder WBA - AI Chat v0.4.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create OU The Builder WBA
        shell: bash
        run: |
          rm -rf client
          mkdir -p client/src

          cat > client/package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "version": "0.4.3",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^5.0.2",
              "vite": "^7.1.7"
            }
          }
          EOF

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#050914" />
              <title>OU The Builder</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat > client/vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            plugins: [react()],
            base: "/OUTheBuilderWBA/"
          });
          EOF

          cat > client/src/main.jsx <<'EOF'
          import React, { useEffect, useMemo, useRef, useState } from "react";
          import { createRoot } from "react-dom/client";
          import "./style.css";

          const AGENTS = [
            {
              id: "ou-builder",
              name: "OU Builder AI",
              model: "openrouter/free",
              description: "General OU The Builder assistant"
            },
            {
              id: "coding",
              name: "Coding Agent",
              model: "openrouter/free",
              description: "Coding and debugging"
            },
            {
              id: "general",
              name: "General AI",
              model: "openrouter/free",
              description: "General purpose assistant"
            },
            {
              id: "research",
              name: "Research Agent",
              model: "openrouter/free",
              description: "Research and analysis"
            },
            {
              id: "free-auto",
              name: "Free Auto Agent",
              model: "openrouter/free",
              description: "Automatic free model routing"
            }
          ];

          const TEXT_EXTENSIONS = new Set([
            "txt",
            "md",
            "markdown",
            "json",
            "js",
            "jsx",
            "ts",
            "tsx",
            "css",
            "scss",
            "less",
            "html",
            "htm",
            "xml",
            "svg",
            "yaml",
            "yml",
            "csv",
            "log",
            "java",
            "kt",
            "kts",
            "gradle",
            "properties",
            "py",
            "rb",
            "php",
            "go",
            "rs",
            "c",
            "cc",
            "cpp",
            "h",
            "hpp",
            "sql",
            "sh",
            "bash",
            "bat",
            "ps1",
            "ini",
            "conf",
            "toml",
            "env",
            "gitignore",
            "dockerfile"
          ]);

          function Icon({ name, size = 17 }) {
            const common = {
              width: size,
              height: size,
              viewBox: "0 0 24 24",
              fill: "none",
              stroke: "currentColor",
              strokeWidth: "1.8",
              strokeLinecap: "round",
              strokeLinejoin: "round",
              "aria-hidden": "true"
            };

            if (name === "home") {
              return (
                <svg {...common}>
                  <path d="M3 10.8 12 3l9 7.8" />
                  <path d="M5.5 9.5V21h13V9.5" />
                  <path d="M9.5 21v-6h5v6" />
                </svg>
              );
            }

            if (name === "folder") {
              return (
                <svg {...common}>
                  <path d="M3 6.5h7l2 2h9v10.5H3z" />
                </svg>
              );
            }

            if (name === "build") {
              return (
                <svg {...common}>
                  <path d="m14.7 5.3 4 4" />
                  <path d="m4 20 4.3-1 9.8-9.8a2.8 2.8 0 0 0-4-4L4.3 15z" />
                  <path d="m12 8 4 4" />
                </svg>
              );
            }

            if (name === "chat") {
              return (
                <svg {...common}>
                  <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5.5 4v-4.8A2.5 2.5 0 0 1 4 13.5z" />
                  <path d="M8 8h8M8 11.5h5" />
                </svg>
              );
            }

            if (name === "flow") {
              return (
                <svg {...common}>
                  <rect x="3" y="4" width="6" height="5" rx="1" />
                  <rect x="15" y="4" width="6" height="5" rx="1" />
                  <rect x="9" y="15" width="6" height="5" rx="1" />
                  <path d="M9 6.5h6M18 9v3.5h-6M6 9v3.5h6" />
                </svg>
              );
            }

            if (name === "settings") {
              return (
                <svg {...common}>
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.5V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.1A1.7 1.7 0 0 0 7.7 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4h2.5v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1z" />
                </svg>
              );
            }

            if (name === "copy") {
              return (
                <svg {...common}>
                  <rect x="8" y="8" width="12" height="12" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
              );
            }

            if (name === "upload") {
              return (
                <svg {...common}>
                  <path d="M12 16V4" />
                  <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
                  <path d="M5 13.5V20h14v-6.5" />
                </svg>
              );
            }

            if (name === "send") {
              return (
                <svg {...common}>
                  <path d="M21 3 10 14" />
                  <path d="m21 3-7 18-4-7-7-4z" />
                </svg>
              );
            }

            if (name === "plus") {
              return (
                <svg {...common}>
                  <path d="M12 5v14M5 12h14" />
                </svg>
              );
            }

            if (name === "spark") {
              return (
                <svg {...common}>
                  <path d="m12 3 1.3 5.7L19 10l-5.7 1.3L12 17l-1.3-5.7L5 10l5.7-1.3z" />
                  <path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6z" />
                </svg>
              );
            }

            if (name === "paperclip") {
              return (
                <svg {...common}>
                  <path d="m20.5 11.5-7.9 7.9a5 5 0 0 1-7.1-7.1l8.2-8.2a3.5 3.5 0 0 1 5 5l-8.2 8.2a2 2 0 1 1-2.8-2.8l7.7-7.7" />
                </svg>
              );
            }

            if (name === "trash") {
              return (
                <svg {...common}>
                  <path d="M4 7h16M10 11v6M14 11v6" />
                  <path d="m6 7 1 13h10l1-13M9 7V4h6v3" />
                </svg>
              );
            }

            if (name === "check") {
              return (
                <svg {...common}>
                  <path d="m5 12 4 4L19 6" />
                </svg>
              );
            }

            if (name === "close") {
              return (
                <svg {...common}>
                  <path d="m6 6 12 12M18 6 6 18" />
                </svg>
              );
            }

            return null;
          }

          function App() {
            const [page, setPage] = useState("home");

            const nav = [
              ["home", "Home", "home"],
              ["storage", "Project & Storage", "folder"],
              ["build", "Build", "build"],
              ["chat", "AI Chat", "chat"],
              ["flow", "Image Flow", "flow"],
              ["settings", "Settings", "settings"]
            ];

            return (
              <div className="appShell">
                <aside className="sidebar">
                  <div className="brand">
                    <div className="brandMark">OU</div>
                    <div>
                      <strong>OU The Builder</strong>
                      <span>WEB APPLICATION</span>
                    </div>
                  </div>

                  <nav className="nav">
                    {nav.map(([id, label, icon]) => (
                      <button
                        key={id}
                        className={`navItem ${page === id ? "active" : ""}`}
                        onClick={() => setPage(id)}
                      >
                        <Icon name={icon} />
                        <span>{label}</span>
                      </button>
                    ))}
                  </nav>

                  <div className="sidebarBottom">
                    <div className="version">v0.4.3 • Foundation</div>
                    <div className="onlineDot">
                      <span />
                      System Online
                    </div>
                  </div>
                </aside>

                <main className="mainArea">
                  <header className="mobileHeader">
                    <div className="brandMark small">OU</div>
                    <strong>OU The Builder</strong>
                  </header>

                  {page === "home" && <Home setPage={setPage} />}
                  {page === "storage" && <Storage />}
                  {page === "build" && <Build />}
                  {page === "chat" && <Chat />}
                  {page === "flow" && <Flow />}
                  {page === "settings" && <Settings />}
                </main>

                <div className="mobileNav">
                  {nav.map(([id, label, icon]) => (
                    <button
                      key={id}
                      className={page === id ? "active" : ""}
                      onClick={() => setPage(id)}
                      title={label}
                    >
                      <Icon name={icon} size={18} />
                      <span>{label.split(" ")[0]}</span>
                    </button>
                  ))}
                </div>
              </div>
            );
          }

          function PageTitle({ eyebrow, title, description }) {
            return (
              <div className="pageTitle">
                <div className="eyebrow">{eyebrow}</div>
                <h1>{title}</h1>
                <p>{description}</p>
              </div>
            );
          }

          function Home({ setPage }) {
            return (
              <section className="page">
                <PageTitle
                  eyebrow="COMMAND CENTER"
                  title="Welcome to OU The Builder"
                  description="Your web-based application builder and remote build control center."
                />

                <div className="statusBanner">
                  <div className="statusPulse" />
                  <div>
                    <strong>OU The Builder is Online</strong>
                    <span>Foundation services are available.</span>
                  </div>
                  <div className="bannerVersion">v0.4.3</div>
                </div>

                <div className="dashboardGrid">
                  <MonitorCard
                    title="AI Builder"
                    icon="spark"
                    status="READY"
                    value="AI Chat Control"
                    detail="Use natural language to control builder functions."
                    onClick={() => setPage("chat")}
                  />

                  <MonitorCard
                    title="Project & Storage"
                    icon="folder"
                    status="READY"
                    value="Local Project Workspace"
                    detail="Projects, files and cloud storage integration."
                    onClick={() => setPage("storage")}
                  />

                  <MonitorCard
                    title="Build System"
                    icon="build"
                    status="READY"
                    value="Remote Build"
                    detail="Prepare projects for remote Android APK builds."
                    onClick={() => setPage("build")}
                  />

                  <MonitorCard
                    title="Image Flow"
                    icon="flow"
                    status="PREVIEW"
                    value="Visual App Flow"
                    detail="Visualize connected screens and navigation."
                    onClick={() => setPage("flow")}
                  />
                </div>

                <div className="twoColumn">
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">SYSTEM STATUS</span>
                        <h2>Service Monitor</h2>
                      </div>
                      <span className="greenBadge">ONLINE</span>
                    </div>

                    <div className="statusRows">
                      <InfoRow label="WBA Frontend" value="Online" ok />
                      <InfoRow label="AI Service" value="Ready" ok />
                      <InfoRow label="Project Storage" value="Ready" ok />
                      <InfoRow label="Google Drive" value="Not Connected" />
                      <InfoRow label="Build Service" value="Ready" ok />
                      <InfoRow label="GitHub Actions" value="Available" ok />
                    </div>
                  </div>

                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">CURRENT PROJECT</span>
                        <h2>No Project Selected</h2>
                      </div>
                    </div>

                    <div className="emptyProject">
                      <div className="emptyIcon">
                        <Icon name="folder" size={25} />
                      </div>
                      <p>Select or create a project to begin.</p>
                      <button
                        className="primaryButton"
                        onClick={() => setPage("storage")}
                      >
                        Open Project & Storage
                      </button>
                    </div>
                  </div>
                </div>

                <div className="panel">
                  <div className="panelHeader">
                    <div>
                      <span className="panelEyebrow">QUICK ACTIONS</span>
                      <h2>Start Building</h2>
                    </div>
                  </div>

                  <div className="quickActions">
                    <button onClick={() => setPage("storage")}>
                      <Icon name="folder" />
                      <span>
                        <strong>Manage Project</strong>
                        <small>Projects & files</small>
                      </span>
                    </button>

                    <button onClick={() => setPage("chat")}>
                      <Icon name="chat" />
                      <span>
                        <strong>Open AI Chat</strong>
                        <small>Talk to your agent</small>
                      </span>
                    </button>

                    <button onClick={() => setPage("build")}>
                      <Icon name="build" />
                      <span>
                        <strong>Build Project</strong>
                        <small>Prepare a remote build</small>
                      </span>
                    </button>

                    <button onClick={() => setPage("flow")}>
                      <Icon name="flow" />
                      <span>
                        <strong>Image Flow</strong>
                        <small>Visualize the app</small>
                      </span>
                    </button>
                  </div>
                </div>
              </section>
            );
          }

          function MonitorCard({ title, icon, status, value, detail, onClick }) {
            return (
              <button className="monitorCard" onClick={onClick}>
                <div className="monitorTop">
                  <div className="monitorIcon">
                    <Icon name={icon} />
                  </div>
                  <span>{status}</span>
                </div>
                <strong>{title}</strong>
                <h3>{value}</h3>
                <p>{detail}</p>
              </button>
            );
          }

          function InfoRow({ label, value, ok = false }) {
            return (
              <div className="infoRow">
                <span>{label}</span>
                <span className={ok ? "rowOk" : "rowMuted"}>
                  {ok && <i />}
                  {value}
                </span>
              </div>
            );
          }

          function Storage() {
            const [tab, setTab] = useState("projects");

            return (
              <section className="page">
                <PageTitle
                  eyebrow="PROJECT & STORAGE"
                  title="Project & Storage"
                  description="Manage projects, files and connected cloud storage from one place."
                />

                <div className="tabs">
                  <button
                    className={tab === "projects" ? "active" : ""}
                    onClick={() => setTab("projects")}
                  >
                    <Icon name="folder" />
                    Projects
                  </button>
                  <button
                    className={tab === "files" ? "active" : ""}
                    onClick={() => setTab("files")}
                  >
                    <Icon name="paperclip" />
                    Files
                  </button>
                  <button
                    className={tab === "drive" ? "active" : ""}
                    onClick={() => setTab("drive")}
                  >
                    Google Drive
                  </button>
                </div>

                {tab === "projects" && (
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">PROJECTS</span>
                        <h2>Your Projects</h2>
                      </div>
                      <button className="primaryButton">
                        <Icon name="plus" />
                        New Project
                      </button>
                    </div>

                    <div className="emptyLarge">
                      <div className="emptyIcon large">
                        <Icon name="folder" size={30} />
                      </div>
                      <h3>No projects yet</h3>
                      <p>Create a project or import an existing project package.</p>
                      <button className="secondaryButton">
                        Import Project
                      </button>
                    </div>
                  </div>
                )}

                {tab === "files" && (
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">FILES</span>
                        <h2>Project Files</h2>
                      </div>
                      <button className="secondaryButton">
                        <Icon name="upload" />
                        Upload Files
                      </button>
                    </div>

                    <div className="fileInfo">
                      <div className="fileType">ZIP</div>
                      <div>
                        <strong>Project import</strong>
                        <p>
                          ZIP packages and common project resources can be
                          imported into the workspace.
                        </p>
                      </div>
                    </div>

                    <div className="fileInfo">
                      <div className="fileType">ANY</div>
                      <div>
                        <strong>Resource manager</strong>
                        <p>
                          Files are intended to be available to builder features
                          that require them.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {tab === "drive" && (
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">GOOGLE DRIVE</span>
                        <h2>Cloud Storage</h2>
                      </div>
                      <span className="yellowBadge">NOT CONNECTED</span>
                    </div>

                    <div className="emptyLarge">
                      <div className="driveLogo">G</div>
                      <h3>Connect Google Drive</h3>
                      <p>
                        Google Drive can become an optional storage provider for
                        projects and reusable resources.
                      </p>
                      <button className="primaryButton">
                        Connect Google Drive
                      </button>
                    </div>
                  </div>
                )}
              </section>
            );
          }

          function Build() {
            const [target, setTarget] = useState("Android APK");
            const [building, setBuilding] = useState(false);
            const [logs, setLogs] = useState([
              "BUILD CONSOLE",
              "Waiting for a build request..."
            ]);

            function runBuild() {
              if (building) return;

              setBuilding(true);
              setLogs([
                "BUILD CONSOLE",
                "✓ Project detected",
                "✓ Project configuration checked",
                "✓ Resources checked",
                "✓ Build environment prepared",
                "→ Running build process..."
              ]);

              const steps = [
                "→ Preparing build workspace",
                "→ Resolving dependencies",
                "→ Compiling source",
                "→ Packaging application",
                "→ Verifying output",
                "BUILD SUCCESSFUL"
              ];

              steps.forEach((step, index) => {
                setTimeout(() => {
                  setLogs((current) => [...current, step]);

                  if (step === "BUILD SUCCESSFUL") {
                    setBuilding(false);
                  }
                }, 700 * (index + 1));
              });
            }

            return (
              <section className="page">
                <PageTitle
                  eyebrow="BUILD"
                  title="Build & Compile"
                  description="Prepare and execute a remote application build."
                />

                <div className="buildGrid">
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">TARGET</span>
                        <h2>Build Configuration</h2>
                      </div>
                    </div>

                    <label className="field">
                      <span>Target</span>
                      <select
                        value={target}
                        onChange={(e) => setTarget(e.target.value)}
                      >
                        <option>Android APK</option>
                        <option>Web App</option>
                        <option>Hybrid App</option>
                      </select>
                    </label>

                    <label className="field">
                      <span>Project</span>
                      <input placeholder="No project selected" disabled />
                    </label>

                    <label className="field">
                      <span>Build Mode</span>
                      <select>
                        <option>Debug</option>
                        <option>Release</option>
                      </select>
                    </label>

                    <div className="compatibility">
                      <span className="greenBadge">READY</span>
                      <p>
                        Foundation build interface is ready for backend build
                        integration.
                      </p>
                    </div>

                    <button
                      className="primaryButton buildButton"
                      onClick={runBuild}
                      disabled={building}
                    >
                      <Icon name="build" />
                      {building ? "Building..." : "Run Build"}
                    </button>
                  </div>

                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">BUILD CONSOLE</span>
                        <h2>Build Output</h2>
                      </div>
                      <span className="greenBadge">
                        {building ? "RUNNING" : "READY"}
                      </span>
                    </div>

                    <div className="console">
                      {logs.map((line, index) => (
                        <div
                          key={`${line}-${index}`}
                          className={
                            line.includes("SUCCESS")
                              ? "consoleSuccess"
                              : line.startsWith("✓")
                                ? "consoleOk"
                                : ""
                          }
                        >
                          {line}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </section>
            );
          }

          function Chat() {
            const [agentId, setAgentId] = useState(
              localStorage.getItem("ou_selected_agent") || "ou-builder"
            );

            const [messages, setMessages] = useState(() => {
              try {
                return JSON.parse(
                  localStorage.getItem(
                    `ou_chat_${
                      localStorage.getItem("ou_selected_agent") || "ou-builder"
                    }`
                  ) || "[]"
                );
              } catch {
                return [];
              }
            });

            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [showAgents, setShowAgents] = useState(false);
            const [attachments, setAttachments] = useState([]);
            const [copiedId, setCopiedId] = useState("");
            const fileInputRef = useRef(null);
            const agentMenuRef = useRef(null);

            const agent = useMemo(
              () =>
                AGENTS.find((item) => item.id === agentId) || AGENTS[0],
              [agentId]
            );

            useEffect(() => {
              localStorage.setItem(
                `ou_chat_${agentId}`,
                JSON.stringify(messages)
              );
            }, [messages, agentId]);

            useEffect(() => {
              function closeMenu(event) {
                if (
                  agentMenuRef.current &&
                  !agentMenuRef.current.contains(event.target)
                ) {
                  setShowAgents(false);
                }
              }

              document.addEventListener("mousedown", closeMenu);
              return () =>
                document.removeEventListener("mousedown", closeMenu);
            }, []);

            function changeAgent(id) {
              setAgentId(id);
              localStorage.setItem("ou_selected_agent", id);

              try {
                setMessages(
                  JSON.parse(
                    localStorage.getItem(`ou_chat_${id}`) || "[]"
                  )
                );
              } catch {
                setMessages([]);
              }

              setShowAgents(false);
            }

            function newChat() {
              if (loading) return;

              const shouldClear = window.confirm(
                "Start a new chat with this agent?"
              );

              if (!shouldClear) return;

              setMessages([]);
              setInput("");
              setAttachments([]);
              localStorage.removeItem(`ou_chat_${agentId}`);
            }

            async function copyText(text, id) {
              try {
                if (navigator.clipboard?.writeText) {
                  await navigator.clipboard.writeText(text);
                } else {
                  const area = document.createElement("textarea");
                  area.value = text;
                  document.body.appendChild(area);
                  area.select();
                  document.execCommand("copy");
                  area.remove();
                }

                setCopiedId(id);
                setTimeout(() => setCopiedId(""), 1400);
              } catch {
                setCopiedId("");
              }
            }

            function conversationText() {
              if (!messages.length) {
                return "No messages in this conversation.";
              }

              return messages
                .map((message) => {
                  const role =
                    message.role === "user" ? "You" : "OU Builder AI";
                  return `${role}:\n${message.content}`;
                })
                .join("\n\n--------------------\n\n");
            }

            function copyConversation() {
              copyText(conversationText(), "conversation");
            }

            function extensionOf(name) {
              const parts = name.toLowerCase().split(".");
              return parts.length > 1 ? parts.pop() : "";
            }

            function readAsDataURL(file) {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);

                reader.readAsDataURL(file);
              });
            }

            async function prepareFile(file) {
              const extension = extensionOf(file.name);

              if (
                file.type.startsWith("text/") ||
                TEXT_EXTENSIONS.has(extension)
              ) {
                try {
                  const maxChars = 120000;
                  const text = await file
                    .slice(0, maxChars * 4)
                    .text();

                  return {
                    id: `${file.name}-${file.lastModified}-${Math.random()}`,
                    name: file.name,
                    size: file.size,
                    type: file.type || "text/plain",
                    kind: "text",
                    content: text.slice(0, maxChars)
                  };
                } catch {
                  return {
                    id: `${file.name}-${file.lastModified}-${Math.random()}`,
                    name: file.name,
                    size: file.size,
                    type: file.type || "unknown",
                    kind: "other"
                  };
                }
              }

              if (file.type.startsWith("image/") && file.size <= 8 * 1024 * 1024) {
                try {
                  const dataUrl = await readAsDataURL(file);

                  return {
                    id: `${file.name}-${file.lastModified}-${Math.random()}`,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    kind: "image",
                    dataUrl
                  };
                } catch {
                  return {
                    id: `${file.name}-${file.lastModified}-${Math.random()}`,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    kind: "other"
                  };
                }
              }

              return {
                id: `${file.name}-${file.lastModified}-${Math.random()}`,
                name: file.name,
                size: file.size,
                type: file.type || "application/octet-stream",
                kind: "other"
              };
            }

            async function handleFiles(event) {
              const files = Array.from(event.target.files || []);

              if (!files.length) return;

              const prepared = [];

              for (const file of files) {
                prepared.push(await prepareFile(file));
              }

              setAttachments((current) => [...current, ...prepared]);

              event.target.value = "";
            }

            function removeAttachment(id) {
              setAttachments((current) =>
                current.filter((item) => item.id !== id)
              );
            }

            function attachmentLabel(item) {
              if (item.kind === "text") return "Readable";
              if (item.kind === "image") return "Image";
              return "File";
            }

            function makeApiContent(text, currentAttachments) {
              const parts = [];

              if (text.trim()) {
                parts.push({
                  type: "text",
                  text
                });
              }

              for (const attachment of currentAttachments) {
                if (attachment.kind === "text") {
                  parts.push({
                    type: "text",
                    text:
                      `\n\n[Attached file: ${attachment.name}]\n` +
                      attachment.content
                  });
                } else if (attachment.kind === "image") {
                  parts.push({
                    type: "text",
                    text: `\n\n[Attached image: ${attachment.name}]`
                  });

                  parts.push({
                    type: "image_url",
                    image_url: {
                      url: attachment.dataUrl
                    }
                  });
                } else {
                  parts.push({
                    type: "text",
                    text:
                      `\n\n[Attached file: ${attachment.name}]\n` +
                      `Type: ${attachment.type || "unknown"}\n` +
                      "This file was selected in the browser. Direct parsing " +
                      "depends on the selected model/provider or future backend " +
                      "file-processing support."
                  });
                }
              }

              if (!parts.length) {
                return "";
              }

              if (
                parts.length === 1 &&
                parts[0].type === "text"
              ) {
                return parts[0].text;
              }

              return parts;
            }

            async function sendMessage() {
              const text = input.trim();

              if (!text && attachments.length === 0) return;
              if (loading) return;

              const currentAttachments = [...attachments];

              const displayParts = [];

              if (text) {
                displayParts.push(text);
              }

              if (currentAttachments.length) {
                displayParts.push(
                  currentAttachments
                    .map(
                      (item) =>
                        `[Attached: ${item.name} • ${attachmentLabel(item)}]`
                    )
                    .join("\n")
                );
              }

              const displayText = displayParts.join("\n\n");

              const userMessage = {
                role: "user",
                content: displayText
              };

              const nextMessages = [...messages, userMessage];

              setMessages(nextMessages);
              setInput("");
              setAttachments([]);
              setLoading(true);

              const apiKey =
                localStorage.getItem("ou_openrouter_key") || "";

              if (!apiKey) {
                setTimeout(() => {
                  setMessages((current) => [
                    ...current,
                    {
                      role: "assistant",
                      content:
                        `I received your message${currentAttachments.length ? " and attachment(s)" : ""}.\n\n` +
                        "The OpenRouter API key is not configured yet. " +
                        "Open Settings → Connections → AI Agents to add your API key."
                    }
                  ]);

                  setLoading(false);
                }, 500);

                return;
              }

              try {
                const apiMessages = nextMessages
                  .slice(-20)
                  .map((message) => ({
                    role: message.role,
                    content: message.content
                  }));

                const lastIndex = apiMessages.length - 1;

                if (lastIndex >= 0 && apiMessages[lastIndex].role === "user") {
                  apiMessages[lastIndex] = {
                    role: "user",
                    content: makeApiContent(text, currentAttachments)
                  };
                }

                const systemMessage = {
                  role: "system",
                  content:
                    `You are ${agent.name}, an AI agent inside OU The Builder. ` +
                    "Help the user operate, design, debug and build projects. " +
                    "Be practical and concise. When files are provided, use their " +
                    "contents when available and clearly state when a file type " +
                    "cannot be directly parsed by the current model."
                };

                const response = await fetch(
                  "https://openrouter.ai/api/v1/chat/completions",
                  {
                    method: "POST",
                    headers: {
                      Authorization: `Bearer ${apiKey}`,
                      "Content-Type": "application/json",
                      "HTTP-Referer": window.location.origin,
                      "X-Title": "OU The Builder"
                    },
                    body: JSON.stringify({
                      model: agent.model,
                      messages: [systemMessage, ...apiMessages]
                    })
                  }
                );

                const data = await response.json();

                if (!response.ok) {
                  throw new Error(
                    data?.error?.message ||
                      `OpenRouter request failed (${response.status})`
                  );
                }

                const answer =
                  data?.choices?.[0]?.message?.content ||
                  "The agent returned an empty response.";

                setMessages((current) => [
                  ...current,
                  {
                    role: "assistant",
                    content:
                      typeof answer === "string"
                        ? answer
                        : JSON.stringify(answer, null, 2)
                  }
                ]);
              } catch (error) {
                setMessages((current) => [
                  ...current,
                  {
                    role: "assistant",
                    content:
                      "The agent request failed.\n\n" +
                      String(error?.message || error)
                  }
                ]);
              } finally {
                setLoading(false);
              }
            }

            function handleKeyDown(event) {
              if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
              }
            }

            return (
              <section className="chatPage">
                <div className="chatHeader">
                  <div>
                    <div className="eyebrow">AI BUILDER</div>
                    <h1>AI Chat</h1>
                    <p>
                      Use the selected agent as the central control interface.
                    </p>
                  </div>

                  <button
                    className="copyConversationButton"
                    onClick={copyConversation}
                    title="Copy entire conversation"
                    aria-label="Copy entire conversation"
                  >
                    <Icon name={copiedId === "conversation" ? "check" : "copy"} />
                    <span>
                      {copiedId === "conversation"
                        ? "Copied"
                        : "Copy Conversation"}
                    </span>
                  </button>
                </div>

                <div className="sourceBar">
                  <div className="sourceIcon">
                    <Icon name="spark" />
                  </div>

                  <div>
                    <strong>Agent Control</strong>
                    <span>
                      The composer controls below let you select the agent,
                      attach files and start a new chat.
                    </span>
                  </div>
                </div>

                <div className="messages">
                  {messages.length === 0 && (
                    <div className="chatEmpty">
                      <div className="chatEmptyIcon">
                        <Icon name="spark" size={30} />
                      </div>
                      <h2>Start a conversation</h2>
                      <p>
                        Ask the builder to create, inspect, explain, debug or
                        prepare a project.
                      </p>

                      <div className="suggestionGrid">
                        <button
                          onClick={() =>
                            setInput("Create a new Android project.")
                          }
                        >
                          Create a project
                        </button>

                        <button
                          onClick={() =>
                            setInput("Show me the application flow.")
                          }
                        >
                          Show app flow
                        </button>

                        <button
                          onClick={() =>
                            setInput("Check this project for build problems.")
                          }
                        >
                          Check build
                        </button>
                      </div>
                    </div>
                  )}

                  {messages.map((message, index) => {
                    const messageId = `message-${index}`;
                    const isUser = message.role === "user";

                    return (
                      <div
                        className={`messageRow ${
                          isUser ? "userRow" : "assistantRow"
                        }`}
                        key={messageId}
                      >
                        <div
                          className={`messageBubble ${
                            isUser ? "userBubble" : "assistantBubble"
                          }`}
                        >
                          <div className="messageRole">
                            {isUser ? "You" : agent.name}
                          </div>

                          <div className="messageText">
                            {message.content}
                          </div>

                          <button
                            className="messageCopy"
                            onClick={() =>
                              copyText(message.content, messageId)
                            }
                            title="Copy this message"
                            aria-label="Copy this message"
                          >
                            <Icon
                              name={
                                copiedId === messageId
                                  ? "check"
                                  : "copy"
                              }
                              size={15}
                            />
                          </button>
                        </div>
                      </div>
                    );
                  })}

                  {loading && (
                    <div className="messageRow assistantRow">
                      <div className="messageBubble assistantBubble loadingBubble">
                        <div className="messageRole">{agent.name}</div>
                        <div className="typing">
                          <span />
                          <span />
                          <span />
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="chatComposer">
                  {attachments.length > 0 && (
                    <div className="attachmentTray">
                      {attachments.map((attachment) => (
                        <div
                          className="attachmentChip"
                          key={attachment.id}
                          title={attachment.name}
                        >
                          <Icon name="paperclip" size={14} />
                          <div>
                            <strong>{attachment.name}</strong>
                            <span>{attachmentLabel(attachment)}</span>
                          </div>
                          <button
                            onClick={() =>
                              removeAttachment(attachment.id)
                            }
                            title={`Remove ${attachment.name}`}
                            aria-label={`Remove ${attachment.name}`}
                          >
                            <Icon name="close" size={13} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="composerBox">
                    <textarea
                      value={input}
                      onChange={(event) => setInput(event.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={`Message ${agent.name}...`}
                      disabled={loading}
                      rows={3}
                    />

                    <input
                      ref={fileInputRef}
                      type="file"
                      multiple
                      accept="*/*"
                      className="hiddenFileInput"
                      onChange={handleFiles}
                    />

                    <div className="composerControls">
                      <button
                        className="composerIconButton"
                        onClick={() => fileInputRef.current?.click()}
                        disabled={loading}
                        title="Upload files"
                        aria-label="Upload files"
                      >
                        <Icon name="paperclip" />
                      </button>

                      <div className="agentControl" ref={agentMenuRef}>
                        <button
                          className="composerAgentButton"
                          onClick={() => setShowAgents((value) => !value)}
                          disabled={loading}
                          title={`Select agent: ${agent.name}`}
                          aria-label={`Select agent: ${agent.name}`}
                        >
                          <Icon name="spark" size={16} />
                          <span>{agent.name}</span>
                        </button>

                        {showAgents && (
                          <div className="agentMenu composerAgentMenu">
                            <div className="agentMenuTitle">
                              SELECT AGENT
                            </div>

                            {AGENTS.map((item) => (
                              <button
                                key={item.id}
                                className={
                                  item.id === agentId ? "selected" : ""
                                }
                                onClick={() => changeAgent(item.id)}
                              >
                                <div className="agentMenuIcon">
                                  <Icon name="spark" size={15} />
                                </div>
                                <div>
                                  <strong>{item.name}</strong>
                                  <span>{item.description}</span>
                                </div>

                                {item.id === agentId && (
                                  <Icon name="check" size={15} />
                                )}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>

                      <button
                        className="composerIconButton"
                        onClick={newChat}
                        disabled={loading}
                        title="New chat"
                        aria-label="New chat"
                      >
                        <Icon name="plus" />
                      </button>

                      <button
                        className="sendButton"
                        onClick={sendMessage}
                        disabled={
                          loading ||
                          (!input.trim() && attachments.length === 0)
                        }
                        title="Send message"
                        aria-label="Send message"
                      >
                        <Icon name="send" size={18} />
                      </button>
                    </div>
                  </div>

                  <div className="composerHint">
                    <span>
                      Enter to send • Shift + Enter for a new line
                    </span>
                    <span>
                      Upload files the selected agent/model can read
                    </span>
                  </div>
                </div>
              </section>
            );
          }

          function Flow() {
            return (
              <section className="page">
                <PageTitle
                  eyebrow="IMAGE FLOW"
                  title="Application Flow"
                  description="Preview how screens, actions and navigation connect."
                />

                <div className="panel flowPanel">
                  <div className="panelHeader">
                    <div>
                      <span className="panelEyebrow">VISUAL PREVIEW</span>
                      <h2>Code → Actual View Flow</h2>
                    </div>
                    <span className="yellowBadge">PREVIEW</span>
                  </div>

                  <div className="flowCanvas">
                    <FlowNode title="Home" detail="Main screen" />
                    <div className="flowArrow">↓</div>
                    <div className="flowSplit">
                      <FlowNode title="Projects" detail="Project manager" />
                      <FlowNode title="AI Chat" detail="AI control" />
                      <FlowNode title="Build" detail="Compile / APK" />
                    </div>
                    <div className="flowArrow">↓</div>
                    <FlowNode title="Application Preview" detail="Connected app flow" />
                  </div>
                </div>
              </section>
            );
          }

          function FlowNode({ title, detail }) {
            return (
              <div className="flowNode">
                <div className="flowNodeIcon">
                  <Icon name="flow" size={18} />
                </div>
                <strong>{title}</strong>
                <span>{detail}</span>
              </div>
            );
          }

          function Settings() {
            const [key, setKey] = useState(
              localStorage.getItem("ou_openrouter_key") || ""
            );

            function saveKey() {
              localStorage.setItem("ou_openrouter_key", key.trim());
              window.alert("OpenRouter API key saved in this browser.");
            }

            return (
              <section className="page">
                <PageTitle
                  eyebrow="SETTINGS"
                  title="Connections & Configuration"
                  description="Configure AI agents and future storage/build integrations."
                />

                <div className="settingsGrid">
                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">AI AGENTS</span>
                        <h2>Agent Connections</h2>
                      </div>
                    </div>

                    {AGENTS.map((item) => (
                      <div className="connection" key={item.id}>
                        <div className="connectionIcon">
                          <Icon name="spark" />
                        </div>
                        <div>
                          <strong>{item.name}</strong>
                          <p>{item.description}</p>
                        </div>
                        <span className="greenBadge">READY</span>
                      </div>
                    ))}

                    <button className="secondaryButton fullButton">
                      <Icon name="plus" />
                      Add Agent
                    </button>
                  </div>

                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">OPENROUTER</span>
                        <h2>AI API Key</h2>
                      </div>
                    </div>

                    <label className="field">
                      <span>API Key</span>
                      <input
                        type="password"
                        value={key}
                        onChange={(event) => setKey(event.target.value)}
                        placeholder="sk-or-..."
                      />
                    </label>

                    <p className="securityNote">
                      Prototype mode stores this key in this browser's
                      localStorage. A production version should move secrets
                      behind a secure backend.
                    </p>

                    <button
                      className="primaryButton fullButton"
                      onClick={saveKey}
                    >
                      Save API Key
                    </button>
                  </div>

                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">STORAGE</span>
                        <h2>Storage Providers</h2>
                      </div>
                    </div>

                    <Connection
                      name="Google Drive"
                      detail="Project and resource storage"
                      status="Not Connected"
                    />

                    <Connection
                      name="Object Storage"
                      detail="Future R2 / cloud storage provider"
                      status="Planned"
                    />
                  </div>

                  <div className="panel">
                    <div className="panelHeader">
                      <div>
                        <span className="panelEyebrow">BUILD SYSTEM</span>
                        <h2>Remote Build</h2>
                      </div>
                    </div>

                    <Connection
                      name="GitHub Actions"
                      detail="Remote build executor"
                      status="Available"
                    />

                    <Connection
                      name="Android SDK"
                      detail="Remote APK compilation environment"
                      status="Ready"
                    />
                  </div>
                </div>
              </section>
            );
          }

          function Connection({ name, detail, status }) {
            return (
              <div className="connection">
                <div className="connectionIcon">
                  <Icon name="settings" />
                </div>
                <div>
                  <strong>{name}</strong>
                  <p>{detail}</p>
                </div>
                <span
                  className={
                    status === "Available" || status === "Ready"
                      ? "greenBadge"
                      : "yellowBadge"
                  }
                >
                  {status}
                </span>
              </div>
            );
          }

          createRoot(document.getElementById("root")).render(<App />);
          EOF

