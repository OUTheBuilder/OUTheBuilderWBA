            background: #0c1430;
            border: 1px solid rgba(91, 130, 238, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
          }

          .flow-node-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(71, 111, 255, 0.12);
            color: #6f9dff;
          }

          .flow-node strong,
          .flow-node span {
            display: block;
          }

          .flow-node strong {
            font-size: 11px;
          }

          .flow-node span {
            color: #65738f;
            font-size: 9px;
            margin-top: 3px;
          }

          .node-one {
            left: 4%;
            top: 40px;
          }

          .node-two {
            left: 30%;
            top: 160px;
          }

          .node-three {
            left: 56%;
            top: 40px;
          }

          .node-four {
            right: 4%;
            top: 250px;
          }

          .flow-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(
              90deg,
              #427dff,
              #8b5dff
            );
            transform-origin: left center;
          }

          .line-one {
            width: 190px;
            left: 19%;
            top: 125px;
            transform: rotate(23deg);
          }

          .line-two {
            width: 190px;
            left: 45%;
            top: 190px;
            transform: rotate(-24deg);
          }

          .line-three {
            width: 190px;
            left: 70%;
            top: 130px;
            transform: rotate(35deg);
          }

          .flow-note {
            color: #687690;
            font-size: 10px;
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid rgba(104, 128, 190, 0.1);
          }

          .centered-panel {
            text-align: center;
            padding: 55px 25px;
          }

          .centered-panel h2 {
            margin: 12px 0 8px;
          }

          .coming-soon {
            display: block;
            margin-top: 12px;
            color: #56627b;
            font-size: 9px;
          }

          .settings-list {
            display: grid;
            gap: 10px;
          }

          .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px;
            border-radius: 13px;
            background: rgba(10, 16, 36, 0.78);
            border: 1px solid rgba(100, 126, 207, 0.14);
          }

          .setting-item h3 {
            margin: 0;
            font-size: 12px;
          }

          .setting-item p {
            color: #687690;
            font-size: 10px;
            margin: 5px 0 0;
          }

          .setting-item > span {
            color: #77a0ff;
            font-size: 10px;
            white-space: nowrap;
          }

          .workspace-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(100, 126, 207, 0.08);
          }

          .workspace-stat strong {
            font-size: 18px;
          }

          .workspace-stat span {
            color: #687690;
            font-size: 10px;
          }

          .footer {
            padding: 20px 30px;
            color: #45516b;
            border-top: 1px solid rgba(105, 132, 220, 0.08);
            display: flex;
            gap: 15px;
            font-size: 9px;
          }

          .mobile-overlay {
            display: none;
          }

          @media (max-width: 1100px) {

            .dashboard-grid {
              grid-template-columns: repeat(2, 1fr);
            }

            .three-column {
              grid-template-columns: 1fr;
            }

            .project-grid {
              grid-template-columns: repeat(2, 1fr);
            }

          }

          @media (max-width: 820px) {

            .sidebar {
              transform: translateX(-105%);
              transition: transform 0.25s ease;
              box-shadow: 20px 0 50px rgba(0, 0, 0, 0.35);
            }

            .sidebar.mobile-open {
              transform: translateX(0);
            }

            .mobile-overlay {
              position: fixed;
              inset: 0;
              background: rgba(0, 0, 0, 0.6);
              z-index: 40;
            }

            .mobile-overlay.show {
              display: block;
            }

            .main-content {
              margin-left: 0;
              width: 100%;
            }

            .menu-button {
              display: block;
            }

            .topbar {
              padding: 0 18px;
            }

            .topbar-project {
              display: none;
            }

            .page-container {
              padding: 18px;
            }

            .hero {
              padding: 25px;
            }

            .hero-orb {
              display: none;
            }

            .two-column,
            .build-layout {
              grid-template-columns: 1fr;
            }

            .page-heading {
              align-items: flex-start;
              flex-direction: column;
            }

            .page-heading .primary-button {
              width: 100%;
            }

          }

          @media (max-width: 600px) {

            .dashboard-grid,
            .project-grid {
              grid-template-columns: 1fr;
            }

            .hero {
              min-height: 220px;
            }

            .hero h1 {
              font-size: 30px;
            }

            .status-row {
              display: grid;
              grid-template-columns: 1fr;
            }

            .status-chip {
              width: 100%;
            }

            .config-grid {
              grid-template-columns: 1fr;
            }

            .flow-canvas {
              min-height: 650px;
            }

            .flow-node {
              width: 175px;
            }

            .node-one {
              left: 5%;
              top: 25px;
            }

            .node-two {
              left: 25%;
              top: 180px;
            }

            .node-three {
              left: 5%;
              top: 335px;
            }

            .node-four {
              left: 25%;
              top: 490px;
            }

            .line-one,
            .line-two,
            .line-three {
              display: none;
            }

            .chat-input-row {
              flex-direction: column;
            }

            .chat-input-row .primary-button {
              width: 100%;
            }

            .setting-item {
              align-items: flex-start;
              flex-direction: column;
            }

            .footer {
              padding: 17px 18px;
              flex-wrap: wrap;
            }

          }
          EOF

          cat > public/.nojekyll <<'EOF'
          EOF

          echo "Installing dependencies..."
          npm install

          echo "Building OU The Builder WBA..."
          npm run build

          echo "Checking build output..."
          test -f dist/index.html

          echo "Build completed successfully."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json vite.config.js index.html src public

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Build OU The Builder WBA foundation [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
