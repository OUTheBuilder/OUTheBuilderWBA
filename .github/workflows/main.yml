name: OU The Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:

      android_project_zip:
        description: "Optional direct HTTPS URL to an Android project ZIP"
        required: false
        type: string
        default: ""

      google_drive_file_id:
        description: "Google Drive File ID of the temporary Android project ZIP"
        required: false
        type: string
        default: ""

      android_build_type:
        description: "Android build type"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release

      android_gradle_task:
        description: "Optional Gradle task. Leave blank for automatic detection."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


# ============================================================
# JOB 1
# WBA BUILD + GITHUB PAGES
# ============================================================

jobs:

  build-and-deploy-wba:
    name: Build and Deploy OU The Builder WBA
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build OU The Builder WBA
        shell: bash
        run: |
          set -e

          npm run build

      - name: Verify WBA build
        shell: bash
        run: |
          set -e

          test -f dist/index.html

          echo "=========================================="
          echo "WBA BUILD VERIFIED"
          echo "=========================================="

          find dist \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WBA Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy WBA to GitHub Pages
        uses: actions/deploy-pages@v4


  # ============================================================
  # JOB 2
  # REMOTE ANDROID APK BUILD
  #
  # IMPORTANT:
  # This job runs ONLY when the workflow is manually started
  # from GitHub Actions.
  #
  # Source options:
  #
  # 1. Google Drive temporary ZIP
  # 2. Direct HTTPS ZIP
  #
  # Google Drive takes priority if both are supplied.
  # ============================================================

  remote-android-build:
    name: Remote Android APK Build
    runs-on: ubuntu-24.04

    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # SHOW BUILD REQUEST
      # --------------------------------------------------------

      - name: Show Android build request
        shell: bash
        env:
          GOOGLE_DRIVE_FILE_ID: ${{ inputs.google_drive_file_id }}
          PROJECT_ZIP_URL: ${{ inputs.android_project_zip }}
          BUILD_TYPE: ${{ inputs.android_build_type }}
          GRADLE_TASK: ${{ inputs.android_gradle_task }}

        run: |
          set -e

          echo "=========================================="
          echo "OU THE BUILDER ANDROID BUILD REQUEST"
          echo "=========================================="

          echo
          echo "Build type:"
          echo "$BUILD_TYPE"

          echo
          echo "Gradle task:"
          if [ -n "$GRADLE_TASK" ]; then
            echo "$GRADLE_TASK"
          else
            echo "(automatic)"
          fi

          echo
          echo "Project source:"

          if [ -n "$GOOGLE_DRIVE_FILE_ID" ]; then
            echo "Google Drive temporary project ZIP"
            echo "File ID received."
          elif [ -n "$PROJECT_ZIP_URL" ]; then
            echo "Direct HTTPS project ZIP"
          else
            echo "::error::No Android project source was provided."
            echo
            echo "Please provide either:"
            echo "1. Google Drive File ID"
            echo "or"
            echo "2. Direct HTTPS ZIP URL"
            exit 1
          fi


      # --------------------------------------------------------
      # JAVA 17
      # --------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # --------------------------------------------------------
      # PREPARE PROJECT
      # --------------------------------------------------------

      - name: Prepare Android project workspace
        shell: bash
        env:
          PROJECT_ZIP_URL: ${{ inputs.android_project_zip }}
          GOOGLE_DRIVE_FILE_ID: ${{ inputs.google_drive_file_id }}
          GOOGLE_DRIVE_BRIDGE_URL: ${{ secrets.GOOGLE_DRIVE_BRIDGE_URL }}
          GOOGLE_DRIVE_BRIDGE_SECRET: ${{ secrets.GOOGLE_DRIVE_BRIDGE_SECRET }}

        run: |
          set -euo pipefail

          rm -rf android-build

          mkdir -p android-build

          echo "=========================================="
          echo "PREPARING ANDROID PROJECT"
          echo "=========================================="

          # ----------------------------------------------------
          # GOOGLE DRIVE SOURCE
          # ----------------------------------------------------

          if [ -n "$GOOGLE_DRIVE_FILE_ID" ]; then

            echo
            echo "Source: Google Drive"
            echo "Temporary file ID received."

            if [ -z "$GOOGLE_DRIVE_BRIDGE_URL" ]; then
              echo "::error::GOOGLE_DRIVE_BRIDGE_URL secret is missing."
              exit 1
            fi

            if [ -z "$GOOGLE_DRIVE_BRIDGE_SECRET" ]; then
              echo "::error::GOOGLE_DRIVE_BRIDGE_SECRET secret is missing."
              exit 1
            fi

            echo
            echo "Requesting ZIP from Build Bridge..."

            ENCODED_FILE_ID="$(
              printf '%s' "$GOOGLE_DRIVE_FILE_ID" |
              jq -sRr @uri
            )"

            ENCODED_SECRET="$(
              printf '%s' "$GOOGLE_DRIVE_BRIDGE_SECRET" |
              jq -sRr @uri
            )"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --connect-timeout 30 \
              --output bridge-response.json \
              "$GOOGLE_DRIVE_BRIDGE_URL?action=download&fileId=$ENCODED_FILE_ID&secret=$ENCODED_SECRET"

            echo
            echo "Bridge response received."

            jq -e \
              '.ok == true and (.base64 | type == "string")' \
              bridge-response.json \
              >/dev/null

            echo "Bridge response verified."

            jq -r '.base64' bridge-response.json |
              base64 --decode > android
