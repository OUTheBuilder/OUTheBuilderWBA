name: OU The Builder WBA - Multi Agent Chat

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================================================
      # NODE.JS 24
      #
      # IMPORTANT:
      # This workflow creates package.json during the workflow.
      # Therefore there is no committed package-lock.json yet.
      # npm caching is intentionally disabled.
      # =========================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # =========================================================
      # CREATE OU THE BUILDER WBA
      # =========================================================

      - name: Create OU The Builder WBA
        shell: bash
        run: |
          set -e

          rm -rf client

          mkdir -p client/src

          # -----------------------------------------------------
          # package.json
          # -----------------------------------------------------

          cat > client/package.json <<'EOF'
          {
            "name": "ou-the-builder-wba",
            "private": true,
            "version": "0.4.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "@vitejs/plugin-react": "^5.1.0",
              "vite": "^7.1.7",
              "react": "^19.1.1",
              "react-dom": "^19.1.1"
            },
            "devDependencies": {}
          }
          EOF

          # -----------------------------------------------------
          # Vite
          # -----------------------------------------------------

          cat > client/vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            base: "/OUTheBuilderWBA/",
            plugins: [react()]
          });
          EOF

          # -----------------------------------------------------
          # HTML
          # -----------------------------------------------------

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />

              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              />

              <meta
                name="theme-color"
                content="#050b14"
              />

              <title>OU The Builder</title>
            </head>

            <body>
              <div id="root"></div>

              <script
                type="module"
                src="/src/main.jsx"
              ></script>
            </body>
          </html>
          EOF

          # =====================================================
          # MAIN REACT APPLICATION
          # =====================================================

          cat > client/src/main.jsx <<'EOF'
          import React, {
            useEffect,
            useMemo,
            useRef,
            useState
          } from "react";

          import {
            createRoot
          } from "react-dom/client";

          import "./styles.css";


          // =====================================================
          // CONFIGURATION
          // =====================================================

          const FREE_MODEL = "openrouter/free";

          const OPENROUTER_URL =
            "https://openrouter.ai/api/v1/chat/completions";


          // =====================================================
          // AI AGENTS
          // =====================================================

          const AGENTS = [

            {
              id: "builder",
              name: "OU Builder AI",
              icon: "🛠️",
              description:
                "Builder projects, files, builds and application workflows.",
              system:
                "You are OU Builder AI, the central AI assistant for OU The Builder. Help users create, understand, organize and build software projects. Give practical answers. Help with projects, files, application architecture, builds, debugging and Builder workflows."
            },

            {
              id: "coding",
              name: "Coding Agent",
              icon: "💻",
              description:
                "Programming, debugging and source-code assistance.",
              system:
                "You are the Coding Agent inside OU The Builder. Focus on programming, debugging, source code, software architecture and build errors. Give precise and practical technical answers."
            },

            {
              id: "general",
              name: "General AI",
              icon: "🤖",
              description:
                "General-purpose questions and conversation.",
              system:
                "You are the General AI assistant inside OU The Builder. Answer user questions naturally, clearly and helpfully."
            },

            {
              id: "research",
              name: "Research Agent",
              icon: "🔎",
              description:
                "Research, explanations and technical information.",
              system:
                "You are the Research Agent inside OU The Builder. Help users research technical subjects, analyze information and organize findings. Clearly distinguish known information from uncertainty."
            },

            {
              id: "free",
              name: "Free Auto Agent",
              icon: "⚡",
              description:
                "Automatically uses the available free model route.",
              system:
                "You are the Free Auto Agent inside OU The Builder. Be helpful, practical and concise. You operate through a free AI model routing service."
            }

          ];


          // =====================================================
          // NAVIGATION
          // =====================================================

          const NAV = [

            [
              "home",
              "⌂",
              "Home"
            ],

            [
              "projects",
              "▣",
              "Projects"
            ],

            [
              "files",
              "□",
              "Files"
            ],

            [
              "build",
              "⚙",
              "Build"
            ],

            [
              "chat",
              "✦",
              "AI Chat"
            ],

            [
              "flow",
              "◇",
              "Image Flow"
            ],

            [
              "drive",
              "☁",
              "Google Drive"
            ],

            [
              "settings",
              "⚙",
              "Settings"
            ]

          ];


          // =====================================================
          // MAIN APP
          // =====================================================

          function App() {

            const [
              authenticated,
              setAuthenticated
            ] = useState(
              localStorage.getItem(
                "ou_auth"
              ) === "true"
            );


            const [
              role,
              setRole
            ] = useState(
              localStorage.getItem(
                "ou_role"
              ) || ""
            );


            const [
              screen,
              setScreen
            ] = useState(
              "home"
            );


            const [
              agent,
              setAgent
            ] = useState(
              localStorage.getItem(
                "ou_agent"
              ) || "builder"
            );


            const [
              apiKey,
              setApiKey
            ] = useState(
              localStorage.getItem(
                "ou_openrouter_key"
              ) || ""
            );


            const [
              messages,
              setMessages
            ] = useState(
              () => {

                try {

                  return JSON.parse(
                    localStorage.getItem(
                      "ou_chat_messages"
                    ) || "[]"
                  );

                } catch {

                  return [];

                }

              }
            );


            const [
              input,
              setInput
            ] = useState("");


            const [
              sending,
              setSending
            ] = useState(false);


            const [
              projects,
              setProjects
            ] = useState(
              () => {

                try {

                  return JSON.parse(
                    localStorage.getItem(
                      "ou_projects"
                    ) || "[]"
                  );

                } catch {

                  return [];

                }

              }
            );


            const chatEnd =
              useRef(null);


            // -----------------------------------------------------
            // SAVE CHAT
            // -----------------------------------------------------

            useEffect(
              () => {

                localStorage.setItem(
                  "ou_chat_messages",
                  JSON.stringify(
                    messages
                  )
                );

                chatEnd.current?.scrollIntoView({
                  behavior: "smooth"
                });

              },
              [messages]
            );


            // -----------------------------------------------------
            // SAVE PROJECTS
            // -----------------------------------------------------

            useEffect(
              () => {

                localStorage.setItem(
                  "ou_projects",
                  JSON.stringify(
                    projects
                  )
                );

              },
              [projects]
            );


            // -----------------------------------------------------
            // CURRENT AGENT
            // -----------------------------------------------------

            const currentAgent =
              useMemo(
                () => {

                  return (
                    AGENTS.find(
                      item =>
                        item.id ===
                        agent
                    ) ||
                    AGENTS[0]
                  );

                },
                [agent]
              );


            // =====================================================
            // AUTH
            // =====================================================

            function login(
              selectedRole
            ) {

              localStorage.setItem(
                "ou_auth",
                "true"
              );

              localStorage.setItem(
                "ou_role",
                selectedRole
              );

              setRole(
                selectedRole
              );

              setAuthenticated(
                true
              );

            }


            function logout() {

              localStorage.removeItem(
                "ou_auth"
              );

              localStorage.removeItem(
                "ou_role"
              );

              setAuthenticated(
                false
              );

              setRole("");

              setScreen(
                "home"
              );

            }


            // =====================================================
            // AGENT
            // =====================================================

            function selectAgent(
              value
            ) {

              setAgent(
                value
              );

              localStorage.setItem(
                "ou_agent",
                value
              );

            }


            // =====================================================
            // CHAT
            // =====================================================

            function clearChat() {

              setMessages([]);

              localStorage.removeItem(
                "ou_chat_messages"
              );

            }


            async function sendMessage() {

              const text =
                input.trim();


              if (
                !text ||
                sending
              ) {

                return;

              }


              const userMessage = {

                id:
                  crypto.randomUUID(),

                role:
                  "user",

                content:
                  text,

                agent:
                  currentAgent.id,

                time:
                  new Date().toISOString()

              };


              const nextMessages =
                [
                  ...messages,
                  userMessage
                ];


              setMessages(
                nextMessages
              );

              setInput("");

              setSending(
                true
              );


              // -------------------------------------------------
              // NO API KEY
              // -------------------------------------------------

              if (
                !apiKey.trim()
              ) {

                const assistantMessage = {

                  id:
                    crypto.randomUUID(),

                  role:
                    "assistant",

                  content:
                    `I'm ${currentAgent.name}.

Your conversation system is working.

However, a live AI API key has not been configured yet.

Go to:

Settings → AI Agent Settings

and enter your OpenRouter API key.

Selected agent:
${currentAgent.name}

Free model route:
${FREE_MODEL}`,

                  agent:
                    currentAgent.id,

                  time:
                    new Date().toISOString()

                };


                setTimeout(
                  () => {

                    setMessages(
                      previous => [
                        ...previous,
                        assistantMessage
                      ]
                    );

                    setSending(
                      false
                    );

                  },
                  500
                );


                return;

              }


              // -------------------------------------------------
              // LIVE OPENROUTER REQUEST
              // -------------------------------------------------

              try {

                const apiMessages = [

                  {
                    role:
                      "system",

                    content:
                      currentAgent.system
                  },

                  ...nextMessages
                    .filter(
                      message =>
                        message.role ===
                          "user" ||
                        message.role ===
                          "assistant"
                    )
                    .map(
                      message => ({

                        role:
                          message.role,

                        content:
                          message.content

                      })
                    )

                ];


                const response =
                  await fetch(
                    OPENROUTER_URL,
                    {

                      method:
                        "POST",

                      headers: {

                        "Authorization":
                          `Bearer ${apiKey.trim()}`,

                        "Content-Type":
                          "application/json",

                        "HTTP-Referer":
                          "https://outhebuilder.github.io/OUTheBuilderWBA/",

                        "X-Title":
                          "OU The Builder WBA"

                      },

                      body:
                        JSON.stringify({

                          model:
                            FREE_MODEL,

                          messages:
                            apiMessages,

                          temperature:
                            0.7

                        })

                    }
                  );


                const data =
                  await response.json();


                if (
                  !response.ok
                ) {

                  throw new Error(
                    data?.error?.message ||
                    `AI request failed (${response.status})`
                  );

                }


                const answer =
                  data?.choices?.[0]?.message?.content ||
                  "The selected free agent did not return a response.";


                setMessages(
                  previous => [

                    ...previous,

                    {

                      id:
                        crypto.randomUUID(),

                      role:
                        "assistant",

                      content:
                        answer,

                      agent:
                        currentAgent.id,

                      time:
                        new Date().toISOString()

                    }

                  ]
                );


              } catch (
                error
              ) {

                setMessages(
                  previous => [

                    ...previous,

                    {

                      id:
                        crypto.randomUUID(),

                      role:
                        "assistant",

                      content:
                        `I could not reach the selected AI service.

Error:
${error.message}

Please check your OpenRouter API key and try again.`,

                      agent:
                        currentAgent.id,

                      time:
                        new Date().toISOString(),

                      error:
                        true

                    }

                  ]
                );

              } finally {

                setSending(
                  false
                );

              }

            }


            function handleInputKeyDown(
              event
            ) {

              if (
                event.key ===
                  "Enter" &&
                !event.shiftKey
              ) {

                event.preventDefault();

                sendMessage();

              }

            }


            // =====================================================
            // PROJECTS
            // =====================================================

            function createProject() {

              const name =
                prompt(
                  "Project name:"
                );


              if (
                !name ||
                !name.trim()
              ) {

                return;

              }


              setProjects(
                previous => [

                  ...previous,

                  {

                    id:
                      crypto.randomUUID(),

                    name:
                      name.trim(),

                    created:
                      new Date().toISOString()

                  }

                ]
              );

            }


            // =====================================================
            // ACCESS SCREEN
            // =====================================================

            function AccessScreen() {

              const [
                code,
                setCode
              ] = useState("");


              const [
                requestName,
                setRequestName
              ] = useState("");


              function submit() {

                // -------------------------------------------------
                // PERMANENT DEFAULT SUPER ADMIN
                // -------------------------------------------------

                if (
                  code.trim() ===
                  "Admins123"
                ) {

                  login(
                    "Super Admin"
                  );

                  return;

                }


                // -------------------------------------------------
                // GENERATED CODES
                // -------------------------------------------------

                const savedCodes =
                  JSON.parse(
                    localStorage.getItem(
                      "ou_codes"
                    ) || "{}"
                  );


                const found =
                  Object.entries(
                    savedCodes
                  ).find(
                    ([, value]) =>
                      value.code ===
                      code.trim()
                  );


                if (
                  found
                ) {

                  login(
                    found[1].role
                  );

                  return;

                }


                alert(
                  "Invalid access code."
                );

              }


              function requestAccess() {

                if (
                  !requestName.trim()
                ) {

                  alert(
                    "Enter your name first."
                  );

                  return;

                }


                const requests =
                  JSON.parse(
                    localStorage.getItem(
                      "ou_access_requests"
                    ) || "[]"
                  );


                requests.push({

                  id:
                    crypto.randomUUID(),

                  name:
                    requestName.trim(),

                  status:
                    "pending",

                  created:
                    new Date().toISOString()

                });


                localStorage.setItem(
                  "ou_access_requests",
                  JSON.stringify(
                    requests
                  )
                );


                alert(
                  "Access request saved. The Super Admin can process it from Settings."
                );


                setRequestName("");

              }


              return (

                <div
                  className="access-page"
                >

                  <div
                    className="access-card"
                  >

                    <div
                      className="logo-mark"
                    >
                      OU
                    </div>


                    <h1>
                      OU The Builder
                    </h1>


                    <p
                      className="muted"
                    >
                      Secure Access
                    </p>


                    <input
                      className="access-input"
                      type="password"
                      value={code}
                      onChange={
                        event =>
                          setCode(
                            event.target.value
                          )
                      }
                      onKeyDown={
                        event => {

                          if (
                            event.key ===
                            "Enter"
                          ) {

                            submit();

                          }

                        }
                      }
                      placeholder="Password / Access Code"
                    />


                    <button
                      className="primary-button"
                      onClick={
                        submit
                      }
                    >
                      ENTER
                    </button>


                    <div
                      className="request-box"
                    >

                      <div
                        className="section-title"
                      >
                        Request an access code
                      </div>


                      <input
                        value={
                          requestName
                        }
                        onChange={
                          event =>
                            setRequestName(
                              event.target.value
                            )
                        }
                        placeholder="Your name"
                      />


                      <button
                        className="secondary-button"
                        onClick={
                          requestAccess
                        }
                      >
                        REQUEST ACCESS
                      </button>

                    </div>


                    <p
                      className="small-muted"
                    >
                      Foundation access system
                    </p>

                  </div>

                </div>

              );

            }


            // =====================================================
            // HOME
            // =====================================================

            function Home() {

              return (

                <div>

                  <div
                    className="hero"
                  >

                    <div>

                      <span
                        className="eyebrow"
                      >
                        WEB-BASED APPLICATION
                      </span>


                      <h1>
                        Welcome to OU The Builder
                      </h1>


                      <p>
                        Build, manage and
                        control your projects
                        through an intelligent
                        multi-agent workspace.
                      </p>

                    </div>


                    <button
                      className="primary-button"
                      onClick={() =>
                        setScreen(
                          "chat"
                        )
                      }
                    >
                      OPEN AI CHAT
                    </button>

                  </div>


                  <div
                    className="stats-grid"
                  >

                    <Stat
                      title="Projects"
                      value={
                        projects.length
                      }
                      icon="▣"
                    />


                    <Stat
                      title="AI Agents"
                      value={
                        AGENTS.length
                      }
                      icon="✦"
                    />


                    <Stat
                      title="Role"
                      value={
                        role
                      }
                      icon="◉"
                    />


                    <Stat
                      title="Build"
                      value="Ready"
                      icon="⚙"
                    />

                  </div>


                  <div
                    className="feature-grid"
                  >

                    <Feature
                      title="AI Builder"
                      text="Use a selectable AI agent as the central Builder interface."
                      action={() =>
                        setScreen(
                          "chat"
                        )
                      }
                    />


                    <Feature
                      title="Projects"
                      text="Create and organize your application projects."
                      action={() =>
                        setScreen(
                          "projects"
                        )
                      }
                    />


                    <Feature
                      title="Build"
                      text="Prepare and eventually run remote application builds."
                      action={() =>
                        setScreen(
                          "build"
                        )
                      }
                    />


                    <Feature
                      title="Image Flow"
                      text="Visualize connected application screens and navigation."
                      action={() =>
                        setScreen(
                          "flow"
                        )
                      }
                    />

                  </div>

                </div>

              );

            }


            // =====================================================
            // AI CHAT
            // =====================================================

            function Chat() {

              return (

                <div
                  className="chat-page"
                >

                  <div
                    className="page-header"
                  >

                    <div>

                      <span
                        className="eyebrow"
                      >
                        CENTRAL CONTROL
                      </span>


                      <h1>
                        AI Chat
                      </h1>


                      <p>
                        Talk naturally with
                        the selected Builder
                        agent.
                      </p>

                    </div>


                    <button
                      className="secondary-button"
                      onClick={
                        clearChat
                      }
                    >
                      NEW CHAT
                    </button>

                  </div>


                  <div
                    className="chat-shell"
                  >

                    <div
                      className="chat-toolbar"
                    >

                      <div
                        className="agent-selector-wrap"
                      >

                        <span
                          className="toolbar-label"
                        >
                          SELECT AGENT
                        </span>


                        <select
                          value={
                            agent
                          }
                          onChange={
                            event =>
                              selectAgent(
                                event.target.value
                              )
                          }
                        >

                          {AGENTS.map(
                            item => (

                              <option
                                key={
                                  item.id
                                }
                                value={
                                  item.id
                                }
                              >
                                {item.icon}{" "}
                                {item.name}
                              </option>

                            )
                          )}

                        </select>

                      </div>


                      <div
                        className="agent-description"
                      >

                        <strong>
                          {
                            currentAgent.icon
                          }{" "}
                          {
                            currentAgent.name
                          }
                        </strong>


                        <span>
                          {
                            currentAgent.description
                          }
                        </span>

                      </div>


                      <div
                        className="free-badge"
                      >
                        FREE MODEL
                      </div>

                    </div>


                    <div
                      className="messages"
                    >

                      {messages.length ===
                        0 && (

                        <div
                          className="empty-chat"
                        >

                          <div
                            className="empty-icon"
                          >
                            ✦
                          </div>


                          <h2>
                            Start a conversation
                          </h2>


                          <p>
                            Ask anything or give
                            the Builder a command.
                          </p>


                          <div
                            className="prompt-grid"
                          >

                            <button
                              onClick={() =>
                                setInput(
                                  "Create a new project for me."
                                )
                              }
                            >
                              Create a project
                            </button>


                            <button
                              onClick={() =>
                                setInput(
                                  "Explain how I can build my project."
                                )
                              }
                            >
                              Explain the build process
                            </button>


                            <button
                              onClick={() =>
                                setInput(
                                  "Help me design my application flow."
                                )
                              }
                            >
                              Design an app flow
                            </button>


                            <button
                              onClick={() =>
                                setInput(
                                  "What can you help me do?"
                                )
                              }
                            >
                              What can you do?
                            </button>

                          </div>

                        </div>

                      )}


                      {messages.map(
                        message => (

                          <div
                            key={
                              message.id
                            }
                            className={
                              message.role ===
                              "user"
                                ? "message-row user-row"
                                : "message-row assistant-row"
                            }
                          >

                            <div
                              className={
                                message.role ===
                                "user"
                                  ? "message-bubble user-message"
                                  : `message-bubble assistant-message ${
                                      message.error
                                        ? "error-message"
                                        : ""
                                    }`
                              }
                            >

                              <div
                                className="message-label"
                              >

                                {message.role ===
                                "user"
                                  ? "YOU"
                                  : currentAgent.name}

                              </div>


                              <div
                                className="message-content"
                              >

                                {message.content
                                  .split("\n")
                                  .map(
                                    (
                                      line,
                                      index
                                    ) => (

                                      <React.Fragment
                                        key={
                                          index
                                        }
                                      >

                                        {line}

                                        {index <
                                          message.content.split(
                                            "\n"
                                          ).length -
                                            1 && (
                                          <br />
                                        )}

                                      </React.Fragment>

                                    )
                                  )}

                              </div>

                            </div>

                          </div>

                        )
                      )}


                      {sending && (

                        <div
                          className="message-row assistant-row"
                        >

                          <div
                            className="message-bubble assistant-message"
                          >

                            <div
                              className="message-label"
                            >
                              {
                                currentAgent.name
                              }
                            </div>


                            <div
                              className="typing"
                            >

                              <span></span>
                              <span></span>
                              <span></span>

                              Thinking...

                            </div>

                          </div>

                        </div>

                      )}


                      <div
                        ref={
                          chatEnd
                        }
                      />

                    </div>


                    <div
                      className="chat-input-area"
                    >

                      <textarea
                        value={
                          input
                        }
                        onChange={
                          event =>
                            setInput(
                              event.target.value
                            )
                        }
                        onKeyDown={
                          handleInputKeyDown
                        }
                        placeholder={
                          `Message ${currentAgent.name}...`
                        }
                        rows="1"
                      />


                      <button
                        className="send-button"
                        onClick={
                          sendMessage
                        }
                        disabled={
                          sending ||
                          !input.trim()
                        }
                      >
                        ➤
                      </button>

                    </div>


                    <div
                      className="chat-footer"
                    >

